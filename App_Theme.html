<!--App_Theme.html-->
<script>
  /* ───────── 테마: 일본 역·열차 ─────────
   *  도시 색, 날짜 머리 승차권(きっぷ), 지금 선(今), 교통 장소 역 이름판(駅名標),
   *  사진 없음·실패 대체 그림, 홈 탑승권(여행 전), 날짜 탭·탭바 도시 색 */

  // 도시별 강조색: 오사카 주황(미도스지·도톤보리 간판), 교토 주홍(도리이), 나라 녹색(나라공원), 도쿄 JR 연두, 한국 파랑
  const CITY_COLORS = [
    [/오사카|大阪|Osaka/i, '#f76b15'],
    [/교토|京都|Kyoto/i, '#d6402b'],
    [/나라|奈良|Nara/i, '#2f9e44'],
    [/도쿄|東京|Tokyo|요코하마|横浜/i, '#4c9a2a'],
    [/고베|神戸|Kobe/i, '#0b7285'],
    [/인천|서울|김포|부산|한국/i, '#2b62d9'],
  ];
  function cityColor(name) {
    for (const [re, c] of CITY_COLORS) if (re.test(name || '')) return c;
    return '';
  }
  // 그날 대표 도시 (교통 말고 가장 많이 나오는 도시)
  function dayCity(date) {
    const cnt = {};
    DATA.points.filter(p => p.date === date).forEach(p => {
      const pl = placeOf(p);
      if (!pl || !pl.city) return;
      cnt[pl.city] = (cnt[pl.city] || 0) + (pl.type === '교통' ? 0.3 : 1);
    });
    const name = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || '';
    return { name: name, color: cityColor(name) || 'var(--ink)' };
  }
  // 그날 지나는 도시 순서 (연속 중복 제거)
  function dayRoute(date) {
    const out = [];
    DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order).forEach(p => {
      const pl = placeOf(p);
      const c = pl && pl.city;
      if (c && out[out.length - 1] !== c) out.push(c);
    });
    return out;
  }

  /* ── 날짜 머리: 승차권 ── */
  function kippuHead(date, inner) {
    const nt = tokyoNow();
    const i = DATA.dates.indexOf(date);
    const city = dayCity(date);
    const route = dayRoute(date);
    const past = date < nt.date;
    const today = date === nt.date;
    return '<section class="kippu' + (today ? ' today' : '') + '" style="--city:' + city.color + '">' +
      '<div class="kp-top"><span>乗車券 · ' + (i + 1) + '일차</span><span class="kp-no">No.' + String(i + 1).padStart(4, '0') + '</span></div>' +
      '<div class="kp-main"><h2 class="tl-day">' + dayLabel(date) + '</h2>' +
        (route.length ? '<div class="kp-route">' + route.map(c => '<span style="--cc:' + (cityColor(c) || 'var(--ink)') + '">' + esc(c) + '</span>').join('<i>→</i>') + '</div>' : '') +
      '</div>' +
      '<div class="kp-body">' + inner + '</div>' +
      (past ? '<span class="kp-stamp" aria-label="지난 날">済</span>' : today ? '<span class="kp-today">本日</span>' : '') +
      '</section>';
  }

  /* ── 지금 선 ── */
  function nowLineHtml(min) {
    return '<div class="tnow" role="separator" aria-label="지금 ' + hhmm(min) + '"><div class="tn-t"><b>今</b><span>' + hhmm(min) + '</span></div><div class="tn-l"></div></div>';
  }

  /* ── 장소 종류 그림 (사진 없음·실패 대체) ── */
  const TYPE_ICONS = {
    '교통': '<rect x="6" y="3" width="12" height="13" rx="3"/><path d="M6 10h12M9 19l-2 2M15 19l2 2"/><circle cx="9" cy="13" r=".8"/><circle cx="15" cy="13" r=".8"/>',
    '식당': '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/>',
    '카페': '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 4v2M12 4v2"/>',
    '숙소': '<path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/>',
    '관광지': '<path d="M3 6c4 1 14 1 18 0M5 9h14M7 6v14M17 6v14"/>',
    '쇼핑': '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    '기타': '<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  };
  function typeIcon(type, size) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 22) + '" height="' + (size || 22) + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (TYPE_ICONS[type] || TYPE_ICONS['기타']) + '</svg>';
  }
  function emblem(type) { return '<span class="emblem" aria-hidden="true">' + typeIcon(type, 20) + '</span>'; }

  // 사진 실패: 카드 사진은 종류 그림으로, 갤러리 사진은 빼고(다 빠지면 갤러리째), 지도 핀 사진은 그림으로
  document.addEventListener('error', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || img.dataset.fb) return;
    img.dataset.fb = '1';
    const card = img.closest('[class*=" t-"], [class^="t-"]');
    const type = card ? (Array.from(card.classList).find(c => c.indexOf('t-') === 0) || 't-기타').slice(2) : '기타';
    if (img.matches('.gallery img')) {
      const g = img.parentNode;
      img.remove();
      if (g && !g.querySelector('img')) g.remove();
      return;
    }
    if (img.matches('.tcard .photo, .ph, .pin-photo img, .dex-list .ic img, .pp-media img, .photo')) {
      const fb = document.createElement('span');
      fb.className = (img.className || '') + ' photo-fb';
      fb.innerHTML = typeIcon(type, img.matches('.tcard .photo') ? 30 : 22);
      img.replaceWith(fb);
    }
  }, true);

  /* ── 교통 장소: 역 이름판 ── */
  function segColor(s, fromEnd) {
    if (!s) return '';
    const rides = Array.isArray(s.steps) ? s.steps.filter(x => x.t === 'transit') : [];
    const r = fromEnd ? rides[rides.length - 1] : rides[0];
    if (r) return r.color || lineColor(r.line + ' ' + (r.full || ''));
    return '';
  }
  function stationSign(p, pts, segs) {
    const i = pts.indexOf(p);
    const prev = i > 0 ? pts[i - 1] : null, next = i < pts.length - 1 ? pts[i + 1] : null;
    const out = segs.find(x => x.fromOrder === p.order), inn = segs.find(x => x.toOrder === p.order);
    const pl = placeOf(p);
    const c = segColor(out, false) || segColor(inn, true) || lineColor(pname(p)) || 'var(--t, var(--ink))';
    const sub = pl && pl.name && pl.name !== pname(p) ? pl.name : (pname(p) !== p.place ? p.place : '');
    return '<div class="ekimei" style="--lc:' + esc(c) + '">' +
      '<div class="ek-name"><h3>' + esc(pname(p)) + '</h3>' + (sub ? '<span class="ek-sub">' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="ek-bar"><span class="ek-prev">' + (prev ? '← ' + esc(pname(prev)) : '') + '</span>' +
        '<span class="ek-next">' + (next ? esc(pname(next)) + ' →' : '') + '</span></div></div>';
  }

  /* ── 날짜 탭·탭바: 그날 도시 색 ── */
  const renderTabs_theme = renderTabs;
  renderTabs = function () {
    renderTabs_theme();
    document.querySelectorAll('#days .day[data-id]').forEach(b => {
      if (b.dataset.id !== 'all') b.style.setProperty('--city', dayCity(b.dataset.id).color);
    });
    paintBodyCity();
  };
  function paintBodyCity() {
    if (!DATA) return;
    const nt = tokyoNow().date;
    const d = selected && selected !== 'all' ? selected : (DATA.dates.indexOf(nt) >= 0 ? nt : '');
    const c = d ? dayCity(d).color : 'var(--ink)';
    document.body.style.setProperty('--city', c);
    const range = tripRange();
    const now = new Date();
    document.body.classList.toggle('trip-live', !!range && now >= range.start && now <= range.end);
  }

  /* ── 홈: 여행 전 탑승권 ── */
  function boardingPass() {
    const range = tripRange();
    if (!range || new Date() >= range.start) return '';
    const pts = sortedPoints();
    const cityOf = p => { const pl = placeOf(p); return pl && pl.city ? pl.city : ''; };
    const from = cityOf(pts[0]) || pname(pts[0]);
    const toPt = pts.find(p => cityOf(p) && cityOf(p) !== cityOf(pts[0]));
    const to = toPt ? cityOf(toPt) : (pts.length > 1 ? pname(pts[pts.length - 1]) : '');
    const days = Math.ceil((range.start - new Date()) / 86400000);
    const color = cityColor(to) || 'var(--ink)';
    return '<div class="bpass" style="--city:' + color + '">' +
      '<div class="bp-main">' +
        '<div class="bp-label">BOARDING PASS · 탑승권</div>' +
        '<div class="bp-route"><div><small>FROM</small><b>' + esc(from) + '</b></div>' +
          '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13l8-1 6-7h2l-3 7 5 .5L22 11h1l-1 3 1 3h-1l-2-1.5-5 .5 3 7h-2l-6-7-8-1z"/></svg>' +
          '<div><small>TO</small><b>' + esc(to) + '</b></div></div>' +
        '<div class="bp-grid">' +
          '<div><small>DATE</small><b>' + esc(dayLabel(range.first.date)) + '</b></div>' +
          '<div><small>DEPART</small><b>' + esc(range.first.arrive || range.first.depart || '') + '</b></div>' +
          '<div><small>PASSENGER</small><b>' + esc(USER ? USER.id : '-') + '</b></div>' +
          '<div><small>DAYS</small><b>' + DATA.dates.length + '일</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="bp-stub"><small>D-DAY</small><b>D-' + days + '</b><span class="bp-bar" aria-hidden="true"></span></div>' +
      '</div>';
  }
  const renderHomeBody_theme = renderHomeBody;
  renderHomeBody = function () {
    renderHomeBody_theme();
    paintBodyCity();
    const bp = boardingPass();
    if (bp) document.getElementById('homeBody').insertAdjacentHTML('afterbegin', bp);
  };

  /* ── 지금 선이 낡지 않게: 타임라인 보는 중이면 2분마다 다시 그림 (입력 중이면 건너뜀) ── */
  setInterval(() => {
    if (currentView !== 'tl' || !DATA) return;
    const a = document.activeElement;
    if ((a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || document.querySelector('.spend-form.open, .arr-form.open, .edit-row.open, .sheet-wrap.open, .detail-wrap.open')) return;
    if (!document.querySelector('#tlInner .tnow')) return;
    renderTimeline();
  }, 120000);

  /* ───────── 개조 2차: 탭 4개 · 카드 버튼·접기 · 지도 아래 시트 · 야외 모드 ───────── */

  /* ── 탭 묶음: 홈 / 일정(타임라인·지도) / 장소(추천 가이드·도감) / 여권 ── */
  const VIEW_GROUP = { home: 'home', wrap: 'home', plan: 'sched', tl: 'sched', area: 'place', guide: 'place', pass: 'pass' };
  const GROUP_LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  let lastPlace = GROUP_LS('trip-last-place') || 'area';
  // 일정 탭은 항상 지도부터
  function goGroup(g) {
    setView(g === 'sched' ? 'plan' : g === 'place' ? lastPlace : g);
  }
  window.goGroup = goGroup;
  window.VIEW_GROUP = VIEW_GROUP;
  // 헤더: 지도 → "일정", 가이드 → "장소" (타임라인·도감 버튼은 숨기고 아래 줄 전환으로)
  document.getElementById('viewPlan').textContent = '일정';
  document.getElementById('viewArea').textContent = '장소';
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('#viewPlan, #viewArea');
    if (!b) return;
    e.stopPropagation();
    goGroup(b.id === 'viewPlan' ? 'sched' : 'place');
  }, true);
  // 일정·장소 안에서 바꾸는 작은 전환줄 (헤더 아래)
  const subnav = document.createElement('div');
  subnav.className = 'subnav';
  subnav.innerHTML =
    '<div class="sn-group" data-g="sched" role="group" aria-label="일정 보기"><button type="button" data-v="plan">지도</button><button type="button" data-v="tl">타임라인</button></div>' +
    '<div class="sn-group" data-g="place" role="group" aria-label="장소 보기"><button type="button" data-v="area">추천 가이드</button><button type="button" data-v="guide">도감</button></div>';
  subnav.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
  document.querySelector('header').appendChild(subnav);
  const setView_theme = setView;
  setView = function (v) {
    setView_theme(v);
    if (v === 'area' || v === 'guide') { lastPlace = v; try { localStorage.setItem('trip-last-place', v); } catch (e) { /* 무시 */ } }
    paintGroups();
  };
  function paintGroups() {
    const g = VIEW_GROUP[currentView] || '';
    document.getElementById('viewPlan').setAttribute('aria-pressed', String(g === 'sched'));
    document.getElementById('viewArea').setAttribute('aria-pressed', String(g === 'place'));
    subnav.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === currentView)));
    if (currentView === 'plan') setTimeout(sheetSnap, 0);
  }
  paintGroups();

  /* ── 카드: 한 줄 요약 · 큰 버튼 · 더보기 시트 · 접기/펼치기 ── */
  function tsumHtml(p, hf) {
    const bits = [];
    if (p.stay) bits.push('체류 ' + p.stay + '분');
    if (hf) bits.push(hf.closed ? '휴무' : '영업 ' + hf.text);
    if (p.yen != null && !isNaN(p.yen)) bits.push('예산 ' + YEN(p.yen));
    return '<div class="tsum">' + esc(bits.join(' · ')) + '<span class="tfold" aria-hidden="true"></span></div>';
  }
  function priBtn(p, vk) {
    const a = arrivedAt(p);
    if (a) return '<button class="pri has" type="button" data-vk="' + vk + '">✓ 도착 ' + esc(a) + '</button>';
    if (isVisited(p)) return '<button class="pri has" type="button" data-vk="' + vk + '">✓ 방문함</button>';
    return '<button class="pri" type="button" data-vk="' + vk + '">도착</button>';
  }
  const TL_OPEN = new Set();
  document.addEventListener('click', e => {
    const t = e.target;
    if (!t.closest) return;
    const pri = t.closest('.tcard .pri');
    if (pri) {
      if (!pri.classList.contains('has')) { recordArrivalNow(pri.dataset.vk); return; }
      return moreSheet(pri.closest('.tcard'));
    }
    const more = t.closest('.tcard .more-btn');
    if (more) return moreSheet(more.closest('.tcard'));
    // 카드 빈 곳 누르면 접기/펼치기 (버튼·링크·입력칸은 제외)
    const card = t.closest('#tlInner .tcard');
    if (!card || t.closest('button, a, input, select, textarea, label, .spend-form, .arr-form, .edit-row, .taxi-box, img.photo')) return;
    const key = card.closest('.titem') && card.closest('.titem').dataset.key;
    card.classList.toggle('open');
    if (key) { if (card.classList.contains('open')) TL_OPEN.add(key); else TL_OPEN.delete(key); }
  });
  function moreSheet(card) {
    if (!card) return;
    const box = card.querySelector('.act-more');
    const guest = document.body.classList.contains('guest'), noedit = document.body.classList.contains('noedit');
    const acts = [];
    const add = (sel, label, skip) => { const b = box && box.querySelector(sel); if (b && !skip) acts.push({ label: label(b), fn: () => { card.classList.add('open'); b.click(); } }); };
    add('.arr-btn', b => b.classList.contains('has') ? '도착 시각 고치기 (' + b.textContent.replace('도착 ', '') + ')' : '지금 도착으로 기록', guest);
    add('.visit', b => b.getAttribute('aria-pressed') === 'true' ? '방문 체크 해제' : '방문 체크만 (도착 시각 없이)', guest);
    add('.spend-btn', b => b.classList.contains('has') ? b.textContent + ' 고치기' : '지출 입력', guest);
    add('.edit-btn', () => '일정 조정 (체류 ±15분·건너뛰기)', noedit);
    add('.share-btn', () => '공유');
    add('.linkbtn', () => '도감에서 보기');
    const h3 = card.querySelector('h3');
    if (acts.length) openSheet(h3 ? h3.textContent : '', acts);
  }
  const renderTimeline_theme = renderTimeline;
  renderTimeline = function () {
    renderTimeline_theme();
    document.querySelectorAll('#tlInner .titem[data-key]').forEach(it => {
      const c = it.querySelector('.tcard');
      if (!c) return;
      // 펼칠 게 없는 카드는 요약 줄·화살표 없앰
      const ts = c.querySelector('.tsum');
      if (ts && !ts.textContent.trim() && !c.querySelector('.facts, .chips, .note:not(.memo), .slack.ok')) ts.remove();
      if (TL_OPEN.has(it.dataset.key)) c.classList.add('open');
    });
  };

  /* ── 지도 화면(폰): 목록을 아래에서 끌어올리는 시트로 ── */
  const SHEET_SNAPS = [0.2, 0.5, 0.88];
  let sheetIdx = Number(GROUP_LS('trip-sheet-snap') || 1);
  const mainEl = document.querySelector('main');
  const grip = document.createElement('div');
  grip.className = 'list-grip';
  grip.setAttribute('role', 'button');
  grip.setAttribute('aria-label', '목록 높이 바꾸기');
  grip.innerHTML = '<span></span>';
  mainEl.appendChild(grip);
  const sheetMode = () => matchMedia('(max-width: 800px)').matches;
  function setSheetH(px, anim) {
    mainEl.classList.toggle('sheet-drag', !anim);
    mainEl.style.setProperty('--sheet-h', Math.round(px) + 'px');
  }
  function sheetSnap(i) {
    if (!sheetMode()) return;
    if (i != null) { sheetIdx = i; try { localStorage.setItem('trip-sheet-snap', String(i)); } catch (e) { /* 무시 */ } }
    setSheetH(mainEl.clientHeight * SHEET_SNAPS[sheetIdx], true);
  }
  (() => {
    let y0 = null, h0 = 0, moved = false;
    grip.addEventListener('pointerdown', e => {
      if (!sheetMode()) return;
      y0 = e.clientY; h0 = document.getElementById('list').getBoundingClientRect().height; moved = false;
      grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener('pointermove', e => {
      if (y0 == null) return;
      const dy = e.clientY - y0;
      if (Math.abs(dy) > 4) moved = true;
      if (moved) setSheetH(Math.min(mainEl.clientHeight * 0.92, Math.max(56, h0 - dy)), false);
    });
    const end = e => {
      if (y0 == null) return;
      y0 = null;
      if (!moved) return sheetSnap((sheetIdx + 1) % SHEET_SNAPS.length);   // 그냥 누르면 다음 높이
      const h = document.getElementById('list').getBoundingClientRect().height / mainEl.clientHeight;
      let best = 0;
      SHEET_SNAPS.forEach((v, i) => { if (Math.abs(v - h) < Math.abs(SHEET_SNAPS[best] - h)) best = i; });
      sheetSnap(best);
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  })();
  addEventListener('resize', () => { if (currentView === 'plan') sheetSnap(); });

  /* ── 야외 모드: 햇빛 아래에서 회색 글씨·선을 진하게 ── */
  const OUT_KEY = 'trip-outdoor';
  function setOutdoor(on) {
    document.body.classList.toggle('outdoor', on);
    try { localStorage.setItem(OUT_KEY, on ? '1' : '0'); } catch (e) { /* 무시 */ }
  }
  setOutdoor(GROUP_LS(OUT_KEY) === '1');
  /* ── 설정 창 (헤더 톱니바퀴): 각 기능이 TRIP_SETTINGS에 칸을 등록 ── */
  window.TRIP_SETTINGS = window.TRIP_SETTINGS || [];
  const gear = document.createElement('button');
  gear.type = 'button'; gear.id = 'gearBtn'; gear.className = 'reload gear'; gear.title = '설정'; gear.setAttribute('aria-label', '설정');
  gear.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
  const reloadBtn = document.getElementById('reload');
  reloadBtn.parentNode.insertBefore(gear, reloadBtn);
  const setWrap = document.createElement('div');
  setWrap.className = 'set-wrap'; setWrap.id = 'setWrap';
  setWrap.innerHTML = '<div class="set-panel" role="dialog" aria-modal="true" aria-labelledby="setTitle">' +
    '<div class="set-head"><h2 id="setTitle">설정</h2><button type="button" class="btn set-close">닫기</button></div><div id="setBody"></div></div>';
  document.body.appendChild(setWrap);
  function openSettings() {
    const body = document.getElementById('setBody');
    body.innerHTML = '';
    window.TRIP_SETTINGS.forEach(fn => { try { fn(body); } catch (e) { console.warn('설정 칸 오류', e); } });
    setWrap.classList.add('open');
    setWrap.querySelector('.set-close').focus();
  }
  function closeSettings() { setWrap.classList.remove('open'); gear.focus(); }
  gear.addEventListener('click', openSettings);
  setWrap.querySelector('.set-close').addEventListener('click', closeSettings);
  setWrap.addEventListener('click', e => { if (e.target === setWrap) closeSettings(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && setWrap.classList.contains('open')) closeSettings(); });
  window.TRIP_SETTINGS.push(box => {
    const on = document.body.classList.contains('outdoor');
    box.insertAdjacentHTML('beforeend', '<div class="hcard"><h3 class="set-h">화면</h3>' +
      '<p class="set-p">야외 모드: 햇빛 아래에서 잘 보이게 흐린 글씨·선을 진하게</p>' +
      '<label class="chk"><input type="checkbox" id="outdoorOn"' + (on ? ' checked' : '') + '><span>야외 모드 켜기</span></label></div>');
    document.getElementById('outdoorOn').onchange = e => setOutdoor(e.target.checked);
  });

  /* ── 여권: 표지·쪽 높이를 가장 긴 쪽에 맞춤 (짧은 표지 뒤로 다음 쪽 모서리가 보이던 것) ── */
  function evenPassPages() {
    const slides = document.querySelectorAll('.pass-swiper .swiper-slide > .pass-cover, .pass-swiper .swiper-slide > .pass-page');
    if (!slides.length) return;
    slides.forEach(el => { el.style.minHeight = ''; });
    const max = Math.max.apply(null, Array.from(slides).map(el => el.offsetHeight));
    if (max > 0) slides.forEach(el => { el.style.minHeight = max + 'px'; });
    try { if (passSwiper) passSwiper.updateAutoHeight(0); } catch (e) { /* 무시 */ }
  }
  const renderPass_theme = renderPass;
  renderPass = function () {
    renderPass_theme();
    requestAnimationFrame(evenPassPages);
  };
  addEventListener('resize', () => { if (currentView === 'pass') evenPassPages(); });

  /* ───────── 보는 맛 ───────── */

  /* ── 하루 끝 영수증 (오잇트립) ── */
  const RC_SHOP = '오잇트립', RC_SHOP_EN = 'TRAVEL RECEIPT';
  function receiptData(date, pts) {
    pts = pts || DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order);
    const nt = tokyoNow();
    const items = pts.map(p => {
      const vk = p.date + '#' + p.order;
      const sp = DATA.spend && DATA.spend[vk];
      return { time: arrivedAt(p) || p.arrive || '', name: pname(p), done: isVisited(p), amount: sp ? Number(sp.amount) || 0 : null,
        memo: sp && sp.memo ? sp.memo : '', budget: p.per != null && !isNaN(p.per) ? p.per : null };
    });
    let fare = 0;
    pts.forEach(p => {
      const s2 = DATA.segments.find(x => x.date === p.date && x.fromOrder === p.order);
      if (s2 && p.fare != null && !isNaN(p.fare)) fare += Number(p.fare);
    });
    const spent = items.reduce((a, x) => a + (x.amount || 0), 0);
    // 예산: 일정 시트 '예산 번호'로 연결된 예산 시트 '1인당 비용' (원화 환산값 p.per → money()로 엔화). 같은 예산 번호는 한 번만
    const seenB = {};
    let budget = 0;
    pts.forEach(p => {
      if (p.per == null || isNaN(p.per)) return;
      const k = p.budgetId || (p.date + '#' + p.order);
      if (seenB[k]) return;
      seenB[k] = 1;
      budget += Number(p.per) || 0;
    });
    const w = DATA.walk && DATA.walk[date];
    return {
      date: date, no: DATA.dates.indexOf(date) + 1, user: USER ? USER.id : '-', city: dayRoute(date).join(' → '),
      items: items, stamps: items.filter(x => x.done).length, total: items.length,
      walkKm: w && w.m ? w.m / 1000 : null, walkMin: w && w.min ? w.min : null,
      fare: fare, spent: spent, budget: budget, sum: spent + fare,
      planned: date > nt.date || (date === nt.date && !items.some(x => x.done || x.amount)),
    };
  }
  function receiptHtml(date, pts) {
    const r = receiptData(date, pts);
    const row = (a, b, cls) => '<div class="rc-row' + (cls ? ' ' + cls : '') + '"><span>' + a + '</span><b>' + b + '</b></div>';
    return '<section class="receipt" aria-label="' + esc(dayLabel(date)) + ' 영수증">' +
      '<div class="rc-paper">' +
        '<div class="rc-shop">' + RC_SHOP + '</div><div class="rc-shop-en">' + RC_SHOP_EN + (r.planned ? ' (예정)' : '') + '</div>' +
        '<div class="rc-sep"></div>' +
        row(esc(dayLabel(date)) + ' · ' + r.no + '일차', 'No.' + String(r.no).padStart(4, '0')) +
        row('여행자', esc(r.user)) + (r.city ? row('구간', esc(r.city)) : '') +
        '<div class="rc-sep"></div>' +
        r.items.map(x => '<div class="rc-item' + (x.done ? ' done' : '') + '"><span class="t">' + esc(x.time) + '</span><span class="n">' + esc(x.name) +
          (x.memo ? ' <i>' + esc(x.memo) + '</i>' : '') + '</span><b>' + (x.amount != null ? YEN(x.amount) : x.done ? '✓' : '') + '</b></div>').join('') +
        '<div class="rc-sep"></div>' +
        row('방문 도장', r.stamps + ' / ' + r.total) +
        (r.walkKm != null ? row('걸은 거리', r.walkKm.toFixed(1) + ' km' + (r.walkMin ? ' · ' + r.walkMin + '분' : '')) : '') +
        row('교통비 (1인)', YEN(r.fare)) +
        row('쓴 돈 (기록)', YEN(r.spent)) +
        (r.budget ? row('예산 (1인, 엔 환산)', money(r.budget), 'muted') : '') +
        '<div class="rc-sep dbl"></div>' +
        row('합계', YEN(r.sum), 'total') +
        '<div class="rc-bar" aria-hidden="true"></div>' +
        '<div class="rc-thanks">またお越しくださいませ · 또 와요</div>' +
      '</div>' +
      '<button type="button" class="rc-save" data-date="' + date + '">' +
        '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>영수증 저장</button>' +
      '</section>';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('.rc-save');
    if (b) saveReceipt(b.dataset.date);
  });
  // 영수증을 그림(PNG)으로: 캔버스에 직접 그림 → 폰은 공유 창(사진에 저장), 안 되면 다운로드
  async function saveReceipt(date) {
    const r = receiptData(date);
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) { /* 무시 */ }
    const W = 420, S = 3, P = 26;
    const sans = '"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
    const mono = '"DotGothic16", "Galmuri11", ui-monospace, monospace';
    const lines = [];   // 높이 계산 먼저
    const L2 = (h, fn) => lines.push({ h: h, fn: fn });
    const c = document.createElement('canvas');
    const g = c.getContext('2d');
    const text = (t, x, y, font, color, align) => { g.font = font; g.fillStyle = color || '#1f1a14'; g.textAlign = align || 'left'; g.fillText(t, x, y); };
    const fit = (t, max, font) => { g.font = font; if (g.measureText(t).width <= max) return t; while (t.length > 1 && g.measureText(t + '…').width > max) t = t.slice(0, -1); return t + '…'; };
    const sep = (dbl) => L2(18, y => {
      g.strokeStyle = '#8a7f6e'; g.lineWidth = 1; g.setLineDash(dbl ? [] : [4, 4]);
      g.beginPath(); g.moveTo(P, y + 9); g.lineTo(W - P, y + 9); g.stroke();
      if (dbl) { g.beginPath(); g.moveTo(P, y + 12); g.lineTo(W - P, y + 12); g.stroke(); }
      g.setLineDash([]);
    });
    const row = (a, b, opt) => L2(opt && opt.total ? 30 : 22, y => {
      const f = (opt && opt.total ? '700 18px ' : '14px ') + sans;
      text(a, P, y + 16, f, opt && opt.muted ? '#8a7f6e' : null);
      text(b, W - P, y + 16, (opt && opt.total ? '700 20px ' : '700 14px ') + sans, opt && opt.muted ? '#8a7f6e' : null, 'right');
    });
    L2(40, y => text(RC_SHOP, W / 2, y + 32, '700 30px ' + sans, null, 'center'));
    L2(22, y => text(RC_SHOP_EN + (r.planned ? ' (예정)' : ''), W / 2, y + 16, '12px ' + sans, '#6b6152', 'center'));
    sep();
    row(dayLabel(date) + ' · ' + r.no + '일차', 'No.' + String(r.no).padStart(4, '0'));
    row('여행자', r.user);
    if (r.city) row('구간', r.city);
    sep();
    r.items.forEach(x => L2(22, y => {
      text(x.time, P, y + 16, '15px ' + mono, '#4a4033');
      const amt = x.amount != null ? YEN(x.amount) : x.done ? '✓' : '';
      text(fit(x.name + (x.memo ? ' (' + x.memo + ')' : ''), W - P * 2 - 130, '14px ' + sans), P + 56, y + 16, '14px ' + sans, x.done || x.amount != null ? null : '#6b6152');
      text(amt, W - P, y + 16, '700 14px ' + sans, null, 'right');
    }));
    sep();
    row('방문 도장', r.stamps + ' / ' + r.total);
    if (r.walkKm != null) row('걸은 거리', r.walkKm.toFixed(1) + ' km' + (r.walkMin ? ' · ' + r.walkMin + '분' : ''));
    row('교통비 (1인)', YEN(r.fare));
    row('쓴 돈 (기록)', YEN(r.spent));
    if (r.budget) row('예산 (1인, 엔 환산)', money(r.budget), { muted: true });
    sep(true);
    row('합계', YEN(r.sum), { total: true });
    L2(58, y => {   // 바코드 (날짜·사용자로 고정된 무늬)
      let seed = 0; String(date + r.user).split('').forEach(ch => { seed = (seed * 31 + ch.charCodeAt(0)) >>> 0; });
      let x = P + 30;
      g.fillStyle = '#1f1a14';
      while (x < W - P - 30) { seed = (seed * 1103515245 + 12345) >>> 0; const w = 1 + (seed >>> 28) % 3; g.fillRect(x, y + 12, w, 38); x += w + 1 + ((seed >>> 24) % 3); }
    });
    L2(24, y => text('またお越しくださいませ · 또 와요', W / 2, y + 16, '12px ' + sans, '#6b6152', 'center'));
    const H = P + lines.reduce((a, l) => a + l.h, 0) + P;
    c.width = W * S; c.height = H * S;
    g.scale(S, S);
    // 종이 + 위아래 톱니
    g.fillStyle = '#fbf8f1';
    g.beginPath(); g.moveTo(0, 8);
    for (let x = 0; x <= W; x += 12) { g.lineTo(x + 6, 0); g.lineTo(Math.min(W, x + 12), 8); }
    g.lineTo(W, H - 8);
    for (let x = W; x >= 0; x -= 12) { g.lineTo(x - 6, H); g.lineTo(Math.max(0, x - 12), H - 8); }
    g.closePath(); g.fill();
    let y = P;
    lines.forEach(l => { l.fn(y); y += l.h; });
    const name = RC_SHOP + '_영수증_' + date + '.png';
    c.toBlob(async blob => {
      if (!blob) return showToast('영수증을 못 만듦');
      const file = typeof File === 'function' ? new File([blob], name, { type: 'image/png' }) : null;
      try {
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: RC_SHOP + ' 영수증' }); return; }
      } catch (e) { if (e && e.name === 'AbortError') return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      showToast('영수증 저장함');
    }, 'image/png');
  }
  window.saveReceipt = saveReceipt;

  /* ── 지도: 지나온 구간은 진하게, 남은 구간은 옅게 · 날짜 바꾸면 경로가 순서대로 그려짐 ── */
  function segPassed(s) {
    const nt = tokyoNow();
    if (s.date < nt.date) return true;
    const to = DATA.points.find(p => p.date === s.date && p.order === s.toOrder);
    if (to && arrivedAt(to)) return true;
    return s.date === nt.date && toMin(s.arr) != null && toMin(s.arr) <= nt.min;
  }
  function segLayers(s) { return groups['L:' + s.date + '#' + s.fromOrder + '#' + s.toOrder] || []; }
  function paintProgress() {
    if (!DATA || selected === 'all') return;
    const segs = DATA.segments.filter(s => s.date === selected);
    if (!segs.some(segPassed)) return;   // 아직 출발 전이면 그대로
    segs.filter(s => !segPassed(s)).forEach(s => segLayers(s).forEach(l => {
      if (!(l instanceof L.Path)) return;
      const base = l._fop != null ? l._fop : l.options.opacity;
      if (base == null || base < 0.05) return;
      l._fop = base * 0.35;
      l.setStyle({ opacity: l._fop });
    }));
  }
  let drawnDay = null;
  function animateRoute() {
    if (!DATA || selected === 'all' || currentView !== 'plan' || drawnDay === selected) return;
    drawnDay = selected;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const segs = DATA.segments.filter(s => s.date === selected).sort((a, b) => a.fromOrder - b.fromOrder);
    segs.forEach((s, i) => segLayers(s).forEach(l => {
      const el = l._path;
      if (!el || !(l instanceof L.Polyline)) return;
      const delay = i * 280;
      const dashed = el.getAttribute('stroke-dasharray');
      if (dashed) {
        el.style.opacity = '0';
        el.style.transition = 'opacity .45s ease ' + delay + 'ms';
        requestAnimationFrame(() => { el.style.opacity = ''; });
        setTimeout(() => { el.style.transition = ''; }, delay + 600);
        return;
      }
      let len = 0;
      try { len = el.getTotalLength(); } catch (e) { len = 0; }
      if (!len) return;
      el.style.strokeDasharray = len + ' ' + len;
      el.style.strokeDashoffset = String(len);
      el.style.transition = 'stroke-dashoffset .6s cubic-bezier(.4, 0, .2, 1) ' + delay + 'ms';
      requestAnimationFrame(() => requestAnimationFrame(() => { el.style.strokeDashoffset = '0'; }));
      setTimeout(() => { el.style.strokeDasharray = ''; el.style.strokeDashoffset = ''; el.style.transition = ''; }, delay + 700);
    }));
  }
  const renderMap_theme = renderMap_;
  renderMap_ = function () {
    renderMap_theme.apply(this, arguments);
    try { paintProgress(); } catch (e) { console.warn(e); }
    setTimeout(animateRoute, 60);
  };
  const setView_theme2 = setView;
  setView = function (v) { setView_theme2(v); if (v === 'plan') setTimeout(animateRoute, 380); };

  /* ── 지도(폰): 아래 목록을 좌우로 밀면 다음 날·전날 ── */
  (() => {
    const list = document.getElementById('list');
    let x0 = null, y0 = null;
    list.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, { passive: true });
    list.addEventListener('touchend', e => {
      if (x0 == null) return;
      const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) shiftDay(dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  /* ── 타임라인: 지난 구간 레일을 도시 색으로 채움 (역 줄까지) ── */
  const renderTimeline_theme2 = renderTimeline;
  renderTimeline = function () {
    renderTimeline_theme2();
    document.querySelectorAll('#tlInner .tmove.past').forEach(m => {
      let n = m.nextElementSibling;
      while (n && (n.classList.contains('tst') || n.classList.contains('tstep'))) { n.classList.add('past'); n = n.nextElementSibling; }
    });
  };

  /* ── 도장: 쾅 찍힐 때 화면 살짝 흔들림 + 진동 ── */
  const showStamp_theme = showStamp;
  showStamp = function (p) {
    showStamp_theme(p);
    if (navigator.vibrate) navigator.vibrate([14, 40, 26]);
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.body.classList.remove('stamp-hit'); void document.body.offsetWidth;
      setTimeout(() => document.body.classList.add('stamp-hit'), 250);
      setTimeout(() => document.body.classList.remove('stamp-hit'), 700);
    }
  };

  /* ── 도감·가이드 사진: 위아래 빈 곳을 같은 사진 흐리게 깔아서 채움 ── */
  document.addEventListener('load', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    const box = img.closest('.pp-media');
    if (!box || box.classList.contains('has-bg')) return;
    box.style.setProperty('--ppbg', 'url("' + String(img.currentSrc || img.src).replace(/"/g, '%22') + '")');
    box.classList.add('has-bg');
  }, true);

  /* ── 불러오는 중: 빈 화면 대신 카드 모양 자리표시 ── */
  const skel = document.createElement('div');
  skel.className = 'skel';
  skel.setAttribute('aria-hidden', 'true');
  skel.innerHTML = '<div class="sk-col"><i class="sk b"></i><i class="sk"></i><i class="sk"></i><i class="sk s"></i></div>';
  document.body.appendChild(skel);
  document.body.classList.add('booting');
  setTimeout(() => document.body.classList.remove('booting'), 20000);   // 연결 실패로 끝내 못 받아도 영원히 남지 않게
  const applyData_theme = applyData;
  applyData = function () {
    const r = applyData_theme.apply(this, arguments);
    document.body.classList.remove('booting');
    return r;
  };
</script>
