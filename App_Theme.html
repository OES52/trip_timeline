<!--App_Theme.html-->
<script>
  /* ───────── 테마: 일본 역·열차 ─────────
   *  도시 색, 날짜 머리 승차권(きっぷ), 지금 선(今), 교통 장소 역 이름판(駅名標),
   *  사진 없음·실패 대체 그림, 홈 탑승권(여행 전), 날짜 탭·탭바 도시 색 */

  // 도시별 강조색: 오사카 주황(미도스지·도톤보리 간판), 교토 주홍(도리이), 나라 녹색(나라공원), 도쿄 JR 연두, 한국 파랑
  const CITY_COLORS = [
    [/오사카|大阪|Osaka/i, '#f76b15'],
    [/교토|京都|Kyoto/i, '#d6402b'],
    [/나라|奈良|Nara/i, '#2f9e44'],
    [/도쿄|東京|Tokyo|요코하마|横浜/i, '#4c9a2a'],
    [/고베|神戸|Kobe/i, '#0b7285'],
    [/인천|서울|김포|부산|한국/i, '#2b62d9'],
  ];
  function cityColor(name) {
    for (const [re, c] of CITY_COLORS) if (re.test(name || '')) return c;
    return '';
  }
  // 그날 대표 도시 (교통 말고 가장 많이 나오는 도시)
  function dayCity(date) {
    const cnt = {};
    DATA.points.filter(p => p.date === date).forEach(p => {
      const pl = placeOf(p);
      if (!pl || !pl.city) return;
      cnt[pl.city] = (cnt[pl.city] || 0) + (pl.type === '교통' ? 0.3 : 1);
    });
    const name = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || '';
    return { name: name, color: cityColor(name) || 'var(--ink)' };
  }
  // 그날 지나는 도시 순서 (연속 중복 제거)
  function dayRoute(date) {
    const out = [];
    DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order).forEach(p => {
      const pl = placeOf(p);
      const c = pl && pl.city;
      if (c && out[out.length - 1] !== c) out.push(c);
    });
    return out;
  }

  /* ── 날짜 머리: 승차권 ── */
  function kippuHead(date, inner) {
    const nt = tokyoNow();
    const i = DATA.dates.indexOf(date);
    const city = dayCity(date);
    const route = dayRoute(date);
    const past = date < nt.date;
    const today = date === nt.date;
    return '<section class="kippu' + (today ? ' today' : '') + '" style="--city:' + city.color + '">' +
      '<div class="kp-top"><span>乗車券 · ' + (i + 1) + '일차</span><span class="kp-no">No.' + String(i + 1).padStart(4, '0') + '</span></div>' +
      '<div class="kp-main"><h2 class="tl-day">' + dayLabel(date) + '</h2>' +
        (route.length ? '<div class="kp-route">' + route.map(c => '<span style="--cc:' + (cityColor(c) || 'var(--ink)') + '">' + esc(c) + '</span>').join('<i>→</i>') + '</div>' : '') +
      '</div>' +
      '<div class="kp-body">' + inner + '</div>' +
      (past ? '<span class="kp-stamp" aria-label="지난 날">済</span>' : today ? '<span class="kp-today">本日</span>' : '') +
      '</section>';
  }

  /* ── 지금 선 ── */
  function nowLineHtml(min) {
    return '<div class="tnow" role="separator" aria-label="지금 ' + hhmm(min) + '"><div class="tn-t"><b>今</b><span>' + hhmm(min) + '</span></div><div class="tn-l"></div></div>';
  }

  /* ── 장소 종류 그림 (사진 없음·실패 대체) ── */
  const TYPE_ICONS = {
    '교통': '<rect x="6" y="3" width="12" height="13" rx="3"/><path d="M6 10h12M9 19l-2 2M15 19l2 2"/><circle cx="9" cy="13" r=".8"/><circle cx="15" cy="13" r=".8"/>',
    '식당': '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-1.5 1-3M12 7c0-1.5 1-1.5 1-3M16 7c0-1.5 1-1.5 1-3"/>',
    '카페': '<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M9 4v2M12 4v2"/>',
    '숙소': '<path d="M3 18V8M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5"/><circle cx="7" cy="11" r="1.6"/>',
    '관광지': '<path d="M3 6c4 1 14 1 18 0M5 9h14M7 6v14M17 6v14"/>',
    '쇼핑': '<path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
    '기타': '<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  };
  function typeIcon(type, size) {
    return '<svg viewBox="0 0 24 24" width="' + (size || 22) + '" height="' + (size || 22) + '" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (TYPE_ICONS[type] || TYPE_ICONS['기타']) + '</svg>';
  }
  function emblem(type) { return '<span class="emblem" aria-hidden="true">' + typeIcon(type, 20) + '</span>'; }

  // 사진 실패: 카드 사진은 종류 그림으로, 갤러리 사진은 빼고(다 빠지면 갤러리째), 지도 핀 사진은 그림으로
  document.addEventListener('error', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || img.dataset.fb) return;
    img.dataset.fb = '1';
    const card = img.closest('[class*=" t-"], [class^="t-"]');
    const type = card ? (Array.from(card.classList).find(c => c.indexOf('t-') === 0) || 't-기타').slice(2) : '기타';
    if (img.matches('.gallery img')) {
      const g = img.parentNode;
      img.remove();
      if (g && !g.querySelector('img')) g.remove();
      return;
    }
    if (img.matches('.tcard .photo, .ph, .pin-photo img, .dex-list .ic img, .pp-media img, .photo')) {
      const fb = document.createElement('span');
      fb.className = (img.className || '') + ' photo-fb';
      fb.innerHTML = typeIcon(type, img.matches('.tcard .photo') ? 30 : 22);
      img.replaceWith(fb);
    }
  }, true);

  /* ── 교통 장소: 역 이름판 ── */
  function segColor(s, fromEnd) {
    if (!s) return '';
    const rides = Array.isArray(s.steps) ? s.steps.filter(x => x.t === 'transit') : [];
    const r = fromEnd ? rides[rides.length - 1] : rides[0];
    if (r) return r.color || lineColor(r.line + ' ' + (r.full || ''));
    return '';
  }
  function stationSign(p, pts, segs) {
    const i = pts.indexOf(p);
    const prev = i > 0 ? pts[i - 1] : null, next = i < pts.length - 1 ? pts[i + 1] : null;
    const out = segs.find(x => x.fromOrder === p.order), inn = segs.find(x => x.toOrder === p.order);
    const pl = placeOf(p);
    const c = segColor(out, false) || segColor(inn, true) || lineColor(pname(p)) || 'var(--t, var(--ink))';
    const sub = pl && pl.name && pl.name !== pname(p) ? pl.name : (pname(p) !== p.place ? p.place : '');
    return '<div class="ekimei" style="--lc:' + esc(c) + '">' +
      '<div class="ek-name"><h3>' + esc(pname(p)) + '</h3>' + (sub ? '<span class="ek-sub">' + esc(sub) + '</span>' : '') + '</div>' +
      '<div class="ek-bar"><span class="ek-prev">' + (prev ? '← ' + esc(pname(prev)) : '') + '</span>' +
        '<span class="ek-next">' + (next ? esc(pname(next)) + ' →' : '') + '</span></div></div>';
  }

  /* ── 날짜 탭·탭바: 그날 도시 색 ── */
  const renderTabs_theme = renderTabs;
  renderTabs = function () {
    renderTabs_theme();
    document.querySelectorAll('#days .day[data-id]').forEach(b => {
      if (b.dataset.id !== 'all') b.style.setProperty('--city', dayCity(b.dataset.id).color);
    });
    paintBodyCity();
  };
  function paintBodyCity() {
    if (!DATA) return;
    const nt = tokyoNow().date;
    const d = selected && selected !== 'all' ? selected : (DATA.dates.indexOf(nt) >= 0 ? nt : '');
    const c = d ? dayCity(d).color : 'var(--ink)';
    document.body.style.setProperty('--city', c);
    const range = tripRange();
    const now = new Date();
    document.body.classList.toggle('trip-live', !!range && now >= range.start && now <= range.end);
  }

  /* ── 홈: 여행 전 탑승권 ── */
  function boardingPass() {
    const range = tripRange();
    if (!range || new Date() >= range.start) return '';
    const pts = sortedPoints();
    const cityOf = p => { const pl = placeOf(p); return pl && pl.city ? pl.city : ''; };
    const from = cityOf(pts[0]) || pname(pts[0]);
    const toPt = pts.find(p => cityOf(p) && cityOf(p) !== cityOf(pts[0]));
    const to = toPt ? cityOf(toPt) : (pts.length > 1 ? pname(pts[pts.length - 1]) : '');
    const days = Math.ceil((range.start - new Date()) / 86400000);
    const color = cityColor(to) || 'var(--ink)';
    return '<div class="bpass" style="--city:' + color + '">' +
      '<div class="bp-main">' +
        '<div class="bp-label">BOARDING PASS · 탑승권</div>' +
        '<div class="bp-route"><div><small>FROM</small><b>' + esc(from) + '</b></div>' +
          '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 13l8-1 6-7h2l-3 7 5 .5L22 11h1l-1 3 1 3h-1l-2-1.5-5 .5 3 7h-2l-6-7-8-1z"/></svg>' +
          '<div><small>TO</small><b>' + esc(to) + '</b></div></div>' +
        '<div class="bp-grid">' +
          '<div><small>DATE</small><b>' + esc(dayLabel(range.first.date)) + '</b></div>' +
          '<div><small>DEPART</small><b>' + esc(range.first.arrive || range.first.depart || '') + '</b></div>' +
          '<div><small>PASSENGER</small><b>' + esc(USER ? USER.id : '-') + '</b></div>' +
          '<div><small>DAYS</small><b>' + DATA.dates.length + '일</b></div>' +
        '</div>' +
      '</div>' +
      '<div class="bp-stub"><small>D-DAY</small><b>D-' + days + '</b><span class="bp-bar" aria-hidden="true"></span></div>' +
      '</div>';
  }
  const renderHomeBody_theme = renderHomeBody;
  renderHomeBody = function () {
    renderHomeBody_theme();
    paintBodyCity();
    const bp = boardingPass();
    if (bp) document.getElementById('homeBody').insertAdjacentHTML('afterbegin', bp);
  };

  /* ── 지금 선이 낡지 않게: 타임라인 보는 중이면 2분마다 다시 그림 (입력 중이면 건너뜀) ── */
  setInterval(() => {
    if (currentView !== 'tl' || !DATA) return;
    const a = document.activeElement;
    if ((a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || document.querySelector('.spend-form.open, .arr-form.open, .edit-row.open, .sheet-wrap.open, .detail-wrap.open')) return;
    if (!document.querySelector('#tlInner .tnow')) return;
    renderTimeline();
  }, 120000);

  /* ───────── 개조 2차: 탭 4개 · 카드 버튼·접기 · 지도 아래 시트 · 야외 모드 ───────── */

  /* ── 탭 묶음: 홈 / 일정(타임라인·지도) / 장소(추천 가이드·도감) / 여권 ── */
  const VIEW_GROUP = { home: 'home', wrap: 'home', plan: 'sched', tl: 'sched', area: 'place', guide: 'place', pass: 'pass' };
  const GROUP_LS = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  let lastPlace = GROUP_LS('trip-last-place') || 'area';
  // 일정 탭은 항상 지도부터
  function goGroup(g) {
    setView(g === 'sched' ? 'plan' : g === 'place' ? lastPlace : g);
  }
  window.goGroup = goGroup;
  window.VIEW_GROUP = VIEW_GROUP;
  // 헤더: 지도 → "일정", 가이드 → "장소" (타임라인·도감 버튼은 숨기고 아래 줄 전환으로)
  document.getElementById('viewPlan').textContent = '일정';
  document.getElementById('viewArea').textContent = '장소';
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('#viewPlan, #viewArea');
    if (!b) return;
    e.stopPropagation();
    goGroup(b.id === 'viewPlan' ? 'sched' : 'place');
  }, true);
  // 일정·장소 안에서 바꾸는 작은 전환줄 (헤더 아래)
  const subnav = document.createElement('div');
  subnav.className = 'subnav';
  subnav.innerHTML =
    '<div class="sn-group" data-g="sched" role="group" aria-label="일정 보기"><button type="button" data-v="plan">지도</button><button type="button" data-v="tl">타임라인</button></div>' +
    '<div class="sn-group" data-g="place" role="group" aria-label="장소 보기"><button type="button" data-v="area">추천 가이드</button><button type="button" data-v="guide">도감</button></div>';
  subnav.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => setView(b.dataset.v)));
  document.querySelector('header').appendChild(subnav);
  const setView_theme = setView;
  setView = function (v) {
    setView_theme(v);
    if (v === 'area' || v === 'guide') { lastPlace = v; try { localStorage.setItem('trip-last-place', v); } catch (e) { /* 무시 */ } }
    paintGroups();
  };
  function paintGroups() {
    const g = VIEW_GROUP[currentView] || '';
    document.getElementById('viewPlan').setAttribute('aria-pressed', String(g === 'sched'));
    document.getElementById('viewArea').setAttribute('aria-pressed', String(g === 'place'));
    subnav.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === currentView)));
    if (currentView === 'plan') setTimeout(sheetSnap, 0);
  }
  paintGroups();

  /* ── 카드: 한 줄 요약 · 큰 버튼 · 더보기 시트 · 접기/펼치기 ── */
  function tsumHtml(p, hf) {
    const bits = [];
    if (p.stay) bits.push('체류 ' + p.stay + '분');
    if (hf) bits.push(hf.closed ? '휴무' : '영업 ' + hf.text);
    if (p.yen != null && !isNaN(p.yen)) bits.push('예산 ' + YEN(p.yen));
    return '<div class="tsum">' + esc(bits.join(' · ')) + '<span class="tfold" aria-hidden="true"></span></div>';
  }
  function priBtn(p, vk) {
    const a = arrivedAt(p);
    if (a) return '<button class="pri has" type="button" data-vk="' + vk + '">✓ 도착 ' + esc(a) + '</button>';
    if (isVisited(p)) return '<button class="pri has" type="button" data-vk="' + vk + '">✓ 방문함</button>';
    return '<button class="pri" type="button" data-vk="' + vk + '">도착</button>';
  }
  const TL_OPEN = new Set();
  document.addEventListener('click', e => {
    const t = e.target;
    if (!t.closest) return;
    const pri = t.closest('.tcard .pri');
    if (pri) {
      if (!pri.classList.contains('has')) { recordArrivalNow(pri.dataset.vk); return; }
      return moreSheet(pri.closest('.tcard'));
    }
    const more = t.closest('.tcard .more-btn');
    if (more) return moreSheet(more.closest('.tcard'));
    // 카드 빈 곳 누르면 접기/펼치기 (버튼·링크·입력칸은 제외)
    const card = t.closest('#tlInner .tcard');
    if (!card || t.closest('button, a, input, select, textarea, label, .spend-form, .arr-form, .edit-row, .taxi-box, img.photo')) return;
    const key = card.closest('.titem') && card.closest('.titem').dataset.key;
    flipToggle(card, () => card.classList.toggle('open'));
    if (key) { if (card.classList.contains('open')) TL_OPEN.add(key); else TL_OPEN.delete(key); }
  });
  function moreSheet(card) {
    if (!card) return;
    const box = card.querySelector('.act-more');
    const guest = document.body.classList.contains('guest'), noedit = document.body.classList.contains('noedit');
    const acts = [];
    const add = (sel, label, skip) => { const b = box && box.querySelector(sel); if (b && !skip) acts.push({ label: label(b), fn: () => { card.classList.add('open'); b.click(); } }); };
    add('.arr-btn', b => b.classList.contains('has') ? '도착 시각 고치기 (' + b.textContent.replace('도착 ', '') + ')' : '지금 도착으로 기록', guest);
    add('.visit', b => b.getAttribute('aria-pressed') === 'true' ? '방문 체크 해제' : '방문 체크만 (도착 시각 없이)', guest);
    add('.spend-btn', b => b.classList.contains('has') ? b.textContent + ' 고치기' : '지출 입력', guest);
    add('.edit-btn', () => '일정 조정 (체류 ±15분·건너뛰기)', noedit);
    add('.share-btn', () => '공유');
    add('.linkbtn', () => '도감에서 보기');
    const h3 = card.querySelector('h3');
    if (acts.length) openSheet(h3 ? h3.textContent : '', acts);
  }
  const renderTimeline_theme = renderTimeline;
  renderTimeline = function () {
    renderTimeline_theme();
    document.querySelectorAll('#tlInner .titem[data-key]').forEach(it => {
      const c = it.querySelector('.tcard');
      if (!c) return;
      // 펼칠 게 없는 카드는 요약 줄·화살표 없앰
      const ts = c.querySelector('.tsum');
      if (ts && !ts.textContent.trim() && !c.querySelector('.facts, .chips, .note:not(.memo), .slack.ok')) ts.remove();
      c.classList.toggle('no-fold', !c.querySelector('.tsum'));   // 펼칠 게 없으면 손가락 커서 안 보이게
      if (TL_OPEN.has(it.dataset.key)) c.classList.add('open');
    });
  };

  /* ── 지도 화면(폰): 목록을 아래에서 끌어올리는 시트로 ── */
  const SHEET_SNAPS = [0.2, 0.5, 0.88];
  let sheetIdx = Number(GROUP_LS('trip-sheet-snap') || 1);
  const mainEl = document.querySelector('main');
  const grip = document.createElement('div');
  grip.className = 'list-grip';
  grip.setAttribute('role', 'button');
  grip.setAttribute('aria-label', '목록 높이 바꾸기');
  grip.innerHTML = '<span></span>';
  mainEl.appendChild(grip);
  const sheetMode = () => matchMedia('(max-width: 800px)').matches;
  function setSheetH(px, anim) {
    mainEl.classList.toggle('sheet-drag', !anim);
    mainEl.style.setProperty('--sheet-h', Math.round(px) + 'px');
  }
  function sheetSnap(i) {
    if (!sheetMode()) return;
    if (i != null) { sheetIdx = i; try { localStorage.setItem('trip-sheet-snap', String(i)); } catch (e) { /* 무시 */ } }
    setSheetH(mainEl.clientHeight * SHEET_SNAPS[sheetIdx], true);
  }
  (() => {
    let y0 = null, h0 = 0, moved = false;
    grip.addEventListener('pointerdown', e => {
      if (!sheetMode()) return;
      y0 = e.clientY; h0 = document.getElementById('list').getBoundingClientRect().height; moved = false;
      grip.setPointerCapture(e.pointerId);
    });
    grip.addEventListener('pointermove', e => {
      if (y0 == null) return;
      const dy = e.clientY - y0;
      if (Math.abs(dy) > 4) moved = true;
      if (moved) setSheetH(Math.min(mainEl.clientHeight * 0.92, Math.max(56, h0 - dy)), false);
    });
    const end = e => {
      if (y0 == null) return;
      y0 = null;
      if (!moved) return sheetSnap((sheetIdx + 1) % SHEET_SNAPS.length);   // 그냥 누르면 다음 높이
      const h = document.getElementById('list').getBoundingClientRect().height / mainEl.clientHeight;
      let best = 0;
      SHEET_SNAPS.forEach((v, i) => { if (Math.abs(v - h) < Math.abs(SHEET_SNAPS[best] - h)) best = i; });
      sheetSnap(best);
    };
    grip.addEventListener('pointerup', end);
    grip.addEventListener('pointercancel', end);
  })();
  addEventListener('resize', () => { if (currentView === 'plan') sheetSnap(); });

  /* ── 야외 모드: 햇빛 아래에서 회색 글씨·선을 진하게 ── */
  const OUT_KEY = 'trip-outdoor';
  function setOutdoor(on) {
    document.body.classList.toggle('outdoor', on);
    try { localStorage.setItem(OUT_KEY, on ? '1' : '0'); } catch (e) { /* 무시 */ }
  }
  setOutdoor(GROUP_LS(OUT_KEY) === '1');
  /* ── 설정 창 (헤더 톱니바퀴): 각 기능이 TRIP_SETTINGS에 칸을 등록 ── */
  window.TRIP_SETTINGS = window.TRIP_SETTINGS || [];
  const gear = document.createElement('button');
  gear.type = 'button'; gear.id = 'gearBtn'; gear.className = 'reload gear'; gear.title = '설정'; gear.setAttribute('aria-label', '설정');

   *  Leaflet은 그대로 두고 배경만 바꿈 (핀·경로·리플레이 코드 변경 없음)
   *  실패하면(웹GL 없음·서버 안 됨) 지금 OSM 지도 유지 */
  const OFM = 'https://tiles.openfreemap.org/styles/';
  const LABEL_KEY = 'trip-map-label';   // 'ko' 한국어 우선 / 'local' 현지어
  let glLayer = null, osmLayer = null;
  function labelMode() { return GROUP_LS(LABEL_KEY) || 'ko'; }
  function applyLabels(m) {
    const want = labelMode();
    m.getStyle().layers.forEach(l => {
      if (l.type !== 'symbol' || !l.layout || !l.layout['text-field']) return;
      if (!l.__orig) l.__orig = l.layout['text-field'];
      const tf = want === 'ko' ? ['coalesce', ['get', 'name:ko'], ['get', 'name:latin'], ['get', 'name']] : ['get', 'name'];
      // 도로 번호 같은 숫자 라벨은 손대지 않음
      if (JSON.stringify(l.__orig).indexOf('name') === -1) return;
      try { m.setLayoutProperty(l.id, 'text-field', tf); } catch (e) { /* 무시 */ }
    });
  }
  // 홈랩 페이지면 지도 요청(스타일·타일·글꼴)을 프록시(/api/map/ofm/) 경유 → 서버 디스크 캐시, 경로 주변은 미리 받아둠
  const OFM_HOST = 'https://tiles.openfreemap.org/';
  const viaProxy = typeof API_URL === 'string' && API_URL.charAt(0) === '/';
  const mapUrl = u => viaProxy && u.indexOf(OFM_HOST) === 0 ? location.origin + API_URL + '/map/ofm/' + u.slice(OFM_HOST.length) : u;
  async function styleFor(dark) {
    // 다크 스타일이 없으면 밝은 스타일에 기존 반전 필터를 씀
    if (dark) {
      try { const r = await fetch(mapUrl(OFM + 'dark')); if (r.ok) return { style: await r.json(), native: true }; } catch (e) { /* 다음 */ }
    }
    const r = await fetch(mapUrl(OFM + 'liberty'));

    return { style: await r.json(), native: !dark };
  }
  async function useVectorMap() {
    if (!hasWebGL || glLayer || window.TRIP_GL) return;   // 지도 엔진이 이미 MapLibre면 필요 없음
    try {
      await loadScript(LIB.maplibre);
      await loadScript(LIB.mlLeaflet);
      if (!window.maplibregl || !L.maplibreGL) return;
      const st = await styleFor(darkMQ.matches);
      map.eachLayer(l => { if (l instanceof L.TileLayer) osmLayer = l; });
      const gl = L.maplibreGL({ style: st.style, attributionControl: false, localIdeographFontFamily: 'sans-serif',
        maxTileCacheSize: 600,   // 리플레이처럼 넓게 움직여도 받은 타일을 오래 들고 있게

        if (!glLayer) return;

        document.body.classList.remove('gl-map', 'gl-native-dark');
        if (osmLayer && !map.hasLayer(osmLayer)) osmLayer.addTo(map);
      };

      setTimeout(() => { if (!ok) back(); }, 12000);   // 12초 안에 타일 하나도 못 받으면 OSM

    }

      '<label class="chk" style="margin-top:6px"><input type="radio" name="mapLabel" value="local"' + (k === 'local' ? ' checked' : '') + '><span>현지어 (간판과 같은 일본어)</span></label>' +

      '<label class="chk"><input type="radio" name="mapEngine" value="gl"' + (eng !== 'leaflet' ? ' checked' : '') + '><span>벡터 지도 (기울이기·회전·3D 건물)</span></label><br>' +
      '<label class="chk" style="margin-top:6px"><input type="radio" name="mapEngine" value="leaflet"' + (eng === 'leaflet' ? ' checked' : '') + '><span>예전 지도 (가볍고 단순, 느린 폰·문제 있을 때)</span></label></div>');

  /* ── 사진 크게 보기: PhotoSwipe (핀치 확대·넘기기) ── */
  //  타임라인 카드 사진·도감/가이드 갤러리. 불러오기 실패하면 예전 보기
  async function openPswp(img) {
    const box = img.closest('.gallery, .mosaic, .tcard') || img.parentNode;
    const imgs = Array.from(box.querySelectorAll('img')).filter(x => !x.dataset.fb);
    const idx = Math.max(0, imgs.indexOf(img));

    const sizes = await Promise.all(imgs.map(x => x.naturalWidth ? Promise.resolve([x.naturalWidth, x.naturalHeight]) : new Promise(res => {
      const t = new Image(); t.onload = () => res([t.naturalWidth || 1200, t.naturalHeight || 900]); t.onerror = () => res([1200, 900]); t.src = x.currentSrc || x.src;
    })));

      dataSource: imgs.map((x, i) => ({ src: x.currentSrc || x.src, width: sizes[i][0], height: sizes[i][1], alt: '' })),

  /* ── 하루 돌아보기: 재생 전에 지나갈 길의 지도 타일을 먼저 받음 ── */
  //  벡터 지도가 빨리 움직이는 카메라를 못 따라가서 빈 화면이 되던 것. 최대 8초 기다리고 시작
  function replayTileUrls() {
    const m = (window.TRIP_GL && map.gl) || (glLayer && glLayer.getMaplibreMap && glLayer.getMaplibreMap());
    if (!m || !RP) return [];
    const st = m.getStyle();
    const src = Object.keys(st.sources || {}).map(id => m.getSource(id)).find(s => s && s.type === 'vector' && Array.isArray(s.tiles) && s.tiles.length);
    if (!src) return [];
    const tpl = src.tiles[0], maxz = src.maxzoom || 14;
    const set = new Set();
    let z = 14;
    const add = (lat, lng) => {
      const n = 2 ** z, x = Math.floor((lng + 180) / 360 * n);
      const r = lat * Math.PI / 180, y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n);
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) set.add(z + '/' + (x + dx) + '/' + (y + dy));
    };
    RP.ev.forEach(ev => {
      // 구간마다 정해진 확대 단계 - 1 = 벡터 타일 단계
      z = Math.min(maxz, Math.max(0, Math.round(ev.zoom || map.getZoom()) - 1));
      if (ev.type === 'stay' && ev.p && ev.p.lat != null) add(ev.p.lat, ev.p.lng);
      (ev.coords || []).forEach((c, i) => { if (i % 3 === 0) add(c[0], c[1]); });
    });
    return Array.from(set).map(k => { const [zz, x, y] = k.split('/'); return mapUrl(tpl.replace('{z}', zz).replace('{x}', x).replace('{y}', y)); });
  }
  const startReplay_theme = startReplay;
  startReplay = function (date) {
    startReplay_theme(date);
    if (!RP || !(glLayer || window.TRIP_GL)) return;
    const urls = replayTileUrls();
    if (!urls.length) return;
    const lab = document.getElementById('rpLabel'), play = document.getElementById('rpPlay');
    RP.playing = false;
    if (play) play.textContent = '▶';
    let done = 0, go = false;
    const start = () => {
      if (go || !RP) return;
      go = true;
      if (lab) lab.textContent = '';
      if (play && !RP.playing) play.click();
    };
    const tick = () => { if (lab && !go) lab.textContent = '지도 준비 ' + done + ' / ' + urls.length; };
    tick();
    let i = 0;
    const worker = async () => {
      while (i < urls.length && !go) {
        try { await fetch(urls[i++]); } catch (e) { /* 넘어감 */ }
        done++; tick();
      }
    };
    Promise.all([1, 2, 3, 4, 5, 6].map(worker)).then(start);
    setTimeout(start, 8000);
  };

  /* ── 3D 보기: MapLibre 지도를 따로 띄워서 기울이기·돌리기·3D 건물 ──
   *  평소 지도(Leaflet)는 기울일 수 없어서, 지도 화면 오른쪽 위 [3D] 버튼으로 엶
   *  폰: 두 손가락을 위아래로 밀면 기울기, 비틀면 회전 / PC: 오른쪽 버튼 끌기 또는 Ctrl+끌기 */
  let map3d = null;
  function routeGeo(date) {
    const dates = date && date !== 'all' ? [date] : DATA.dates;
    const feats = [], pts = [];
    DATA.segments.filter(s => dates.indexOf(s.date) >= 0).forEach(s => {
      let line = [];
      try {
        if (s.polyline) line = decodePolyline(s.polyline);
        else (s.steps || []).forEach(st => { if (st.poly) line = line.concat(decodePolyline(st.poly)); });
      } catch (e) { line = []; }
      if (line.length < 2) return;
      const ride = (s.steps || []).find(x => x.t === 'transit');
      const color = ride ? (ride.color || lineColor(ride.line + ' ' + (ride.full || ''))) : ({ 도보: '#2f9e44', 차량: '#f08c3a' }[s.mode] || '#5b8cff');
      feats.push({ type: 'Feature', properties: { color: color, walk: s.mode === '도보' ? 1 : 0 }, geometry: { type: 'LineString', coordinates: line.map(ll => [ll[1], ll[0]]) } });
    });
    DATA.points.filter(p => dates.indexOf(p.date) >= 0 && p.lat != null).forEach(p => {
      pts.push({ type: 'Feature', properties: { n: String(p.order), name: pname(p), color: dayCity(p.date).color.indexOf('var(') === 0 ? '#1d2633' : dayCity(p.date).color },
        geometry: { type: 'Point', coordinates: [p.lng, p.lat] } });
    });
    return { lines: { type: 'FeatureCollection', features: feats }, points: { type: 'FeatureCollection', features: pts } };
  }
  async function open3D() {

    document.querySelector('main').appendChild(wrap);
    wrap.querySelector('.m3-close').onclick = close3D;
    try {
      await loadScript(LIB.maplibre);
      const st = await styleFor(darkMQ.matches);
      const c = map.getCenter();
      map3d = new maplibregl.Map({
        container: 'map3d', style: st.style, center: [c.lng, c.lat], zoom: Math.max(13, map.getZoom() - 1),
        pitch: 60, bearing: -20, maxPitch: 80, attributionControl: { compact: true }, localIdeographFontFamily: 'sans-serif',
        transformRequest: url => (viaProxy && url.indexOf(OFM_HOST) === 0 ? { url: mapUrl(url) } : undefined),
      });
      map3d.addControl(new maplibregl.NavigationControl({ visualizePitch: true, showZoom: true }), 'bottom-right');
      map3d.on('load', () => {
        applyLabels(map3d);
        const layers = map3d.getStyle().layers;
        // 3D 건물: 스타일에 없으면 추가 (OpenMapTiles building 층의 높이 사용)
        if (!layers.some(l => l.type === 'fill-extrusion')) {
          const srcId = Object.keys(map3d.getStyle().sources).find(id => map3d.getStyle().sources[id].type === 'vector');
          const firstSym = (layers.find(l => l.type === 'symbol') || {}).id;
          if (srcId) map3d.addLayer({ id: 'trip-3d-buildings', type: 'fill-extrusion', source: srcId, 'source-layer': 'building', minzoom: 14,
            paint: { 'fill-extrusion-color': darkMQ.matches ? '#2a3240' : '#d9dde3',
              'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 8],
              'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0], 'fill-extrusion-opacity': 0.85 } }, firstSym);
        }
        const g = routeGeo(selected);
        map3d.addSource('trip-lines', { type: 'geojson', data: g.lines });
        map3d.addSource('trip-points', { type: 'geojson', data: g.points });
        map3d.addLayer({ id: 'trip-lines-casing', type: 'line', source: 'trip-lines', layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': '#ffffff', 'line-width': 8, 'line-opacity': 0.85 } });
        map3d.addLayer({ id: 'trip-lines', type: 'line', source: 'trip-lines', layout: { 'line-join': 'round', 'line-cap': 'round' },
          paint: { 'line-color': ['get', 'color'], 'line-width': 5, 'line-dasharray': ['case', ['==', ['get', 'walk'], 1], ['literal', [0.6, 1.6]], ['literal', [1, 0]]] } });
        map3d.addLayer({ id: 'trip-points', type: 'circle', source: 'trip-points',
          paint: { 'circle-radius': 11, 'circle-color': ['get', 'color'], 'circle-stroke-color': '#fff', 'circle-stroke-width': 2.5, 'circle-pitch-alignment': 'map' } });
        map3d.addLayer({ id: 'trip-points-n', type: 'symbol', source: 'trip-points',
          layout: { 'text-field': ['get', 'n'], 'text-size': 12, 'text-allow-overlap': true, 'text-font': ['Noto Sans Bold'] }, paint: { 'text-color': '#fff' } });
        map3d.addLayer({ id: 'trip-points-name', type: 'symbol', source: 'trip-points',
          layout: { 'text-field': ['get', 'name'], 'text-size': 12, 'text-offset': [0, 1.6], 'text-anchor': 'top', 'text-font': ['Noto Sans Bold'] },
          paint: { 'text-color': darkMQ.matches ? '#fff' : '#1d2633', 'text-halo-color': darkMQ.matches ? '#000' : '#fff', 'text-halo-width': 1.6 } });
        // 경로가 다 보이게, 기울인 채로

        g.lines.features.forEach(f => f.geometry.coordinates.forEach(c => b.extend(c)));

      });

    }
  }

  // 지도 화면 오른쪽 위 [3D] 버튼
  const Btn3D = L.Control.extend({
    options: { position: 'topright' },

  // 역 출구·화장실·편의점 켜고 끄기 (벡터 지도 엔진일 때만). 확대해야 보임. 출구만 기본 켜짐
  if (window.TRIP_GL && map.togglePoi) {

      onAdd() {

        [['exit', '出', '역 출구 표시 (확대하면 보임)', true, 16.5], ['toilet', 'WC', '화장실 표시 (확대하면 보임)', false, 17.5], ['konbini', '🏪', '편의점 표시 (확대하면 보임)', false, 17.5]].forEach(([k, t, title, init, z]) => {
          const b = L.DomUtil.create('button', 'leaflet-bar btn3d btn-poi' + (init ? ' on' : ''), box);
          b.type = 'button'; b.textContent = t; b.title = title; b.setAttribute('aria-pressed', String(init));
          b.onclick = () => {
            const on = map.togglePoi(k);

            if (on && map.getZoom() < z) showToast(title.replace(' (확대하면 보임)', '') + ' 켬 · 더 확대하면 보임');
          };

      },

    new BtnPoi().addTo(map);
  }
  const setView_3d = setView;
  setView = function (v) { if (v !== 'plan') close3D(); setView_3d(v); };

  /* ── 하루 돌아보기: deck.gl 빛나는 이동선 (벡터 지도 엔진일 때) ──
   *  그날 함께 있는 사람마다 자기 색 꼬리. 같은 경로라도 각자 도착 기록으로 늦어진 만큼 시간이 밀림
   *  deck.gl(약 2MB)은 돌아보기를 처음 켤 때만 받음 */
  const DECK_URL = 'https://cdn.jsdelivr.net/npm/deck.gl@9.4.0/dist.min.js';
  let deckOv = null, deckTrips = null;
  const hexRgb = h => { const m = String(h).replace('#', '').match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i); return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [255, 80, 60]; };
  // 시계(분) → 재생 위치(RP.u)
  function clockToU(t) {
    const ev = RP.ev;
    for (const e of ev) if (t <= e.d) { if (t <= e.a) return e.u0; return e.u0 + (t - e.a) / Math.max(1, e.d - e.a) * e.len; }
    const l = ev[ev.length - 1];
    return l ? l.u0 + l.len : 0;
  }
  function userDelay(uid, date) {
    const arr = (RAW && RAW.arrivedBy && RAW.arrivedBy[uid]) || {};
    let ref = 0;
    (RAW.points || []).filter(p => p.date === date).sort((a, b) => a.order - b.order).forEach(p => {
      const a = arr[p.date + '#' + p.order], pm = toMin(p.arrive);
      if (!a || pm == null) return;
      let d = toMin(a) - pm;
      if (d < -720) d += 1440;
      if (d > 720) d -= 1440;
      ref = d;
    });
    return ref;
  }
  function buildTrips() {
    const date = RP.date;
    const people = ((RAW && RAW.users) || []).filter(u => u.from <= date && u.to >= date && u.id !== 'Guest');
    if (!people.length && USER) people.push(USER);
    const mine = USER ? userDelay(USER.id, date) : 0;
    return people.map(u => {
      const shift = userDelay(u.id, date) - mine;
      const path = [], ts = [];
      RP.ev.forEach(e => {
        if (e.type === 'stay') {
          path.push([e.p.lng, e.p.lat], [e.p.lng, e.p.lat]);
          ts.push(clockToU(e.a + shift), clockToU(e.d + shift));
        } else {
          e.coords.forEach((c, i) => { path.push([c[1], c[0]]); ts.push(clockToU(e.a + (e.d - e.a) * (e.cum[i] / e.total) + shift)); });
        }
      });
      // 시간이 거꾸로 가지 않게
      for (let i = 1; i < ts.length; i++) if (ts[i] < ts[i - 1]) ts[i] = ts[i - 1];
      return { id: u.id, me: USER && u.id === USER.id, color: hexRgb(userColor(u.id)), path: path, timestamps: ts };
    });
  }
  function headAt(t, tr) {
    const ts = tr.timestamps;
    if (!ts.length || t <= ts[0]) return tr.path[0];
    for (let i = 1; i < ts.length; i++) if (t <= ts[i]) {
      const f = ts[i] === ts[i - 1] ? 1 : (t - ts[i - 1]) / (ts[i] - ts[i - 1]);
      const a = tr.path[i - 1], b = tr.path[i];
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
    }
    return tr.path[tr.path.length - 1];
  }
  function deckLayers() {
    if (!window.deck || !RP || !deckTrips) return [];
    const t = RP.u, trail = RP.perSec * 7;   // 꼬리 길이: 재생 7초 분량
    const D = window.deck;
    return [
      new D.TripsLayer({ id: 'trip-glow', data: deckTrips, getPath: d => d.path, getTimestamps: d => d.timestamps,
        getColor: d => d.color.concat(70), widthUnits: 'pixels', getWidth: 14, widthMinPixels: 14, capRounded: true, jointRounded: true, trailLength: trail, currentTime: t, fadeTrail: true }),
      new D.TripsLayer({ id: 'trip-core', data: deckTrips, getPath: d => d.path, getTimestamps: d => d.timestamps,
        getColor: d => d.color.map(c => Math.min(255, c + 60)), widthUnits: 'pixels', widthMinPixels: 3, getWidth: d => d.me ? 5 : 3, capRounded: true, jointRounded: true,
        trailLength: trail, currentTime: t, fadeTrail: true }),
      new D.ScatterplotLayer({ id: 'trip-heads', data: deckTrips.filter(d => !d.me), getPosition: d => headAt(t, d),
        getFillColor: d => d.color, getLineColor: [255, 255, 255], lineWidthMinPixels: 2, stroked: true, radiusMinPixels: 6, radiusMaxPixels: 8,
        updateTriggers: { getPosition: t } }),
    ];
  }
  async function startDeck() {
    if (!window.TRIP_GL || !map.gl || !RP) return;
    try {
      await loadScript(DECK_URL);
      if (!window.deck || !RP) return;
      deckTrips = buildTrips();
      if (!deckOv) { deckOv = new window.deck.MapboxOverlay({ interleaved: true, layers: [] }); map.gl.addControl(deckOv); }
      RP.trail.setStyle({ opacity: 0 });   // 예전 빨간 꼬리 대신
      deckOv.setProps({ layers: deckLayers() });
      // 범례: 누가 무슨 색
      const lab = document.getElementById('rpPanel');
      if (lab && !lab.querySelector('.rp-legend') && deckTrips.length > 1) {
        lab.insertAdjacentHTML('beforeend', '<div class="rp-legend">' + deckTrips.map(d => '<span style="--uc:' + userColor(d.id) + '">' + esc(d.id) + '</span>').join('') + '</div>');
      }
    } catch (e) { console.warn('deck.gl 실패, 예전 꼬리 유지', e); }
  }
  const rpDraw_deck = rpDraw;
  rpDraw = function (seek) {
    rpDraw_deck(seek);
    if (deckOv && deckTrips) deckOv.setProps({ layers: deckLayers() });
  };
  const startReplay_deck = startReplay;
  startReplay = function (date) { startReplay_deck(date); startDeck(); };
  const stopReplay_deck = stopReplay;
  stopReplay = function () {
    stopReplay_deck();
    deckTrips = null;
    if (deckOv) deckOv.setProps({ layers: [] });
  };

  /* ───────── 모션 (GSAP: Flip · ScrollTrigger) ─────────
   *  - 카드 접기·펼치기: 카드와 그 아래 일정이 제자리에서 부드럽게 늘고 줄어듦
   *  - 가이드 지역 카드 → 지역 상세: 누른 카드가 그대로 커지면서 상세 머리 사진이 됨
   *  - 타임라인: 승차권이 위로 지나가면 작은 날짜 띠가 위에 붙음, 카드가 화면에 들어올 때 살짝 떠오름
   *  GSAP(무료, 약 100KB)은 처음 필요할 때 받음. 모션 줄이기 설정이면 전부 끔 */
  const GS = {
    core: 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js',
    flip: 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/Flip.min.js',
    st: 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js',
  };
  const still = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  let gsapP = null;
  function gsapReady() {
    if (still()) return Promise.reject(new Error('모션 줄이기'));
    if (!gsapP) gsapP = loadScript(GS.core).then(() => Promise.all([loadScript(GS.flip), loadScript(GS.st)])).then(() => {
      window.gsap.registerPlugin(window.Flip, window.ScrollTrigger);
      return window.gsap;
    });
    return gsapP;
  }
  // 바로 쓸 수 있으면 Flip, 아니면 그냥 바꿈 (처음 한 번은 받는 동안 그냥 바뀜)
  function flipToggle(card, change) {
    if (!window.Flip || still()) { change(); gsapReady().catch(() => null); return; }
    const box = card.closest('.swiper-slide, .tl-scroll, #tlInner') || document;
    const els = [card].concat(Array.from(box.querySelectorAll('.titem, .tmove, .tst, .tstep, .tnow, .receipt')).filter(x => card.compareDocumentPosition(x) & Node.DOCUMENT_POSITION_FOLLOWING).slice(0, 14));
    const state = window.Flip.getState(els, { props: 'opacity' });
    change();
    window.Flip.from(state, { duration: 0.38, ease: 'power3.out', nested: true, simple: true });
  }

  // 지역 카드 → 상세: 누른 카드 위치에서 상세 머리가 커져 나옴
  let areaFrom = null;
  document.addEventListener('click', e => {
    const c = e.target.closest && e.target.closest('.acard');
    if (!c) return;
    const hero = c.querySelector('.hero');
    areaFrom = hero ? hero.getBoundingClientRect() : c.getBoundingClientRect();
    gsapReady().catch(() => null);
  }, true);
  const renderArea_motion = typeof renderAreaPage === 'function' ? renderAreaPage : null;
  if (renderArea_motion) {
    renderAreaPage = function () {
      renderArea_motion.apply(this, arguments);
      const from = areaFrom;
      areaFrom = null;
      const hero = document.querySelector('.area-banner .hero');
      if (!from || !hero || !window.gsap || still()) return;
      const to = hero.getBoundingClientRect();
      if (!to.width) return;
      window.gsap.fromTo(hero, {
        x: from.left - to.left, y: from.top - to.top, scaleX: from.width / to.width, scaleY: from.height / to.height, transformOrigin: '0 0', borderRadius: 16,
      }, { x: 0, y: 0, scaleX: 1, scaleY: 1, borderRadius: 0, duration: 0.5, ease: 'power3.inOut', clearProps: 'transform,borderRadius' });
      const rest = Array.from(document.querySelectorAll('.area-banner ~ *')).slice(0, 8);
      window.gsap.from(rest, { opacity: 0, y: 18, duration: 0.4, delay: 0.18, stagger: 0.04, ease: 'power2.out', clearProps: 'all' });
    };
  }

  // 타임라인 스크롤: 작은 날짜 띠 + 카드 떠오르기
  let tlTriggers = [];
  function scrollMotion() {
    if (!window.ScrollTrigger || still()) return;
    tlTriggers.forEach(t => t.kill());
    tlTriggers = [];
    document.querySelectorAll('#tlInner .kippu').forEach(k => {
      const scroller = k.closest('.swiper-slide, .tl-scroll');
      if (!scroller) return;
      let mini = scroller.querySelector('.kp-mini');
      if (!mini) {
        mini = document.createElement('div');
        mini.className = 'kp-mini';
        mini.style.setProperty('--city', getComputedStyle(k).getPropertyValue('--city'));
        const day = k.querySelector('.tl-day'), route = k.querySelector('.kp-route');
        mini.innerHTML = '<b>' + (day ? day.textContent : '') + '</b>' + (route ? '<span>' + route.innerHTML + '</span>' : '');
        scroller.insertBefore(mini, scroller.firstChild);
      }
      tlTriggers.push(window.ScrollTrigger.create({
        scroller: scroller, trigger: k, start: 'bottom top+=8', end: 'max',
        onToggle: self => mini.classList.toggle('show', self.isActive),
      }));
      const items = Array.from(scroller.querySelectorAll('.titem'));
      items.forEach(it => {
        const r = it.getBoundingClientRect(), sr = scroller.getBoundingClientRect();
        if (r.top < sr.bottom) return;   // 이미 보이는 건 그대로
        window.gsap.set(it, { opacity: 0, y: 22 });
        tlTriggers.push(window.ScrollTrigger.create({
          scroller: scroller, trigger: it, start: 'top bottom-=24', once: true,
          onEnter: () => window.gsap.to(it, { opacity: 1, y: 0, duration: 0.45, ease: 'power2.out', clearProps: 'transform,opacity' }),
        }));
      });
    });
  }
  const renderTimeline_motion = renderTimeline;
  renderTimeline = function () {
    renderTimeline_motion();
    if (still()) return;
    gsapReady().then(() => requestAnimationFrame(scrollMotion)).catch(() => null);
  };
</script>
