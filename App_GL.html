        });
        // 선·원 누르기: 손가락 오차 ±7px 안 가장 위의 것. 아무것도 없으면 지도 누르기
        this.gl.on('click', e => {
          const ids = Array.from(this._hit.keys()).filter(id => this.gl.getLayer(id));
          let hit = null;
          if (ids.length) {
            const p = e.point;
            const fs = this.gl.queryRenderedFeatures([[p.x - 7, p.y - 7], [p.x + 7, p.y + 7]], { layers: ids });
            if (fs.length) hit = this._hit.get(fs[0].layer.id);
          }
          const ll = new LatLng(e.lngLat.lat, e.lngLat.lng);
          if (hit) {
            hit.fire('click', { latlng: ll, originalEvent: e.originalEvent });
            if (hit._popup) this._openPopup(hit, ll);
            return;
          }
          this.fire('click', { latlng: ll, originalEvent: e.originalEvent });
        });
        this.gl.on('mousemove', e => {
          const ids = Array.from(this._hit.keys()).filter(id => this.gl.getLayer(id));
          const p = e.point;
          const on = ids.length && this.gl.queryRenderedFeatures([[p.x - 5, p.y - 5], [p.x + 5, p.y + 5]], { layers: ids }).length;
          this.gl.getCanvas().style.cursor = on ? 'pointer' : '';
        });
        this.gl.on('zoomend', () => this.fire('zoomend'));
        this.gl.on('moveend', () => this.fire('moveend'));
        this.gl.on('movestart', () => this.fire('movestart'));
        this.gl.on('rotate', () => this.fire('rotate'));
        this.gl.on('pitch', () => this.fire('pitch'));
        // Leaflet 위치 칸
        const cc = document.createElement('div');
        cc.className = 'leaflet-control-container';
        this._corners = {};
        ['top left', 'top right', 'bottom left', 'bottom right'].forEach(k => {
          const [v, h] = k.split(' ');
          const d = document.createElement('div');
          d.className = 'leaflet-' + v + ' leaflet-' + h;
          cc.appendChild(d);
          this._corners[v + h] = d;
        });
        this._container.appendChild(cc);
        if (this.options.zoomControl !== false) {
          const nav = new ML.NavigationControl({ visualizePitch: true, showCompass: true, showZoom: true });
          const el = nav.onAdd(this.gl);
          el.classList.add('leaflet-control', 'gl-nav');
          this._corners.topleft.appendChild(el);
        }
        this.attributionControl = { addAttribution() { return this; }, removeAttribution() { return this; } };
      }
      _whenStyle(f) { if (this.gl.isStyleLoaded() || this._loaded && this.gl.getStyle()) { try { f(); return; } catch (e) { /* 아직이면 대기 */ } } this._queue.push(f); }
      _firstTripLayer() {
        const ids = (this.gl.getStyle().layers || []).map(l => l.id);
        return ids.find(id => /^tp\d+$/.test(id) && !this._isCasing(id));
      }
      _isCasing(id) { for (const p of this._paths) if (p._id === id) return p.options.pane === 'casing'; return false; }
      // 스타일 꾸미기: 지명 언어, 3D 건물, 하늘·조명
      _decorate() {
        const gl = this.gl, st = gl.getStyle();
        let mode = 'ko';
        try { mode = localStorage.getItem('trip-map-label') || 'ko'; } catch (e) { /* 무시 */ }
        this.applyLabels(mode);

        // 3D 건물: 높이별 색, 확대하면 솟아오름, 위→아래 그라데이션
        const h = ['coalesce', ['get', 'render_height'], ['get', 'height'], 8];
        const hBase = ['coalesce', ['get', 'render_min_height'], 0];
        const paint = {
          'fill-extrusion-color': ['interpolate', ['linear'], h,
            0,   dark ? '#262c36' : '#eceae6',
            30,  dark ? '#2f3a4c' : '#d6dde6',
            80,  dark ? '#3b5170' : '#a9bdd6',
            150, dark ? '#4a6a96' : '#7f9cc4',
            250, dark ? '#5d84bb' : '#5a7bb0'],
          'fill-extrusion-height': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, h],
          'fill-extrusion-base': ['interpolate', ['linear'], ['zoom'], 14, 0, 15.5, hBase],
          'fill-extrusion-opacity': ['interpolate', ['linear'], ['zoom'], 14, 0, 15, 0.85],
          'fill-extrusion-vertical-gradient': true,
        };
        const ext = st.layers.filter(l => l.type === 'fill-extrusion');
        if (ext.length) {
          // liberty 등 스타일에 원래 있는 건물 층 → 색·높이만 덮어씀
          ext.forEach(l => Object.keys(paint).forEach(k => {
            try { gl.setPaintProperty(l.id, k, paint[k]); } catch (e) { /* 무시 */ }
          }));
        } else {
          const srcId = Object.keys(st.sources).find(id => st.sources[id].type === 'vector');
          const firstSym = (st.layers.find(l => l.type === 'symbol') || {}).id;
          if (srcId) try {
            gl.addLayer({ id: 'trip-3d-buildings', type: 'fill-extrusion', source: srcId, 'source-layer': 'building', minzoom: 14,
              paint: paint }, firstSym);
          } catch (e) { /* 건물 층 없음 */ }
        }

        // 하늘: 기울였을 때 지평선 위 빈 배경 대신
        try {
          gl.setSky({
            'sky-color': dark ? '#0b1020' : '#8fb8f0',
            'horizon-color': dark ? '#1c2433' : '#e6eef8',
            'fog-color': dark ? '#141a26' : '#eef2f7',
            'sky-horizon-blend': 0.6,
            'horizon-fog-blend': 0.7,
            'fog-ground-blend': 0.35,
            'atmosphere-blend': 0,
          });
        } catch (e) { /* 하늘 미지원 */ }

        // 조명: 건물 면마다 밝기 차이 (지도 기준이라 돌리면 그림자 면도 바뀜)
        try {
          gl.setLight({ anchor: 'map', position: [1.15, 210, 30], color: '#ffffff', intensity: dark ? 0.3 : 0.45 });
        } catch (e) { /* 무시 */ }
      }
      applyLabels(mode) {
        const gl = this.gl;
        (gl.getStyle().layers || []).forEach(l => {
          if (l.type !== 'symbol' || !l.layout || !l.layout['text-field']) return;
          if (!this._labels) this._labels = {};
          if (!(l.id in this._labels)) this._labels[l.id] = l.layout['text-field'];
          const orig = this._labels[l.id];
          if (JSON.stringify(orig).indexOf('name') === -1) return;
          const tf = mode === 'ko' ? ['coalesce', ['get', 'name:ko'], ['get', 'name:latin'], ['get', 'name']] : orig;
          try { gl.setLayoutProperty(l.id, 'text-field', tf); } catch (e) { /* 무시 */ }
        });
      }

      // 층
      addLayer(l) { if (l instanceof LayerGroup) { l._onAdd(this); return this; } if (l._map === this) return this; l._onAdd(this); return this; }
      removeLayer(l) { if (!l) return this; if (l instanceof LayerGroup) { if (l._map === this) l._onRemove(this); return this; } if (l._map === this) l._onRemove(this); return this; }
      hasLayer(l) { return !!l && l._map === this; }
      eachLayer(f) { this._paths.forEach(f); return this; }
      createPane(n) { return this.getPane(n); }
      getPane(n) { this._panes = this._panes || {}; return this._panes[n] = this._panes[n] || { style: {}, classList: { add() {}, remove() {} } }; }
      // 조작 버튼
      addControl(c) {
        c._map = this;
        const el = c.onAdd(this);
        el.classList.add('leaflet-control');
        c._container = el;
        const pos = (c.options && c.options.position || 'topright');
        const corner = this._corners[pos] || this._corners.topright;
        if (pos.indexOf('bottom') === 0) corner.insertBefore(el, corner.firstChild); else corner.appendChild(el);
        return this;
      }
      removeControl(c) { if (c && c._container) { c._container.remove(); if (c.onRemove) c.onRemove(this); } return this; }
      // 화면
      getContainer() { return this._container; }
      getSize() { return new Point(this._container.clientWidth, this._container.clientHeight); }
      getZoom() { return this.gl.getZoom() + 1; }
      getCenter() { const c = this.gl.getCenter(); return new LatLng(c.lat, c.lng); }
      getBounds() { const b = this.gl.getBounds(); return new Bounds([b.getSouth(), b.getWest()], [b.getNorth(), b.getEast()]); }
      setView(ll, z, o) {
        ll = toLL(ll);
        const opt = { center: ll.toGL() };
        if (z != null) opt.zoom = z - 1;
        if (o && o.animate) this.gl.easeTo(Object.assign(opt, { duration: (o.duration || 0.5) * 1000 }));
        else this.gl.jumpTo(opt);
        return this;
      }
      panTo(ll, o) { return this.setView(ll, null, Object.assign({ animate: true }, o)); }
      panBy(p, o) { p = toPt(p); this.gl.panBy([p.x, p.y], { duration: o && o.animate === false ? 0 : 250 }); return this; }
      setZoom(z, o) { this.gl.easeTo({ zoom: z - 1, duration: o && o.animate === false ? 0 : 300 }); return this; }
      zoomIn() { this.gl.zoomIn(); return this; } zoomOut() { this.gl.zoomOut(); return this; }
      _pad(o) {
        o = o || {};
        const p = toPt(o.padding || [0, 0]), tl = toPt(o.paddingTopLeft || p), br = toPt(o.paddingBottomRight || p);
        return { top: tl.y, left: tl.x, bottom: br.y, right: br.x };
      }
      fitBounds(b, o) {
        b = toBounds(b);
        if (!b.isValid()) return this;
        o = o || {};
        const pad = this._pad(o), sz = this.getSize();
        // 패딩이 화면보다 크면 MapLibre가 거부함 → 줄임
        if (pad.top + pad.bottom >= sz.y - 20) { pad.top = pad.bottom = Math.max(0, (sz.y - 40) / 2); }
        if (pad.left + pad.right >= sz.x - 20) { pad.left = pad.right = Math.max(0, (sz.x - 40) / 2); }
        try {
          this.gl.fitBounds(b.toGL(), { padding: pad, maxZoom: o.maxZoom != null ? o.maxZoom - 1 : 22, duration: o.animate === false ? 0 : 600,
            bearing: this.gl.getBearing(), pitch: this.gl.getPitch() });
        } catch (e) { this.gl.jumpTo({ center: b.getCenter().toGL() }); }
        return this;
      }
      getBoundsZoom(b, inside, padding) {
        b = toBounds(b);
        const p = toPt(padding || [0, 0]);
        try {
          const cam = this.gl.cameraForBounds(b.toGL(), { padding: { top: p.y / 2, bottom: p.y / 2, left: p.x / 2, right: p.x / 2 } });
          return cam && cam.zoom != null ? cam.zoom + 1 : this.getZoom();
        } catch (e) { return this.getZoom(); }
      }
      project(ll, z) { return project(toLL(ll), z == null ? this.getZoom() : z); }
      unproject(p, z) { return unproject(toPt(p), z == null ? this.getZoom() : z); }
      latLngToContainerPoint(ll) { const p = this.gl.project(toLL(ll).toGL()); return new Point(p.x, p.y); }
      containerPointToLatLng(p) { p = toPt(p); const l = this.gl.unproject([p.x, p.y]); return new LatLng(l.lat, l.lng); }
      invalidateSize() { this.gl.resize(); return this; }
      // 말풍선
      _openPopup(layer, ll) {
        this.closePopup();
        const p = layer._popup;
        const html = typeof p.content === 'function' ? p.content(layer) : p.content;
        const isMarker = layer instanceof Marker;
        this._popup = new ML.Popup({ closeButton: true, maxWidth: (p.opts.maxWidth || 300) + 'px', className: 'trip-popup', offset: isMarker ? 18 : 6, focusAfterOpen: false })
          .setLngLat(toLL(ll).toGL()).setHTML('<div class="leaflet-popup-content">' + html + '</div>').addTo(this.gl);
        this.fire('popupopen', { popup: this._popup, layer: layer });
      }
      closePopup() { if (this._popup) { this._popup.remove(); this._popup = null; } return this; }
      // 3D: 기울이기 켜고 끄기
      toggle3D() {
        const on = this.gl.getPitch() > 5;
        this.gl.easeTo({ pitch: on ? 0 : 58, bearing: on ? 0 : -18, duration: 900 });
        return !on;
      }
    }

    /* ── L 바꿔 끼우기 (DomUtil·DomEvent 같은 DOM 도우미는 진짜 Leaflet 것) ── */
    const G = Object.assign({}, LL, {
      map: (id, o) => new GLMap(id, o),
      Map: GLMap,
      latLng: toLL, LatLng: LatLng,
      latLngBounds: (a, b) => new Bounds(a, b), LatLngBounds: Bounds,
      point: (x, y) => toPt(x, y), Point: Point,
      marker: (ll, o) => new Marker(ll, o), Marker: Marker,
      divIcon: o => Object.assign({ iconSize: [12, 12] }, o),
      polyline: (lls, o) => new Polyline(lls, o), Polyline: Polyline,
      circleMarker: (ll, o) => new CircleMarker(ll, o), CircleMarker: CircleMarker,
      circle: (ll, o) => new Circle(ll, o), Circle: Circle,
      Path: Path, Layer: Layer,
      layerGroup: list => new LayerGroup(list), LayerGroup: LayerGroup,
      tileLayer: () => new TileLayer(), TileLayer: TileLayer,
      Control: Control,
    });
    window.L = G;
  })();
</script>
