<!--App_Rail.html-->
<script>
  /* ───────── 디자인: 노선도 (일본 철도 안내 문법) ─────────
   *  - 날짜 머리: 굵은 밑줄 + 그날 시간을 노선 색 막대로 + 숫자 3개 (자세한 내용은 접어둠)
   *  - 시각표 숫자: 시는 크게, 분은 작게
   *  - 역 배지: 탈 것(역)은 노선 색 원, 머무는 곳은 네모 안 한 글자
   *  - 홈: 전광판 카운트다운은 그대로, 그 아래 "차내 안내" 띠 (다음 장소 + 오늘 지나온·남은 곳)
   *  스타일은 Style_Rail */
  const RAIL_WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const TYPE_CHAR = { 식당: '식', 카페: '카', 숙소: '숙', 관광지: '관', 쇼핑: '쇼', 교통: '역', 기타: '·' };
  const MODE_TINT = { walk: '#2f9e44', car: '#f08c3a', manual: '#8a94a3', transit: '#5b8cff' };
  function railDate(date) {
    const d = new Date(date + 'T00:00:00');
    return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + RAIL_WEEK[d.getDay()] + '요일';
  }
  // 그날 시간 쓰임: 머무는 곳은 도시 색, 이동은 노선·이동 수단 색, 길이는 분
  function dayBar(date) {
    const pts = DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order);
    const segs = DATA.segments.filter(s => s.date === date);
    const city = dayCity(date).color;
    const parts = [];
    pts.forEach(p => {
      const a = toMin(p.arrive), d = toMin(p.depart);
      if (a != null && d != null && d > a) parts.push({ m: d - a, c: city, n: pname(p), stay: true });
      const s = segs.find(x => x.fromOrder === p.order);
      if (s && s.minutes) {
        const cls = s.mode === '도보' ? 'walk' : s.mode === '차량' || (s.taxi && s.taxi.on) ? 'car' : s.mode === '수동' ? 'manual' : 'transit';
        parts.push({ m: s.minutes, c: segColor(s, false) || MODE_TINT[cls], n: '', stay: false });
      }
    });
    if (!parts.length) return '';
    const tot = parts.reduce((a, x) => a + x.m, 0);
    // 이름은 오래 머무는 곳 위주로 최대 4개, 너무 좁은 칸엔 안 씀
    const named = parts.filter(x => x.stay).sort((a, b) => b.m - a.m).slice(0, 4);
    return '<div class="dh-bar" role="img" aria-label="' + esc(railDate(date)) + ' 시간 쓰임">' +
      parts.map(x => '<span style="flex:' + x.m + ';background:' + esc(x.c) + '" title="' + esc(x.n ? x.n + ' ' + x.m + '분' : x.m + '분 이동') + '">' +
        (named.indexOf(x) >= 0 && x.m / tot > 0.12 ? '<i>' + esc(x.n) + '</i>' : '') + '</span>').join('') + '</div>';
  }
  function railStat(label, num, unit) {
    return '<div class="dh-stat"><span>' + label + '</span><b>' + num + '<small>' + unit + '</small></b></div>';
  }
  // 승차권 대신 노선도 날짜 머리 (App_Theme의 kippuHead를 바꿔 끼움)
  kippuHead = function (date, inner) {
    const nt = tokyoNow();
    const i = DATA.dates.indexOf(date);
    const r = typeof receiptData === 'function' ? receiptData(date) : null;
    const yen = n => Math.round(n || 0).toLocaleString('en-US');
    const stats = r ? railStat('걷기', r.walkKm != null ? r.walkKm.toFixed(1) : '-', ' km') +
      railStat('교통비', yen(r.fare), ' 엔') +
      (r.spent ? railStat('쓴 돈', yen(r.spent), ' 엔') : railStat('예산', r.budget ? money(r.budget).replace(/[¥₩]/g, '').trim() : '-', ' 엔')) : '';
    return '<section class="dayhead' + (date === nt.date ? ' today' : date < nt.date ? ' past' : '') + '" style="--city:' + dayCity(date).color + '">' +
      '<div class="dh-top"><h2 class="tl-day">' + esc(railDate(date)) + '</h2><span class="dh-n">' + (date === nt.date ? '오늘' : (i + 1) + '일째') + '</span></div>' +
      dayBar(date) +
      (stats ? '<div class="dh-stats">' + stats + '</div>' : '') +
      (inner ? '<details class="dh-more"><summary>날씨·지출 자세히</summary><div class="dh-body">' + inner + '</div></details>' : '') +
      '</section>';
  };

  // 시각표 숫자 + 역 배지 (타임라인을 그린 뒤 덧칠)
  function timetable(el) {
    const t = (el.textContent || '').trim();
    const m = t.match(/^(\d{1,2}):(\d{2})$/);
    if (m) el.innerHTML = '<b>' + Number(m[1]) + '</b><small>:' + m[2] + '</small>';
  }
  function lineMark(line) {
    const s = String(line || '');
    if (/JR/i.test(s)) return 'JR';
    const k = s.replace(/^(오사카|도쿄|교토)?\s*(메트로|지하철|시영)?\s*/, '');
    return k.charAt(0) || '·';
  }
  function badgeFor(p, pts, segs) {
    const pl = placeOf(p);
    const type = pl ? pl.type : '기타';
    if (type === '교통') {
      const out = segs.find(x => x.fromOrder === p.order), inn = segs.find(x => x.toOrder === p.order);
      const ride = (s, end) => { const rs = s && Array.isArray(s.steps) ? s.steps.filter(x => x.t === 'transit') : []; return end ? rs[rs.length - 1] : rs[0]; };
      const r = ride(out, false) || ride(inn, true);
      const c = segColor(out, false) || segColor(inn, true) || '#16202e';
      return '<span class="rb rb-st" style="--lc:' + esc(c) + '" aria-hidden="true">' + esc(r ? lineMark(r.line) : '역') + '</span>';
    }
    return '<span class="rb rb-pl" aria-hidden="true">' + esc(TYPE_CHAR[type] || '·') + '</span>';
  }
  const renderTimeline_rail = renderTimeline;
  renderTimeline = function () {
    renderTimeline_rail();
    const box = document.getElementById('tlInner');
    if (!box || !DATA) return;
    box.querySelectorAll('.ttime .a, .tst .t').forEach(el => {
      // .tst .t 안에 small(하차·승차)이 같이 있으면 첫 글자 부분만
      if (el.matches('.tst .t')) {
        const tn = el.firstChild;
        if (tn && tn.nodeType === 3) { const m = tn.textContent.trim().match(/^(\d{1,2}):(\d{2})$/); if (m) { const s = document.createElement('span'); s.className = 'tt'; s.innerHTML = '<b>' + Number(m[1]) + '</b><small>:' + m[2] + '</small>'; el.replaceChild(s, tn); } }
        return;
      }
      timetable(el);
    });
    box.querySelectorAll('.titem[data-key]').forEach(it => {
      if (it.querySelector('.rb')) return;
      const [date, ord] = it.dataset.key.split('#');
      const p = DATA.points.find(x => x.date === date && String(x.order) === ord);
      if (!p) return;
      const pts = DATA.points.filter(x => x.date === date).sort((a, b) => a.order - b.order);
      const segs = DATA.segments.filter(s => s.date === date);
      it.insertAdjacentHTML('afterbegin', badgeFor(p, pts, segs));
    });
  };

  /* ── 홈: 전광판 아래 "차내 안내" 띠 ── */
  //  여행 전: 첫 출발. 여행 중: 다음 장소 + 오늘 지나온 곳(색)·남은 곳(회색)
  function nextPanel() {
    const range = tripRange();
    if (!range) return '';
    const nt = tokyoNow();
    const before = new Date() < range.start;
    let target, date;
    if (before) { target = range.first; date = target.date; }
    else {
      target = typeof nextStopNow === 'function' ? nextStopNow() : null;
      if (!target) return '';
      date = target.date;
    }
    const pts = DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order);
    const ti = pts.indexOf(target);
    const city = dayCity(date).color;
    const pl = placeOf(target);
    const sub = pl && pl.name && pl.name !== pname(target) ? pl.name : '';
    const left = before ? '' : (() => {
      const m = (predictedMin(target) != null ? predictedMin(target) : toMin(target.arrive)) - nt.min;
      return m > 0 ? m + '분 뒤' : '곧';
    })();
    const strip = pts.slice(0, 12).map((p, i) => {
      const passed = !before && i < ti;
      const here = i === ti;
      return (i ? '<i class="' + (passed || here ? 'on' : '') + '"></i>' : '') + '<b class="' + (here ? 'here' : passed ? 'on' : '') + '" title="' + esc(pname(p)) + '"></b>';
    }).join('');
    return '<div class="trainvision" style="--city:' + city + '">' +
      '<div class="tv-top"><span>' + (before ? '첫 출발' : '다음') + '</span><span class="tv-time">' + esc(target.arrive || target.depart || '') + (left ? ' · ' + left : '') + '</span></div>' +
      '<div class="tv-main">' + badgeFor(target, pts, DATA.segments.filter(s => s.date === date)) +
        '<div><div class="tv-name">' + esc(pname(target)) + '</div>' + (sub ? '<div class="tv-sub">' + esc(sub) + '</div>' : '') + '</div></div>' +
      '<div class="tv-strip">' + strip + '</div></div>';
  }
  const renderHomeBody_rail = renderHomeBody;
  renderHomeBody = function () {
    renderHomeBody_rail();
    const body = document.getElementById('homeBody');
    if (!body || !DATA) return;
    // 탑승권 카드 대신 차내 안내 띠
    const bp = body.querySelector('.bpass');
    const html = nextPanel();
    if (bp) bp.outerHTML = html;
    else if (html) body.insertAdjacentHTML('afterbegin', html);
  };
</script>
