<script>
  /* ───────── 하루 리플레이 ───────── */

  const replayLayer = L.layerGroup().addTo(map);
  let RP = null;

  // 다음 장소로 떠나는 지점: 종착점 있으면 종착점, 없으면 시작점
  function outLL(p) { return hasEnd(p) ? [p.endLat, p.endLng] : [p.lat, p.lng]; }

  function buildReplay(date) {
    const pts = DATA.points.filter(p => p.date === date && p.lat != null).sort((a, b) => a.order - b.order);
    const segs = DATA.segments.filter(s => s.date === date);
    const ev = [];
    pts.forEach((p, i) => {
      const a = toMin(p.arrive), d = toMin(p.depart);
      if (a != null) ev.push({ type: 'stay', p: p, a: a, d: d != null ? d : a });
      const nx = pts[i + 1];
      if (!nx) return;
      const s = segs.find(x => x.fromOrder === p.order && x.toOrder === nx.order);
      const dep = toMin(p.depart), arr = toMin(nx.arrive);
      if (dep == null || arr == null) return;
      let coords = s && s.polyline ? decodePolyline(s.polyline) : [];
      if (coords.length < 2) coords = arcPoints(outLL(p), [nx.lat, nx.lng]);
      const cum = [0];
      for (let k = 1; k < coords.length; k++) cum.push(cum[k - 1] + haversine(coords[k - 1], coords[k]));
      ev.push({ type: 'move', s: s, from: p, to: nx, a: dep, d: arr, coords: coords, cum: cum, total: cum[cum.length - 1] || 1 });
    });
    // 재생 길이: 이동은 그대로, 머무는 시간은 1/4로 압축
    let u = 0;
    ev.forEach(e => { e.u0 = u; e.len = Math.max(0.5, (e.d - e.a) * (e.type === 'stay' ? 0.25 : 1)); u += e.len; });
    return { ev: ev, total: u };
  }

  // 머무는 동안 위치: 종착점이 있으면 시작점 → 종착점으로 천천히 걸어감
  function stayPos(p, f) {
    if (!hasEnd(p)) return [p.lat, p.lng];
    return [p.lat + (p.endLat - p.lat) * f, p.lng + (p.endLng - p.lng) * f];
  }

  function startReplay(date) {
    stopReplay();
    const R = buildReplay(date);
    if (!R.ev.length) { setStatus('리플레이할 좌표·시각이 없음', true); return; }
    const first = R.ev[0].type === 'stay' ? [R.ev[0].p.lat, R.ev[0].p.lng] : R.ev[0].coords[0];
    // 구간 길이에 맞춘 확대 단계: 머무는 곳은 가깝게(16), 이동은 그 구간이 한 화면에 들어오게 (10~16)
    R.ev.forEach(e => {
      if (e.type === 'stay') { e.zoom = 16; return; }
      e.bounds = L.latLngBounds(e.coords);
      e.zoom = Math.max(10, Math.min(16, map.getBoundsZoom(e.bounds, false, L.point(80, 140))));
    });
    RP = Object.assign(R, {
      date: date, u: 0, speed: 1, playing: true, last: null, stopKey: null, evIdx: -1, camLock: 0,
      perSec: R.total / 28,   // 1배속 기준 약 28초에 하루
      marker: L.marker(first, { icon: L.divIcon({ className: '', html: '<div class="rp-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000 }).addTo(replayLayer),
      trail: L.polyline([first], { color: '#ff3b30', weight: 5, opacity: .85 }).addTo(replayLayer),
    });
    map.setView(first, 15);
    const panel = L.DomUtil.create('div', 'rp-panel', map.getContainer());
    panel.id = 'rpPanel';
    panel.innerHTML = '<div class="rp-clock" id="rpClock">--:--</div><div class="rp-label" id="rpLabel"></div>' +
      '<div class="rp-ctrl"><button type="button" id="rpPlay" aria-label="일시정지">❚❚</button>' +
      '<button type="button" id="rpSpeed" aria-label="속도">1x</button><button type="button" id="rpClose" aria-label="닫기">✕</button></div>' +
      '<input class="rp-range" id="rpRange" type="range" min="0" max="1000" value="0" aria-label="재생 위치">';
    L.DomEvent.disableClickPropagation(panel);
    L.DomEvent.disableScrollPropagation(panel);
    document.getElementById('rpPlay').onclick = () => {
      if (RP.u >= RP.total) RP.u = 0;
      RP.playing = !RP.playing; RP.last = null;
      document.getElementById('rpPlay').textContent = RP.playing ? '❚❚' : '▶';
      if (RP.playing) RP.raf = requestAnimationFrame(rpFrame);
    };
    document.getElementById('rpSpeed').onclick = () => {
      RP.speed = RP.speed === 1 ? 2 : RP.speed === 2 ? 4 : 1;
      document.getElementById('rpSpeed').textContent = RP.speed + 'x';
    };
    document.getElementById('rpClose').onclick = stopReplay;
    document.getElementById('rpRange').oninput = e => { RP.u = e.target.value / 1000 * RP.total; rpDraw(true); };
    RP.raf = requestAnimationFrame(rpFrame);
  }

  function rpFrame(ts) {
    if (!RP || !RP.playing) return;
    if (RP.last != null) RP.u += (ts - RP.last) / 1000 * RP.perSec * RP.speed;
    RP.last = ts;
    if (RP.u >= RP.total) {
      RP.u = RP.total; rpDraw(false); RP.playing = false;
      document.getElementById('rpPlay').textContent = '▶';
      const b = RP.trail.getBounds(); if (b.isValid()) map.fitBounds(b, { padding: [40, 40] });
      return;
    }
    rpDraw(false);
    RP.raf = requestAnimationFrame(rpFrame);
  }

  // 카메라가 점을 매 프레임 부드럽게 따라감 (예전: 화면 밖으로 나가면 0.6초 애니메이션으로 따라가서 빠를 때 놓침)
  //  폰에서 아래 목록 시트가 지도를 덮으면 보이는 부분의 가운데 기준
  function followCam(pos, snap) {
    if (!snap && RP && performance.now() < RP.camLock) return;   // 확대·축소 이동 중
    // 이동 구간을 통째로 보여주는 중이면 점이 화면 가장자리에 닿을 때만 따라감
    if (!snap && RP && RP.fitMode) { if (!map.getBounds().pad(-0.12).contains(pos)) map.panTo(pos, { animate: false }); return; }
    const size = map.getSize();
    let visH = size.y;
    const list = document.getElementById('list');
    if (list && matchMedia('(max-width: 800px)').matches) visH = Math.max(120, size.y - list.getBoundingClientRect().height);
    const c = L.point(size.x / 2, visH / 2);
    const d = map.latLngToContainerPoint(pos).subtract(c);
    const dist = Math.hypot(d.x, d.y);
    if (snap) { if (dist > 1) map.panBy(d, { animate: false }); return; }
    if (dist < 20) return;
    const limit = Math.min(size.x, visH) * 0.28;   // 가운데에서 이만큼 넘게 벗어나면 그 자리에 붙잡아 둠
    const k = 0.12;                                // 나머지는 조금씩 따라감
    const move = dist > limit ? d.multiplyBy((dist - limit) / dist + k * limit / dist) : d.multiplyBy(k);
    map.panBy(move, { animate: false });
  }

  function rpDraw(seek) {
    const e = RP.ev.find(x => RP.u >= x.u0 && RP.u < x.u0 + x.len) || RP.ev[RP.ev.length - 1];
    const f = Math.max(0, Math.min(1, (RP.u - e.u0) / e.len));
    const clock = e.a + f * (e.d - e.a);
    let pos, label;
    if (e.type === 'stay') {
      pos = stayPos(e.p, f);
      label = '📍 ' + pname(e.p) + (e.p.activity ? ' · ' + e.p.activity : '');
      const key = e.p.date + '#' + e.p.order;
      if (RP.stopKey !== key) {
        RP.stopKey = key;
        const el = document.querySelector('.stop[data-key="' + key + '"]');
        if (el) { clearActive(); el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
      }
    } else {
      const dist = f * e.total;
      let k = 1;
      while (k < e.cum.length - 1 && e.cum[k] < dist) k++;
      const s0 = e.cum[k - 1], s1 = e.cum[k] || s0 + 1;
      const t = Math.max(0, Math.min(1, (dist - s0) / (s1 - s0)));
      pos = [e.coords[k - 1][0] + (e.coords[k][0] - e.coords[k - 1][0]) * t, e.coords[k - 1][1] + (e.coords[k][1] - e.coords[k - 1][1]) * t];
      label = (e.s ? e.s.mode : '이동') + ' → ' + pname(e.to);
    }
    RP.marker.setLatLng(pos);
    // 새 구간에 들어가면 그 구간 길이에 맞게 확대·축소
    const idx = RP.ev.indexOf(e);
    if (idx !== RP.evIdx) {
      RP.evIdx = idx;
      RP.fitMode = e.type === 'move' && e.zoom < 15;
      const anim = !seek && !matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (e.type === 'move') map.fitBounds(e.bounds, { paddingTopLeft: [60, 60], paddingBottomRight: [60, 160], maxZoom: 16, animate: anim, duration: 0.8 });
      else if (Math.abs(map.getZoom() - e.zoom) >= 1) map.setView(pos, e.zoom, { animate: anim, duration: 0.8 });
      RP.camLock = anim ? performance.now() + 900 : 0;
    }
    if (seek) {
      // 탐색했을 땐 그 시점까지 지나온 경로를 다시 그림
      const pts = [];
      RP.ev.forEach(x => {
        if (x.u0 > RP.u) return;
        if (x.type === 'move') {
          const ff = Math.min(1, (RP.u - x.u0) / x.len);
          x.coords.forEach((c, i) => { if (x.cum[i] <= ff * x.total) pts.push(c); });
        } else {
          pts.push([x.p.lat, x.p.lng]);
          if (hasEnd(x.p)) pts.push(stayPos(x.p, Math.min(1, (RP.u - x.u0) / x.len)));
        }
      });
      pts.push(pos);
      RP.trail.setLatLngs(pts);
      followCam(pos, true);
    } else {
      RP.trail.addLatLng(pos);
      followCam(pos, false);
    }
    document.getElementById('rpClock').textContent = hhmm(Math.round(clock));
    document.getElementById('rpLabel').textContent = label;
    document.getElementById('rpRange').value = Math.round(RP.u / RP.total * 1000);
  }

  function stopReplay() {
    if (!RP) return;
    cancelAnimationFrame(RP.raf);
    replayLayer.clearLayers();
    const panel = document.getElementById('rpPanel');
    if (panel) panel.remove();
    RP = null;
  }
</script>
