# 화면 코드가 바뀌면 정적 페이지 이미지를 arm64로 빌드해서 GHCR에 올림
name: web image

on:
  push:
    branches: [main]
    paths:
      - 'Index.html'
      - 'App_*.html'
      - 'Style_*.html'
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/oes52/trip-web:latest
            ghcr.io/oes52/trip-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
