# 화면 코드가 바뀌면 정적 페이지 이미지를 arm64로 빌드해서 GHCR에 올림
name: web image

on:
  push:
    branches: [main]
    paths:
      - 'Index.html'
      - 'App_*.html'
      - 'Style_*.html'
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: write   # 배포 태그 갱신 커밋용
  packages: write

# 연달아 push해도 한 번에 하나씩 (태그 갱신 커밋이 서로 엇갈리지 않게)
concurrency:
  group: web-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/oes52/trip-web:latest
            ghcr.io/oes52/trip-web:${{ github.sha }}
          # 이미지가 이 저장소 소속이라고 표시 → GHCR 패키지가 저장소에 자동 연결됨
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=trip-web
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CD: k8s/kustomization.yaml 이미지 태그를 이번 커밋 sha로 바꿔서 커밋 → Fleet이 1분 안에 감지해서 배포
      #  GITHUB_TOKEN으로 한 push는 워크플로를 다시 실행하지 않아서 무한 반복 없음 (k8s/는 paths에도 없음)
      - name: 배포 태그 갱신
        run: |
          sed -i -E "s|^(\s*newTag:\s*).*$|\1${GITHUB_SHA}|" k8s/kustomization.yaml
          grep -n "newTag" k8s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          if git diff --cached --quiet; then echo "태그 변경 없음"; exit 0; fi
          git commit -m "deploy: trip-web ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "push 실패"; exit 1
