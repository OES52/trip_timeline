<script>
  /* ── 실제 지출 ── */

  function saveSpend(vk, place, amount, memo, opts) {
    opts = opts || {};
    if (!canStamp()) return;
    DATA.spend = DATA.spend || {};
    const prev = DATA.spend[vk] ? Object.assign({}, DATA.spend[vk]) : null;
    if (!opts.silent) {
      showToast(amount === '' || amount == null ? '지출 삭제' : '지출 ' + YEN(Number(amount)) + ' 저장',
        () => saveSpend(vk, place, prev ? prev.amount : '', prev ? prev.memo : '', { silent: true }));
    }
    if (amount === '' || amount == null) delete DATA.spend[vk];
    else DATA.spend[vk] = { amount: Number(amount), memo: memo || '' };
    refresh();
    const seq = ++spendSeq;
    google.script.run
      .withSuccessHandler(map => { if (seq === spendSeq) { DATA.spend = map; RAW.spend = map; } })
      .withFailureHandler(err => handleWriteError(err, '지출'))
      .setSpend(vk, place, amount === '' ? '' : Number(amount), memo || '', USER.id, getPin(USER.id));
  }

  // 그날 실제 지출 합계 vs 예산(같은 예산 번호는 한 번만)
  function actualBlock(pts) {
    let actual = 0, has = false, plan = 0;
    const seen = {};
    pts.forEach(p => {
      const sp = DATA.spend && DATA.spend[p.date + '#' + p.order];
      if (sp) { actual += sp.amount; has = true; }
      if (p.yen != null && !isNaN(p.yen)) {
        const k = p.budgetId || (p.date + '#' + p.order);
        if (!seen[k]) { seen[k] = true; plan += p.yen; }
      }
    });
    if (!has) return '';
    const diff = actual - plan;
    return '<p class="actual">실제 지출 <b>' + YEN(actual) + '</b>' +
      (plan ? ' / 예산 ' + YEN(plan) + (diff > 0 ? ' <span class="over">' + YEN(diff) + ' 초과</span>' : ' (' + YEN(-diff) + ' 남음)') : '') + '</p>';
  }

  /* ── 영업시간·휴무 경고 ── */

  // "11:00~15:00, 17:00~22:00" → [[660,900],[1020,1320]]. 자정 넘는 종료는 +24h
  function parseHours(text) {
    const out = [];
    const re = /(\d{1,2}):(\d{2})\s*[~\-–〜]\s*(\d{1,2}):(\d{2})/g;
    let m;
    while ((m = re.exec(String(text || '')))) {
      const a = Number(m[1]) * 60 + Number(m[2]);
      let b = Number(m[3]) * 60 + Number(m[4]);
      if (b <= a) b += 1440;
      out.push([a, b]);
    }
    return out;
  }

  function hhmm(min) { return Math.floor(min / 60) % 24 + ':' + String(min % 60).padStart(2, '0'); }

  // 영업시간 칸 형식: 기본 + 요일별·날짜별 예외를 " / "(앞뒤 띄움)로 이어 붙임
  //  "11:00~15:00, 17:00~22:00 / 토·일 11:00~22:00 / 12/31 11:00~18:00 / 1/1 휴무"
  //  그날 시간표 고르는 순서: 날짜 > 요일 > 기본 (서버 hoursForDate_와 같은 규칙)
  const HOURS_DOW = '일월화수목금토';
  function hoursDowSet(label) {
    const t = String(label).replace(/요일/g, '');
    const set = {};
    const rg = t.match(/^([일월화수목금토])\s*[~\-–〜]\s*([일월화수목금토])$/);
    if (rg) {
      let i = HOURS_DOW.indexOf(rg[1]);
      const j = HOURS_DOW.indexOf(rg[2]);
      for (let k = 0; k < 7; k++) { set[i] = true; if (i === j) break; i = (i + 1) % 7; }
      return set;
    }
    t.split(/[\s·,，、]+/).forEach(c => { const i = HOURS_DOW.indexOf(c); if (i >= 0) set[i] = true; });
    return set;
  }

  // date의 시간표 → { text, label, closed, ranges } / 칸이 비었으면 null
  function hoursFor(text, date) {
    const t = String(text || '').trim();
    if (!t) return null;
    const [y, mo, d] = date.split('-').map(Number);
    const dow = new Date(Date.UTC(y, mo - 1, d)).getUTCDay();
    const md = mo * 100 + d;
    let base = null, byDow = null, byDate = null;
    t.split(/\s+\/\s+|\s*;\s*/).forEach(seg => {
      seg = seg.trim();
      if (!seg) return;
      let m = seg.match(/^(\d{1,2})\/(\d{1,2})(?:\s*[~\-–〜]\s*(\d{1,2})\/(\d{1,2}))?\s+(.+)$/);
      if (m) {
        const a = Number(m[1]) * 100 + Number(m[2]);
        const b = m[3] ? Number(m[3]) * 100 + Number(m[4]) : a;
        if (!byDate && (a <= b ? (md >= a && md <= b) : (md >= a || md <= b))) byDate = { body: m[5], label: seg.slice(0, seg.length - m[5].length).trim() };
        return;
      }
      m = seg.match(/^([일월화수목금토](?:요일)?(?:\s*[·,~\-–〜]\s*[일월화수목금토](?:요일)?)*)\s+(.+)$/);
      if (m) {
        if (!byDow && hoursDowSet(m[1])[dow]) byDow = { body: m[2], label: m[1] };
        return;
      }
      if (!base) base = { body: seg, label: '' };
    });
    const pick = byDate || byDow || base;
    if (!pick) return null;
    const ranges = parseHours(pick.body);
    return { text: pick.body, label: pick.label, closed: !ranges.length && /휴무|휴업|closed/i.test(pick.body), ranges: ranges };
  }

  // 휴무 칸에서 요일·날짜(12/31, 12/30~1/3) 읽어서 그날이 휴무인지
  function closedOn(text, date) {
    const t = String(text || '');
    if (!t || /연중무휴|무휴|없음/.test(t)) return false;
    const [y, mo, d] = date.split('-').map(Number);
    const dow = '일월화수목금토'[new Date(Date.UTC(y, mo - 1, d)).getUTCDay()];
    const tokens = t.split(/[\s,，/·、]+/);
    if (tokens.some(x => x === dow || x === dow + '요일' || x === dow + '요')) return true;
    if (new RegExp(dow + '요일').test(t)) return true;
    const re = /(\d{1,2})\/(\d{1,2})(?:\s*[~\-–〜]\s*(\d{1,2})\/(\d{1,2}))?/g;
    let m;
    const md = mo * 100 + d;
    while ((m = re.exec(t))) {
      const a = Number(m[1]) * 100 + Number(m[2]);
      const b = m[3] ? Number(m[3]) * 100 + Number(m[4]) : a;
      if (a <= b ? (md >= a && md <= b) : (md >= a || md <= b)) return true;  // 12/30~1/3처럼 해 넘김
    }
    return false;
  }

  // 메모 속 마감 시각(분). "15시 전까지", "21시까지", "최종 입장 16:30", "L.O. 19:45" 등. 여러 개면 가장 이른 것
  function memoDeadline(memo) {
    const t = String(memo || '');
    const out = [];
    [
      /(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분)?\s*(?:전)?\s*까지/g,
      /(\d{1,2}):(\d{2})\s*(?:전)?\s*까지/g,
      /최종\s*(?:입장|탑승|주문|접수)?\s*(\d{1,2}):(\d{2})/g,
      /(?:L\.?\s*O\.?|라스트\s*오더)\s*(\d{1,2}):(\d{2})/gi,
    ].forEach(re => {
      let m;
      while ((m = re.exec(t))) out.push(Number(m[1]) * 60 + Number(m[2] || 0));
    });
    return out.length ? Math.min.apply(null, out) : null;
  }

  // 경고: 메모 마감 넘김 / 휴무 / 영업시간 밖 (교통·숙소는 영업시간 비교 안 함: 역 첫차 시각 같은 게 걸려서)
  function warnings(p) {
    const out = [];
    const a = toMin(p.arrive), d = toMin(p.depart);
    const dl = memoDeadline(p.memo);
    if (dl != null && a != null && a > dl) out.push('메모 마감 ' + hhmm(dl) + ' 넘김 (' + p.arrive + ' 도착)');
    // 시작점→종착점 걷기만으로 체류 시간 초과 (시장·상점가 관통)
    if (p.inner && p.inner.min > (p.stay || 0)) {
      out.push('시작점→종착점 걷기만 ' + p.inner.min + '분' + (p.inner.est ? ' (어림)' : '') + ', 체류 ' + (p.stay || 0) + '분보다 김');
    }
    const pl = placeOf(p);
    if (!pl) return out;
    if (closedOn(pl.closed, p.date)) { out.push('이날 휴무 (' + pl.closed + ')'); return out; }
    if (pl.type === '교통' || pl.type === '숙소') return out;
    const h = hoursFor(pl.hours, p.date);
    if (!h || a == null) return out;
    const day = h.label ? ' [' + h.label + ']' : '';
    if (h.closed) { out.push('이날 휴무' + day); return out; }
    const ranges = h.ranges;
    if (!ranges.length) return out;
    let inRange = ranges.find(r => a >= r[0] && a < r[1]);
    let aa = a;
    // 새벽 도착: 자정 넘어 영업하는 칸(18:00~02:00)에 걸치는지
    if (!inRange) { inRange = ranges.find(r => a + 1440 >= r[0] && a + 1440 < r[1]); if (inRange) aa = a + 1440; }
    let dd = d;
    if (dd != null && dd < a) dd += 1440;
    if (dd != null) dd += aa - a;
    const soon = DATA && DATA.closeSoonMin != null ? DATA.closeSoonMin : 30;
    if (!inRange) {
      const nextOpen = ranges.filter(r => r[0] > a).sort((x, y) => x[0] - y[0])[0];
      out.push((nextOpen ? '영업 전 도착 (' + hhmm(nextOpen[0]) + ' 오픈)' : '영업 끝난 뒤 도착 (' + hhmm(Math.max.apply(null, ranges.map(r => r[1]))) + ' 종료)') + day);
    } else if ((pl.type === '식당' || pl.type === '카페') && inRange[1] - aa < soon) {
      out.push('마감 ' + hhmm(inRange[1]) + ' 직전 도착, 라스트오더 확인' + day);
    } else if (dd != null && dd > inRange[1]) {
      out.push('머무는 중 영업 종료 (' + hhmm(inRange[1]) + ')' + day);
    }
    return out;
  }

  function warnHtml(p) {
    const w = warnings(p);
    return w.length ? '<div class="warn">' + w.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : '';
  }

  /* ── 날씨 ── */

  function wxInfo(code) {
    if (code === 0) return ['☀️', '맑음'];
    if (code <= 2) return ['🌤️', '대체로 맑음'];
    if (code === 3) return ['☁️', '흐림'];
    if (code === 45 || code === 48) return ['🌫️', '안개'];
    if (code >= 51 && code <= 57) return ['🌦️', '이슬비'];
    if (code >= 61 && code <= 67) return ['🌧️', '비'];
    if (code >= 71 && code <= 77) return ['❄️', '눈'];
    if (code >= 80 && code <= 82) return ['🌦️', '소나기'];
    if (code >= 85 && code <= 86) return ['🌨️', '눈'];
    if (code >= 95) return ['⛈️', '뇌우'];
    return ['🌡️', ''];
  }

  function wxShort(date) {
    const w = DATA && DATA.weather && DATA.weather[date];
    if (!w) return '';
    return '<span class="wx">' + wxInfo(w.code)[0] + ' ' + Math.round(w.max) + '°</span>';
  }

  function wxLine(date) {
    const w = DATA && DATA.weather && DATA.weather[date];
    if (!w) return '';
    const [icon, text] = wxInfo(w.code);
    return '<p class="wx-line"><span class="wxl" data-wx="' + wxKind(w.code) + '">' + icon + '</span>' + text + ', ' + Math.round(w.min) + '° / ' + Math.round(w.max) + '°' +
      (w.pop != null ? ', 강수 ' + w.pop + '%' : '') + '</p>';
  }

  /* ── 방문 체크 ── */

  function isVisited(p) { return !!(DATA.visited && DATA.visited[p.date + '#' + p.order]); }

  function toggleVisit(vk, opts) {
    opts = opts || {};
    if (!canStamp()) { showToast(USER ? USER.id + '는 보기 전용이라 도장을 찍을 수 없음' : '먼저 사용자를 고르기'); return; }
    const on = !(DATA.visited && DATA.visited[vk]);
    DATA.visited = DATA.visited || {};
    if (on) DATA.visited[vk] = 1; else delete DATA.visited[vk];
    const p = DATA.points.find(x => x.date + '#' + x.order === vk);
    if (on && p && !opts.silent) showStamp(p);
    if (!opts.silent && !opts.quiet) {
      const name = p ? pname(p) : '';
      showToast(on ? name + ' 도장 찍음' : name + ' 방문 체크 해제', () => toggleVisit(vk, { silent: true }));
    }
    refresh();  // 화면 먼저 바꾸고 저장
    queueVisit(vk, on);
  }

  // 연달아 찍고 지워도 꼬이지 않게: 0.35초 모아서 한 번에, 이전 요청이 끝난 뒤에만 다음 요청
  let visitQueue = {}, visitTimer = null, visitBusy = false;
  function queueVisit(vk, on) {
    visitQueue[vk] = on ? 1 : 0;
    clearTimeout(visitTimer);
    visitTimer = setTimeout(flushVisits, 350);
  }
  function flushVisits() {
    if (visitBusy || !USER || !Object.keys(visitQueue).length) return;
    const changes = visitQueue, user = USER.id;
    visitQueue = {};
    visitBusy = true;
    google.script.run
      .withSuccessHandler(map => {
        visitBusy = false;
        RAW.visitedBy = RAW.visitedBy || {};
        RAW.visitedBy[user] = map;
        if (Object.keys(visitQueue).length) { flushVisits(); return; }   // 그 사이 또 누른 게 있으면 그것부터
        if (USER && USER.id === user && JSON.stringify(Object.keys(map).sort()) !== JSON.stringify(Object.keys(DATA.visited || {}).sort())) {
          DATA.visited = map;   // 서버랑 다를 때만 맞춤
          refresh();
        }
      })
      .withFailureHandler(err => { visitBusy = false; handleWriteError(err, '도장'); })
      .setVisitedMany(changes, user, getPin(user));
  }

  /* ── 실제 도착 기록 · 예상 시각 ── */

  function arrivedAt(p) { return DATA.arrived ? DATA.arrived[p.date + '#' + p.order] || null : null; }

  // 그날 마지막으로 도착 기록한 곳 기준 지연(분). 자정 넘김 보정
  function dayDelay(date) {
    let ref = null;
    DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order).forEach(p => {
      const a = arrivedAt(p), pm = toMin(p.arrive);
      if (!a || pm == null) return;
      let d = toMin(a) - pm;
      if (d < -720) d += 1440;
      if (d > 720) d -= 1440;
      ref = { order: p.order, delay: d, at: a, p: p };
    });
    return ref;
  }

  // 기록한 곳 이후 장소들은 같은 지연만큼 밀린다고 보고 예상 도착
  function predictedMin(p) {
    const r = dayDelay(p.date);
    const pm = toMin(p.arrive);
    if (!r || p.order <= r.order || pm == null) return null;
    return pm + r.delay;
  }

  function sgn(n) { return (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n); }

  // 시각 칸 아래 한 줄: 실제 도착 또는 예상 도착
  function timeExtra(p) {
    const a = arrivedAt(p);
    if (a) {
      const pm = toMin(p.arrive);
      let d = pm == null ? null : toMin(a) - pm;
      if (d != null && d < -720) d += 1440;
      return '<span class="real">실제 ' + esc(a) + (d ? ' (' + sgn(d) + ')' : '') + '</span>';
    }
    const pr = predictedMin(p);
    const r = dayDelay(p.date);
    if (pr == null || !r || !r.delay) return '';
    return '<span class="pred ' + (r.delay > 0 ? 'late' : 'early') + '">예상 ' + hhmm(pr) + '</span>';
  }

  function paceLine(date) {
    const r = dayDelay(date);
    if (!r) return '';
    const name = pname(r.p);
    if (!r.delay) return '<p class="pace ok">계획대로 진행 중 (' + esc(name) + ' ' + esc(r.at) + ' 도착)</p>';
    return '<p class="pace ' + (r.delay > 0 ? 'late' : 'early') + '">지금 페이스: ' + Math.abs(r.delay) + '분 ' + (r.delay > 0 ? '늦음' : '빠름') +
      ' (' + esc(name) + ' ' + esc(r.at) + ' 도착 기준)</p>';
  }

  let arrSeq = 0, spendSeq = 0;
  function saveArrival(vk, hhmmStr, opts) {
    opts = opts || {};
    if (!canStamp()) return;
    DATA.arrived = DATA.arrived || {};
    const prev = DATA.arrived[vk] || '';
    if (hhmmStr) DATA.arrived[vk] = hhmmStr; else delete DATA.arrived[vk];
    if (!opts.silent) showToast(hhmmStr ? '도착 ' + hhmmStr + ' 기록' : '도착 기록 삭제', () => saveArrival(vk, prev, { silent: true }));
    refresh();
    const seq = ++arrSeq, user = USER.id;
    google.script.run
      .withSuccessHandler(map => {
        RAW.arrivedBy = RAW.arrivedBy || {};
        RAW.arrivedBy[user] = map;
        if (seq === arrSeq && USER && USER.id === user) DATA.arrived = map;
      })
      .withFailureHandler(err => handleWriteError(err, '도착 기록'))
      .setArrived(vk, hhmmStr || '', user, getPin(user));
  }

  // "도착" 버튼: 지금 시각으로 기록 + 아직 안 찍었으면 도장도
  function recordArrivalNow(vk) {
    const now = tokyoNow();
    const p = DATA.points.find(x => x.date + '#' + x.order === vk);
    let m = now.min;
    if (p && now.date > p.date) m += 1440;   // 자정 넘긴 경우 25:10 식으로
    const t = hhmm(m).padStart(5, '0');
    if (!(DATA.visited && DATA.visited[vk])) toggleVisit(vk, { quiet: true });
    saveArrival(vk, t);
  }

  /* ── 웹에서 일정 살짝 고치기 ── */

  function editPlan(vk, op, value, label, undo) {
    if (!canEdit()) return;
    // 체류 조정·건너뛰기 모두 서버에서 경로를 다시 계산함
    setStatus('일정 반영 중… 경로 다시 계산이라 10~30초 걸릴 수 있음');
    document.getElementById('reload').classList.add('spin');
    google.script.run
      .withSuccessHandler(data => {
        document.getElementById('reload').classList.remove('spin');
        applyData(data, true);
        saveCache(data);
        setStatus('');
        showToast(label, undo);
      })
      .withFailureHandler(err => {
        document.getElementById('reload').classList.remove('spin');
        handleWriteError(err, '일정 수정');
      })
      .editPlan(vk, op, value, USER.id, getPin(USER.id));
  }

  /* ── 지금 / 다음 (일본 시간 기준) ── */

  function tokyoNow() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date());
    const g = t => parts.find(x => x.type === t).value;
    return { date: g('year') + '-' + g('month') + '-' + g('day'), min: Number(g('hour')) % 24 * 60 + Number(g('minute')) };
  }

  function toMin(s) {
    const m = String(s || '').match(/^(\d+):(\d{2})/);
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  }

  // 지금 머무는 곳, 없으면 다음 도착할 곳
  function nowStop(date, pts) {
    const now = tokyoNow();
    if (now.date !== date) return null;
    for (const p of pts) {
      const a = toMin(p.arrive), d = toMin(p.depart);
      if (a != null && d != null && a <= now.min && now.min <= d) return { order: p.order, next: false };
    }
    for (const p of pts) {
      const a = toMin(p.arrive);
      if (a != null && a > now.min) return { order: p.order, next: true };
    }
    return null;
  }
</script>
