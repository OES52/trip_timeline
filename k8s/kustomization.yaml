# Fleet이 이 폴더를 kustomize로 렌더링해서 배포
# newTag는 GitHub Actions가 이미지 빌드 후 커밋 sha로 자동 갱신함 (.github/scripts/bump-tag.sh). 손으로 바꾸면 그 이미지로 롤백
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - trip-web.yaml
  - trip-api.yaml
images:
  - name: ghcr.io/oes52/trip-web
    newTag: a72ae8b838d8363a11c8da85d59b636e6d2e4635
  - name: ghcr.io/oes52/trip-api
    newTag: 6ef2c8316faf179a16d747195f907c4a3cae6f0b
