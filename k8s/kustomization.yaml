# Fleet이 이 폴더를 kustomize로 렌더링해서 배포
# newTag는 GitHub Actions가 이미지 빌드 후 커밋 sha로 자동 갱신함 (.github/scripts/bump-tag.sh). 손으로 바꾸면 그 이미지로 롤백
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - trip-web.yaml
  - trip-api.yaml
images:
  - name: ghcr.io/oes52/trip-web
    newTag: 9af5beff8012bad991ea6a3c93b5db1c21ad8bde
  - name: ghcr.io/oes52/trip-api
    newTag: 67626dca9522a08ead77d43f8ed4c48501c0ed52
