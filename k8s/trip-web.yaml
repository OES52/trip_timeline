# 여행 타임라인 정적 페이지 (nginx-unprivileged, 8080)
# 배포는 Fleet이 담당 (fleet-local/trip-timeline GitRepo가 이 k8s/ 폴더를 감시)
# 이미지 태그는 kustomization.yaml의 newTag로 관리 → GitHub Actions가 빌드 후 커밋 sha로 바꿔서 커밋
---
apiVersion: v1
kind: Namespace
metadata:
  name: trip
  # istio 사이드카 안 붙임 (정적 파일이라 필요 없고, 노드 CPU 아낌). Gateway API 라우팅은 사이드카 없이도 됨
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-web
  namespace: trip
  labels:
    app: trip-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: trip-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: trip-web
    spec:
      # GHCR 패키지가 비공개면 아래 주석 해제 + ghcr-pull 시크릿 만들기 (아래 참고)
      # imagePullSecrets:
      #   - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/oes52/trip-web   # 태그는 kustomization.yaml
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx-unprivileged가 pid·임시 파일을 /tmp에 씀 (루트 파일시스템은 읽기 전용)
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trip-web
  namespace: trip
  labels:
    app: trip-web
spec:
  selector:
    app: trip-web
  ports:
    - name: http
      port: 80
      targetPort: http
