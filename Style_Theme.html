<!--Style_Theme.html-->
<style>
  /* ───────── 테마: 일본 역·열차 (App_Theme) ─────────
   *  --city: 그날 도시 색 (body·날짜 탭·승차권에 App_Theme가 넣음) */
  :root { --city: var(--ink); --led-font: "DotGothic16", "Galmuri11", ui-monospace, monospace; --kp-paper: #fbf6ea; --kp-ink: #4a3b22; }

  /* 시각 숫자: 전광판 글꼴 */
  .ttime .a, .tst .t, .tsun .sun-t, .tnow .tn-t span { font-family: var(--led-font); letter-spacing: 0; font-weight: 400; }
  .ttime .a { font-size: 20px; }

  /* 날짜 탭: 선택된 날은 그날 도시 색 밑줄 */
  .day[aria-selected="true"]::after { background: var(--city, var(--ink)); }
  .tabbar button[aria-current="page"] { color: var(--city, var(--ink)) !important; }

  /* ── 1. 카드 사진: 위쪽 넓은 띠 / 없거나 실패하면 종류 그림 ── */
  .tcard .photo, .tcard .photo-fb {
    float: none; display: block; width: calc(100% + 28px); height: 136px; margin: -12px -14px 10px; max-width: none;
    border-radius: 0; object-fit: cover; background: var(--panel-2);
  }
  .tcard .photo-fb { display: grid; place-items: center; color: color-mix(in srgb, var(--t, var(--muted)) 70%, transparent);
    background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--t, var(--muted)) 8%, var(--panel)) 0 10px, color-mix(in srgb, var(--t, var(--muted)) 4%, var(--panel)) 10px 20px); }
  .tcard { position: relative; }
  .tcard .emblem { position: absolute; top: 10px; right: 12px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
    color: var(--t, var(--muted)); background: color-mix(in srgb, var(--t, var(--muted)) 10%, var(--panel)); }
  .tcard .emblem + .top, .tcard .emblem ~ h3 { padding-right: 40px; }
  .photo-fb { display: inline-grid; place-items: center; color: var(--muted); background: var(--panel-2); }
  .pin-photo .photo-fb { width: 100%; height: 100%; border-radius: inherit; }

  /* ── 2. 교통 장소: 역 이름판 ── */
  .ekimei { margin: 6px 0 2px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--panel); text-align: center; }
  .ekimei .ek-name { padding: 8px 10px 6px; }
  .ekimei h3 { margin: 0; font-size: 21px; letter-spacing: .04em; }
  .ekimei .ek-sub { display: block; font-size: 11px; color: var(--muted); letter-spacing: .08em; margin-top: 1px; }
  .ekimei .ek-bar { display: flex; justify-content: space-between; gap: 8px; padding: 3px 8px; font-size: 11px; font-weight: 700; color: #fff;
    background: var(--lc); min-height: 18px; }
  .ekimei .ek-bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%; }

  /* ── 3. 이동 구간 선: 도보는 둥근 점, 차는 굵게, 수동은 짧은 대시 ── */
  .tmove .rail2::after { width: 5px; right: -9.5px; }
  .tmove.mode-walk .rail2::after { background: radial-gradient(circle, var(--c) 2.4px, transparent 2.6px) center top / 5px 9px repeat-y; }
  .tmove.mode-car .rail2::after { width: 6px; right: -10px; }
  .tmove.mode-manual .rail2::after { background: repeating-linear-gradient(to bottom, var(--c) 0 3px, transparent 3px 7px); }
  .tmove .rail2::before { content: ""; position: absolute; right: -12px; top: 50%; width: 11px; height: 11px; margin-top: -6px; border-radius: 50%;
    background: var(--panel); border: 3px solid var(--c); box-sizing: border-box; z-index: 1; }
  .tmove.tmove-split .rail2::before { display: none; }

  /* ── 4. 지금 선 (今) · 지난 일정 흐리게 ── */
  .tnow { display: grid; grid-template-columns: 58px 1fr; gap: 0 12px; align-items: center; margin: 6px 0; position: relative; }
  .tnow .tn-t { display: flex; justify-content: flex-end; align-items: center; gap: 4px; color: var(--late); font-size: 13px; }
  .tnow .tn-t b { font-size: 11px; color: #fff; background: var(--late); border-radius: 3px; padding: 0 4px; line-height: 16px; }
  .tnow .tn-l { height: 2px; background: var(--late); position: relative; border-radius: 1px; box-shadow: 0 0 6px color-mix(in srgb, var(--late) 50%, transparent); }
  .tnow .tn-l::before { content: ""; position: absolute; left: -6px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--late);
    animation: tnPulse 2s ease-out infinite; }
  @keyframes tnPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--late) 55%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
  .titem.past:not(.is-now) .tcard { opacity: .62; }
  .titem.past .ttime { opacity: .55; }
  .tmove.past { opacity: .55; }

  /* ── 5. 날짜 머리: 승차권 ── */
  .kippu { position: relative; margin: 26px 0 14px; padding: 10px 16px 12px; color: var(--kp-ink); background: var(--kp-paper);
    border-radius: 10px; box-shadow: var(--shadow-1); overflow: hidden;
    background-image: repeating-linear-gradient(-45deg, rgba(120, 90, 40, .035) 0 2px, transparent 2px 6px); }
  .kippu:first-child { margin-top: 0; }
  /* 양옆 펀칭 구멍 */
  .kippu::before, .kippu::after { content: ""; position: absolute; top: 46px; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); }
  .kippu::before { left: -8px; } .kippu::after { right: -8px; }
  .kippu .kp-top { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: .12em; opacity: .75;
    border-bottom: 1px dashed color-mix(in srgb, var(--kp-ink) 35%, transparent); padding-bottom: 6px; margin: 0 4px 8px; }
  .kippu .kp-no { font-family: var(--led-font); }
  .kippu .kp-main { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 0 4px; }
  .kippu .tl-day { margin: 0; font-size: 22px; color: var(--kp-ink); }
  .kippu .kp-route { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; }
  .kippu .kp-route span { color: var(--cc); }
  .kippu .kp-route i { font-style: normal; opacity: .45; font-weight: 400; }
  .kippu .kp-body { margin: 6px 4px 0; font-size: 13px; }
  .kippu .kp-body > * { margin-left: 0 !important; margin-right: 0; }
  .kippu .kp-body .progress { margin: 4px 0 0; }
  .kippu::selection { background: transparent; }
  .kippu { border-top: 5px solid var(--city); }
  .kippu .kp-stamp { position: absolute; right: 14px; top: 26px; width: 52px; height: 52px; display: grid; place-items: center;
    font-size: 26px; font-weight: 700; color: #c4302b; border: 3px double #c4302b; border-radius: 50%; transform: rotate(-14deg); opacity: .75; pointer-events: none;
    mix-blend-mode: multiply; text-shadow: .5px .5px 0 rgba(196, 48, 43, .35); }
  /* 済 도장 안쪽 테두리: 살짝 다른 각도로 한 겹 더 (손으로 찍은 느낌) */
  .kippu .kp-stamp::after { content: ""; position: absolute; inset: 5px; border: 1px solid currentColor; border-radius: 50%; transform: rotate(9deg); opacity: .55; }
  /* 개찰구 검표 홈: 지난 날·오늘 승차권 윗변에 작은 홈 */
  .kippu .kp-punch { position: absolute; top: -5px; left: 92px; width: 10px; height: 9px; background: var(--paper);
    clip-path: polygon(0 0, 100% 0, 100% 55%, 50% 100%, 0 55%); pointer-events: none; }
  .kippu .kp-today { position: absolute; right: 14px; top: 30px; font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #fff;
    background: var(--city); border-radius: 4px; padding: 2px 7px; }

  /* ── 7. 홈: 탑승권 (여행 전) · 여행 중 전광판 크게 ── */
  .bpass { display: grid; grid-template-columns: 1fr 104px; margin-top: 14px; border-radius: 14px; overflow: hidden; box-shadow: var(--shadow-1);
    background: var(--panel); border: 1px solid var(--rule); }
  .bpass .bp-main { padding: 14px 16px; border-right: 2px dashed var(--rule); position: relative; }
  .bpass .bp-label { font-size: 11px; font-weight: 700; letter-spacing: .14em; color: var(--city); }
  .bpass .bp-route { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 8px 0 10px; color: var(--muted); }
  .bpass .bp-route b { display: block; font-size: 22px; color: var(--ink); letter-spacing: -.01em; }
  .bpass .bp-route div:last-child { text-align: right; }
  .bpass small { display: block; font-size: 10px; font-weight: 700; letter-spacing: .12em; color: var(--muted); }
  .bpass .bp-grid { display: grid; grid-template-columns: repeat(4, auto); justify-content: space-between; gap: 6px 10px; }
  .bpass .bp-grid b { font-size: 13px; }
  .bpass .bp-stub { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 12px 8px; color: #fff; background: var(--city); }
  .bpass .bp-stub small { color: rgba(255, 255, 255, .8); }
  .bpass .bp-stub b { font-family: var(--led-font); font-size: 26px; font-weight: 400; }
  .bpass .bp-bar { width: 70px; height: 26px; margin-top: 6px; opacity: .85;
    background: repeating-linear-gradient(90deg, #fff 0 2px, transparent 2px 4px, #fff 4px 5px, transparent 5px 8px, #fff 8px 11px, transparent 11px 12px); }
  @media (max-width: 420px) { .bpass .bp-grid { grid-template-columns: repeat(2, auto); } .bpass { grid-template-columns: 1fr 88px; } }
  body.trip-live .brow { font-size: 19px; padding: 9px 0; }
  body.trip-live #homeBody > .hcard:first-child { border-top: 4px solid var(--city); }

  /* ── 9. 다크 모드 ── */
  @media (prefers-color-scheme: dark) {
    :root { --kp-paper: #262019; --kp-ink: #eadbc0; }
    /* 지도: 밝은 OSM을 뒤집어 어두운 지도로 (핀·경로는 그대로) */
    .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.92) contrast(.86) saturate(.65); }
    .tcard .photo { filter: brightness(.85); }
    .kippu { background-image: repeating-linear-gradient(-45deg, rgba(255, 220, 160, .03) 0 2px, transparent 2px 6px); }
    .kippu .kp-stamp { color: #ff6b5f; border-color: #ff6b5f; mix-blend-mode: screen; }
    /* 어두운 노선색(JR 남색 등)이 바탕에 묻히지 않게 테두리 */
    .steps .ln, .ekimei .ek-bar { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
    .ekimei { background: var(--panel-2); }
    .bpass .bp-main { border-right-color: var(--rule); }
    .tcard .emblem { background: color-mix(in srgb, var(--t, var(--muted)) 18%, var(--panel)); }
  }
  @media (prefers-reduced-motion: reduce) { .tnow .tn-l::before { animation: none; } }
  /* 해 진 뒤 일정: 시각을 밤하늘 남색 + 위에 작은 달 */
  .titem.night:not(.is-now) .ttime .a { color: #4b4fb8; }
  .titem.night .ttime { position: relative; }
  .titem.night .ttime::before { content: "☾"; position: absolute; right: 0; top: 0; font-size: 11px; line-height: 1; color: #d99a2b; }   /* 시각 칸 위 여백에 (줄 안 밀리게) */
  @media (prefers-color-scheme: dark) { .titem.night:not(.is-now) .ttime .a { color: #a9adff; } .titem.night .ttime::before { color: #ffc95c; } }

  /* ───────── 개조 2차 ───────── */
  /* 글자 크기 4단계 · 간격 4/8/12/16/24 */
  :root { --fs-s: 12px; --fs-m: 14px; --fs-l: 17px; --fs-xl: 22px; }
  .tcard { padding: 12px 16px; }
  .tcard .photo, .tcard .photo-fb { width: calc(100% + 32px); margin: -12px -16px 12px; }
  .tcard .top, .tcard .facts, .tsum, .tmove .mv-time, .kippu .kp-top, .chip, .steps .ln, .steps .wk, .approx, .slack, .ekimei .ek-sub, .ekimei .ek-bar { font-size: var(--fs-s); }
  .tcard .act, .tcard .note, .tmove .mv, .steps li, .kippu .kp-body, .hcard p, .callout, .taxi-box, .warn span { font-size: var(--fs-m); }
  .tcard h3, .hcard h2 { font-size: var(--fs-l); }
  .kippu .tl-day, .ekimei h3, .bpass .bp-route b { font-size: var(--fs-xl); }
  .tcard .facts { gap: 4px 12px; margin-top: 8px; }
  .tcard .note { margin-top: 8px; }

  /* 탭 묶음: 헤더에서 타임라인·도감 버튼 숨김, 아래 전환줄 */
  #viewTl, #viewGuide { display: none !important; }
  .subnav { display: none; padding: 8px 0 2px; }
  .subnav .sn-group { display: none; padding: 2px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--rule); }
  body[data-view="plan"] .subnav, body[data-view="tl"] .subnav, body[data-view="area"] .subnav, body[data-view="guide"] .subnav { display: flex; }
  body[data-view="plan"] .subnav [data-g="sched"], body[data-view="tl"] .subnav [data-g="sched"],
  body[data-view="area"] .subnav [data-g="place"], body[data-view="guide"] .subnav [data-g="place"] { display: inline-flex; }
  .subnav button { font: inherit; font-size: var(--fs-s); font-weight: 500; min-width: 84px; padding: 6px 12px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; }
  .subnav button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-1); }
  body[data-view="area"] header, body[data-view="guide"] header { padding-bottom: 8px; }
  body.hdr-min .subnav { padding-top: 4px; }

  /* 색 역할: 장소 종류 색은 빼고(아이콘만), 강조는 도시 색, 상태는 빨강·초록 */
  .tcard { border-left: 1px solid var(--rule); }
  .titem.is-now .tcard { box-shadow: 0 0 0 2px var(--city), var(--shadow-1); }
  .tcard .badge { color: var(--muted); background: none; border: 1px solid var(--rule); }
  .tcard .emblem { color: var(--muted); background: var(--panel-2); }
  .tcard .photo-fb { color: var(--muted); background: repeating-linear-gradient(135deg, var(--panel-2) 0 10px, var(--panel) 10px 20px); }

  /* 카드 접기: 평소엔 한 줄 요약, 누르면 전체 */
  .tsum { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--muted); cursor: pointer; }
  .tsum .tfold { margin-left: auto; width: 8px; height: 8px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .18s var(--ease); }
  .tcard.open .tsum .tfold { transform: rotate(-135deg); }
  .tcard:not(.open) .facts, .tcard:not(.open) .chips, .tcard:not(.open) .note:not(.memo), .tcard:not(.open) .slack.ok { display: none; }
  .tcard:not(.open) .note.memo { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tcard.open .tsum { margin-bottom: -2px; }
  .tcard { cursor: pointer; }
  .tcard.no-fold { cursor: default; }
  .tcard img.photo { cursor: zoom-in; }
  .tcard input, .tcard button, .tcard a { cursor: auto; }
  .tcard button, .tcard a { cursor: pointer; }

  /* 카드 버튼: 큰 버튼 하나 + 길찾기 + ⋯ (최소 40px) */
  .tcard .actions { gap: 8px; align-items: stretch; }
  /* 도착 버튼: 지금·다음 카드만 채움, 나머지는 테두리만 (빨간 덩어리가 줄줄이 보이지 않게) */
  .tcard .actions .pri { min-width: 96px; min-height: 40px; font: inherit; font-size: var(--fs-m); font-weight: 700; border-radius: 10px; cursor: pointer;
    color: var(--city, var(--ink)); background: var(--panel); border: 1.5px solid color-mix(in srgb, var(--city, var(--ink)) 55%, transparent); padding: 0 16px; }
  .titem.is-now .tcard .actions .pri:not(.has) { color: #fff; background: var(--city, var(--ink)); border-color: transparent; }
  .tcard .actions .more-btn { margin-left: auto; }
  .tcard .actions .pri.has { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .tcard .actions .nav-btn.sm { min-height: 40px; display: inline-flex; align-items: center; font-size: var(--fs-m); padding: 0 12px; margin: 0; border-radius: 10px; }
  .tcard .actions .more-btn { min-width: 44px; min-height: 40px; font: inherit; font-size: 18px; font-weight: 700; line-height: 1; border-radius: 10px; cursor: pointer;
    color: var(--ink); background: var(--panel); border: 1px solid var(--rule); }
  body.guest .tcard .actions .pri { display: none; }

  /* 알림 상자 3종: 정보(회색)·주의(빨강)·좋음(초록) */
  .callout, .slack, .warn span, .taxi-box { display: block; border-radius: 8px; padding: 6px 10px; border-left: 3px solid; line-height: 1.5; font-weight: 500; }
  .slack { display: inline-block; font-weight: 700; padding: 2px 8px; }
  .slack.ok, .callout.good { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, var(--panel)); border-left-color: var(--ok); }
  .slack.late, .warn span, .callout.warn { color: var(--late); background: color-mix(in srgb, var(--late) 9%, var(--panel)); border-left-color: var(--late); }
  .warn span { font-weight: 700; }
  .taxi-box, .callout.info { color: var(--ink); background: var(--panel-2); border-left-color: var(--muted); }
  .taxi-box.on { box-shadow: none; border-left-color: var(--car); }
  .callout { margin-top: 6px; font-weight: 700; }
  .pass-chip { background: var(--ok); }
  .pass-chip.some { color: var(--late); background: color-mix(in srgb, var(--late) 10%, var(--panel)); }

  /* 지도 화면(폰): 지도는 꽉 차게, 목록은 아래 시트 */
  .list-grip { display: none; }
  @media (max-width: 800px) {
    main { display: block; position: relative; }
    main #map { position: absolute; inset: 0; min-height: 0; }
    main #list { position: absolute; left: 0; right: 0; bottom: 0; height: var(--sheet-h, 50%); z-index: 450; border-top: 0;
      border-radius: 16px 16px 0 0; box-shadow: 0 -6px 22px rgba(0, 0, 0, .14); padding-top: 22px; transition: height .25s var(--ease); }
    main.sheet-drag #list { transition: none; }
    .list-grip { display: block; position: absolute; left: 0; right: 0; bottom: calc(var(--sheet-h, 50%) - 22px); height: 26px; z-index: 460;
      cursor: grab; touch-action: none; transition: bottom .25s var(--ease); }
    main.sheet-drag .list-grip { transition: none; }
    .list-grip span { display: block; width: 40px; height: 5px; margin: 9px auto 0; border-radius: 3px; background: var(--rule); }
    body.list-folded .list-grip { display: none; }
  }

  /* 야외 모드: 흐린 글씨·선 진하게 */
  body.outdoor { --muted: #39424e; --rule: #9aa5b1; }
  body.outdoor .tcard, body.outdoor .hcard { border-width: 1.5px; }
  body.outdoor .tcard h3, body.outdoor .ttime .a { color: #000; }
  @media (prefers-color-scheme: dark) {
    body.outdoor { --muted: #d0d7e0; --rule: #5b6775; }
    body.outdoor .tcard h3, body.outdoor .ttime .a { color: #fff; }
  }

  /* 체크 칸 + 글자 */
  .chk { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-m); cursor: pointer; }
  .chk input { flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }

  /* ───────── 검수 2차 ───────── */
  /* 택시: 한 줄 요약, 누르면 펼침 */
  details.taxi-box { padding: 0; margin-top: 8px; }
  details.taxi-box > summary { list-style: none; cursor: pointer; padding: 6px 10px; font-size: var(--fs-s); color: var(--muted); display: flex; align-items: center; gap: 4px; }
  details.taxi-box > summary::-webkit-details-marker { display: none; }
  details.taxi-box > summary::after { content: ""; margin-left: auto; width: 6px; height: 6px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform .18s var(--ease); }
  details.taxi-box[open] > summary::after { transform: rotate(-135deg); }
  details.taxi-box > summary b { color: var(--ink); }
  details.taxi-box.on > summary b:first-child { color: var(--car); }
  details.taxi-box .taxi-more { padding: 0 10px 8px; font-size: var(--fs-s); }

  /* 구간 경로 링크: 작은 아이콘 */
  .tmove a.seg-map { display: inline-flex; align-items: center; gap: 3px; margin-top: 6px; font-size: var(--fs-s); color: var(--muted); text-decoration: none;
    border: 1px solid var(--rule); border-radius: 6px; padding: 1px 7px; }
  .tmove a.seg-map:hover { color: var(--ink); }
