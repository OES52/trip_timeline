<!--App_Area.html-->
<style>
  /* ───────── 장소 가이드 (도시 → 구역 → 장소) ───────── */
  #area { flex: 1; min-height: 0; overflow-y: auto; }
  body:not([data-view="area"]) #area { display: none; }
  .area-inner { max-width: 960px; margin: 0 auto; padding: 18px 14px 60px; }

  /* 도시 탭 */
  .area-cities { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .area-cities .filter { display: inline-flex; align-items: baseline; gap: 5px; padding: 5px 14px; font-weight: 500; }
  .area-cities .filter small { font-size: 11px; opacity: .6; }

  /* 구역 카드 */
  .area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .acard {
    position: relative; display: flex; flex-direction: column; overflow: hidden; padding: 0; cursor: pointer;
    text-align: left; font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); border-radius: 16px; box-shadow: var(--shadow-1);
    transition: transform .18s var(--ease), box-shadow .18s var(--ease);
  }
  .acard:hover { transform: translateY(-3px); box-shadow: var(--shadow-2); }
  .acard:focus-visible { outline: 2px solid var(--transit); outline-offset: 2px; }

  /* 사진 모자이크: 1장 꽉 / 2장 반반 / 3장 큰 거 1 + 작은 거 2. 사진 없으면 종류 색 그라데이션 */
  .hero { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--panel-2); }
  .mosaic { position: absolute; inset: 0; display: grid; gap: 2px; background: var(--panel); }
  .mosaic img { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: cover; display: block; }
  .mosaic.n2 { grid-template-columns: 1fr 1fr; }
  .mosaic.n3 { grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
  .mosaic.n3 img:first-child { grid-row: span 2; }
  .mosaic.none { place-items: center;
    background: linear-gradient(135deg, color-mix(in srgb, var(--t) 70%, #1d2633), color-mix(in srgb, var(--t) 30%, #1d2633)); }
  .mosaic.none span { font-size: 72px; font-weight: 700; color: rgba(255, 255, 255, .22); }
  .acard:hover .mosaic img { transform: scale(1.03); }
  .mosaic img { transition: transform .4s var(--ease); }
  .hero .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,.72)); }
  .hero .ttl { position: absolute; left: 14px; right: 14px; bottom: 11px; color: #fff; }
  .hero .ttl b { display: block; font-size: 20px; letter-spacing: -0.02em; line-height: 1.2; text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .hero .ttl small { display: block; font-size: 12px; opacity: .92; margin-top: 2px; }
  .acard .in { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 10px 14px 12px; min-height: 44px; }
  .type-dot { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .type-dot i { width: 8px; height: 8px; border-radius: 50%; background: var(--t); }
  .day-chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .day-chip { font-size: 11px; font-weight: 700; color: #fff; border-radius: 10px; padding: 1px 8px; line-height: 17px; }
  .acard .in .day-chips { margin-left: auto; }

  /* 구역 페이지 머리 (큰 모자이크 + 제목) */
  .area-banner { position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow-1); margin-bottom: 6px; }
  .area-banner .hero { aspect-ratio: 21 / 9; max-height: 280px; width: 100%; }
  .area-banner .ttl b { font-size: 28px; }
  .area-banner .back {
    position: absolute; top: 12px; left: 12px; z-index: 2; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer;
    color: #fff; background: rgba(0, 0, 0, .45); border: 1px solid rgba(255, 255, 255, .35); border-radius: 18px; padding: 5px 12px;
    backdrop-filter: blur(4px);
  }
  .area-banner .ttl .day-chips { margin-top: 6px; }
  .area-sum { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }

  /* 구역 안 장소 */
  .area-sec h3 { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); font-weight: 700; letter-spacing: .06em; margin: 24px 2px 10px; }
  .area-sec h3 i { width: 8px; height: 8px; border-radius: 50%; background: var(--t); }
  .area-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .aplace {
    display: grid; grid-template-columns: 76px 1fr; gap: 12px; text-align: left; font: inherit; color: var(--ink);
    background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 10px; cursor: pointer;
    box-shadow: var(--shadow-1); position: relative; overflow: hidden; transition: box-shadow .18s var(--ease), transform .18s var(--ease);
  }
  .aplace::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--t); }
  .aplace:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); }
  .aplace .ph { width: 76px; height: 76px; border-radius: 10px; object-fit: cover; display: grid; place-items: center;
    font-size: 26px; font-weight: 700; color: var(--t); background: color-mix(in srgb, var(--t) 14%, var(--panel)); }
  .aplace .nm { font-size: 15px; font-weight: 700; line-height: 1.35; }
  .aplace .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .aplace .intro { font-size: 13px; margin-top: 4px; line-height: 1.45; }
  .aplace .chips { margin-top: 5px; }
  .aplace .warn { margin-top: 5px; }
  .aplace .nav-btn.sm { margin-top: 6px; }
  .tag-plan { display: inline-block; font-size: 11px; font-weight: 700; color: #fff; border-radius: 8px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; line-height: 17px; }
  .tag-rec { display: inline-block; font-size: 11px; font-weight: 700; color: var(--ok); border: 1px solid var(--ok); border-radius: 8px; padding: 0 7px; margin-left: 6px; vertical-align: 2px; line-height: 15px; }
  .tag-done { color: var(--ok); font-size: 12px; font-weight: 700; margin-left: 4px; }
  @media (max-width: 640px) {
    .area-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .hero .ttl b { font-size: 16px; }
    .acard .in { padding: 8px 10px 10px; }
    .acard .in .day-chips { margin-left: 0; }
    .area-banner .hero { aspect-ratio: 16 / 10; }
    .area-banner .ttl b { font-size: 22px; }
    .area-list { grid-template-columns: 1fr; }
  }
</style>
<script>
  /* ───────── 장소 가이드: 도시 → 구역 카드 → 구역 안 장소 목록 ───────── */
  // 일정에 나오는 장소 = "일정" 표시 (언제 가는지), 일정 밖이지만 구역이 있는 장소 = "추천"

  let areaCity = null;   // 고른 도시
  let areaSel = null;    // 고른 구역 (도시|구역)

  function guidePlaces() { return (DATA && (DATA.allPlaces || DATA.places)) || []; }
  function cityOf(p) { return p.city || '기타'; }
  function areaOf(p) { return p.area || '기타'; }

  // 장소별 일정 첫 등장 순번 (도시·구역·장소 정렬용)
  function firstSeen() {
    const first = {};
    sortedPoints().forEach((p, i) => { if (p.placeKey && first[p.placeKey] == null) first[p.placeKey] = i; });
    return first;
  }

  function renderAreaGuide() {
    const box = document.getElementById('areaInner');
    if (!DATA) return;
    const all = guidePlaces();
    if (!all.length) {
      box.innerHTML = '<p class="empty"><strong>가이드에 보여줄 장소가 없음.</strong><br>시트 장소 탭에 도시·구역을 채우고 새로고침.</p>';
      return;
    }
    const first = firstSeen();

    // 도시: 일정에 먼저 나오는 순, 일정에 없는 도시는 뒤로
    const cityRank = {};
    all.forEach(p => {
      const c = cityOf(p), f = first[p.key] != null ? first[p.key] : 1e9;
      if (!(c in cityRank) || f < cityRank[c]) cityRank[c] = f;
    });
    const cities = Object.keys(cityRank).sort((a, b) => (cityRank[a] - cityRank[b]) || a.localeCompare(b));
    if (!areaCity || !cities.includes(areaCity)) {
      // 오늘(여행 중) 있는 도시 → 아니면 첫 도시
      const nt = tokyoNow();
      const tp = sortedPoints().find(p => p.date === nt.date && p.placeKey);
      const tpl = tp && all.find(x => x.key === tp.placeKey);
      areaCity = tpl ? cityOf(tpl) : cities[0];
    }

    if (areaSel) {
      const [c, a] = areaSel.split('|');
      const list = all.filter(p => cityOf(p) === c && areaOf(p) === a);
      if (list.length) { renderAreaPage(box, c, a, list, first); return; }
      areaSel = null;
    }

    // 고른 도시의 구역 카드
    const inCity = all.filter(p => cityOf(p) === areaCity);
    const byArea = {};
    inCity.forEach(p => { (byArea[areaOf(p)] = byArea[areaOf(p)] || []).push(p); });
    const areaRank = a => Math.min.apply(null, byArea[a].map(p => first[p.key] != null ? first[p.key] : 1e9));
    const areas = Object.keys(byArea).sort((a, b) => (areaRank(a) - areaRank(b)) || a.localeCompare(b));

    let html = '<div class="area-cities">' + cities.map(c =>
      '<button class="filter" type="button" data-city="' + esc(c) + '" aria-pressed="' + (c === areaCity) + '">' + esc(c) +
      '<small>' + all.filter(p => cityOf(p) === c).length + '</small></button>').join('') + '</div>';
    html += '<div class="area-grid">' + areas.map(a => {
      const list = byArea[a].slice().sort((x, y) => placeRank(x, first) - placeRank(y, first));
      const plan = list.filter(p => first[p.key] != null).length;
      const rec = list.length - plan;
      const dates = areaDates(list);
      return '<button class="acard" type="button" data-area="' + esc(areaCity + '|' + a) + '">' +
        '<div class="hero">' + mosaic(list, a) + '<div class="shade"></div>' +
          '<div class="ttl"><b>' + esc(a) + '</b><small>' + list.length + '곳' + (plan ? ' · 일정 ' + plan : '') + (rec ? ' · 추천 ' + rec : '') + '</small></div>' +
        '</div>' +
        '<div class="in">' + typeDots(list) +
          (dates.length ? '<span class="day-chips">' + dates.map(dayChip).join('') + '</span>' : '') +
        '</div></button>';
    }).join('') + '</div>';
    box.innerHTML = html;

    box.querySelectorAll('[data-city]').forEach(b => b.addEventListener('click', () => { areaCity = b.dataset.city; areaSel = null; renderAreaGuide(); }));
    box.querySelectorAll('[data-area]').forEach(b => b.addEventListener('click', () => {
      areaSel = b.dataset.area;
      renderAreaGuide();
      document.getElementById('area').scrollTop = 0;
    }));
  }

  // 일정 장소 먼저(일정 순), 추천은 뒤(이름순)
  function placeRank(p, first) { return first[p.key] != null ? first[p.key] : 1e6; }

  // 구역에 들르는 날짜들
  function areaDates(list) {
    const keys = new Set(list.map(p => p.key));
    return Array.from(new Set(sortedPoints().filter(p => keys.has(p.placeKey)).map(p => p.date)));
  }

  function dayChip(d) {
    return '<span class="day-chip" style="background:' + dayCity(d).color + '">' + Number(d.slice(5, 7)) + '/' + Number(d.slice(8, 10)) + '</span>';
  }

  // 사진 모자이크 (사진 있는 장소 앞에서부터 최대 3장). 사진이 없으면 첫 장소 종류 색 그라데이션 + 구역 첫 글자
  function mosaic(list, name) {
    const ph = list.filter(p => p.photos && p.photos.length).map(p => p.photos[0]).slice(0, 3);
    if (!ph.length) {
      const t = (list[0] && list[0].type) || '기타';
      return '<div class="mosaic none t-' + esc(t) + '"><span>' + esc(Array.from(name || '')[0] || '') + '</span></div>';
    }
    return '<div class="mosaic n' + ph.length + '">' + ph.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy">').join('') + '</div>';
  }

  // 종류별 개수 점 (식당 2 · 카페 1 …)
  function typeDots(list) {
    const cnt = {};
    list.forEach(p => { cnt[p.type] = (cnt[p.type] || 0) + 1; });
    return PLACE_TYPES.filter(t => cnt[t]).map(t => '<span class="type-dot t-' + esc(t) + '"><i></i>' + esc(t) + ' ' + cnt[t] + '</span>').join('');
  }

  function renderAreaPage(box, city, area, list, first) {
    const dates = areaDates(list);
    const plan = list.filter(p => first[p.key] != null).length;
    const sorted = list.slice().sort((x, y) => placeRank(x, first) - placeRank(y, first));
    let html = '<div class="area-banner"><button class="back" type="button" id="areaBack">← ' + esc(city) + '</button>' +
      '<div class="hero">' + mosaic(sorted, area) + '<div class="shade"></div>' +
        '<div class="ttl"><b>' + esc(area) + '</b><small>' + esc(city) + ' · ' + list.length + '곳 · 일정 ' + plan + ' · 추천 ' + (list.length - plan) + '</small>' +
        (dates.length ? '<span class="day-chips">' + dates.map(dayChip).join('') + '</span>' : '') + '</div>' +
      '</div></div>' +
      (dates.length ? '<p class="area-sum">' + dates.map(d => dayLabel(d)).join(', ') + '에 들름</p>' : '');

    PLACE_TYPES.forEach(t => {
      const items = list.filter(p => p.type === t).sort((a, b) => (placeRank(a, first) - placeRank(b, first)) || dn(a).localeCompare(dn(b)));
      if (!items.length) return;
      html += '<div class="area-sec"><h3 class="t-' + esc(t) + '"><i></i>' + esc(t) + ' ' + items.length + '</h3>' +
        '<div class="area-list">' + items.map(p => areaPlaceHtml(p, first, dates)).join('') + '</div></div>';
    });
    box.innerHTML = html;
    document.getElementById('areaBack').addEventListener('click', () => { areaSel = null; renderAreaGuide(); });
    box.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', e => {
      if (e.target.closest('a')) return;   // 길찾기 버튼은 그대로
      openAreaPlace(b.dataset.open);
    }));
  }

  function areaPlaceHtml(p, first, dates) {
    const ap = appearances(p.key);
    const seen = visitedFor(p.key).length > 0;
    const photo = p.photos && p.photos.length ? '<img class="ph" src="' + esc(p.photos[0]) + '" alt="" loading="lazy">'
      : '<span class="ph">' + esc(Array.from(dn(p))[0] || '') + '</span>';
    const tag = ap.length
      ? '<span class="tag-plan" style="background:' + dayCity(ap[0].date).color + '">' + esc(dayLabel(ap[0].date) + ' ' + (ap[0].arrive || '')) + '</span>'
      : '<span class="tag-rec">추천</span>';
    const meta = [costText(p), p.hours, p.closed ? '휴무 ' + p.closed : ''].filter(Boolean).join(' · ');
    // 추천 장소: 이 구역에 들르는 날 휴무면 경고
    const off = ap.length ? [] : dates.filter(d => closedOn(p.closed, d)).map(d => dayLabel(d) + ' 휴무');
    return '<div class="aplace t-' + esc(p.type) + '" role="button" tabindex="0" data-open="' + esc(p.key) + '">' + photo +
      '<div><div class="nm">' + esc(dn(p)) + tag + (seen ? '<span class="tag-done">✓</span>' : '') + '</div>' +
      (p.alias ? '<div class="meta" style="margin-top:0">' + esc(p.name) + '</div>' : '') +
      (meta ? '<div class="meta">' + esc(meta) + '</div>' : '') +
      (p.menu.length ? '<div class="chips">' + p.menu.slice(0, 3).map(m => '<span class="chip">' + esc(m) + '</span>').join('') + '</div>' : '') +
      (p.intro ? '<div class="intro">' + esc(p.intro) + '</div>' : '') +
      (off.length ? '<div class="warn">' + off.map(x => '<span>' + esc(x) + '</span>').join('') + '</div>' : '') +
      navBtn(p.lat, p.lng, true) +
      '</div></div>';
  }

  // 장소 상세: 일정 장소는 도감 페이지 패널, 추천 장소는 간단 패널
  function openAreaPlace(key) {
    if ((DATA.places || []).some(x => x.key === key)) { openDetail(key); return; }
    const p = guidePlaces().find(x => x.key === key);
    if (!p) return;
    const info = [['도시', p.city], ['구역', p.area], ['비용', costText(p)], ['영업시간', p.hours], ['휴무', p.closed], ['메모', p.memo]].filter(r => r[1]);
    const near = p.lat == null ? [] : (DATA.places || []).filter(x => x.lat != null)
      .map(x => ({ x: x, d: haversine([p.lat, p.lng], [x.lat, x.lng]) })).filter(n => n.d <= 1500)
      .sort((a, b) => a.d - b.d).slice(0, 4);
    const box = document.getElementById('detail');
    box.className = 'detail t-' + p.type;
    box.innerHTML = '<button class="close" type="button" id="closeDetail">닫기</button>' +
      '<div class="t-' + esc(p.type) + '">' +
      '<div class="pp-head" style="padding-right:0;min-height:0">' +
        '<div class="pp-meta"><span class="badge">' + esc(p.type) + '</span><span class="tag-rec" style="margin:0">추천</span></div>' +
        '<h2>' + esc(dn(p)) + '</h2>' +
        (p.alias ? '<div style="font-size:13px;color:var(--muted);margin:-2px 0 6px">' + esc(p.name) + '</div>' : '') +
      '</div>' +
      '<div class="pp-media">' + (p.photos && p.photos.length
        ? '<div class="gallery">' + p.photos.map(u => '<img src="' + esc(u) + '" alt="" loading="lazy">').join('') + '</div>'
        : '<div class="ph"><span>' + esc(Array.from(dn(p))[0] || '') + '</span></div>') + '</div>' +
      (p.intro ? '<div class="pp-sec pp-intro">' + esc(p.intro) + '</div>' : '') +
      (p.menu.length ? '<div class="pp-sec"><h3>메뉴</h3><div class="chips">' + p.menu.map(m => '<span class="chip">' + esc(m) + '</span>').join('') + '</div></div>' : '') +
      (info.length ? '<div class="pp-sec"><h3>정보</h3><dl class="pp-info">' + info.map(r => '<dt>' + r[0] + '</dt><dd>' + esc(r[1]) + '</dd>').join('') + '</dl></div>' : '') +
      (near.length ? '<div class="pp-sec"><h3>근처 일정 장소</h3><div class="near">' + near.map(n =>
        '<button type="button" data-near="' + esc(n.x.key) + '">' + esc(dn(n.x)) + '<small>' + fmtDist(n.d) + '</small></button>').join('') + '</div></div>' : '') +
      '<div class="links">' + navBtn(p.lat, p.lng) +
        (p.link ? '<a href="' + esc(p.link) + '" target="_blank" rel="noopener">구글 지도</a>' : '') +
        (p.web ? '<a href="' + esc(p.web) + '" target="_blank" rel="noopener">웹사이트</a>' : '') +
      '</div></div>';
    box.querySelectorAll('[data-near]').forEach(b => b.addEventListener('click', () => openDetail(b.dataset.near)));
    document.getElementById('detailWrap').classList.add('open');
    document.getElementById('closeDetail').addEventListener('click', closeDetail);
    document.getElementById('closeDetail').focus();
  }
</script>
