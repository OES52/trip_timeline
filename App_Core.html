<style>
  /* 택시 비교 상자 (지도 리스트·타임라인 이동 구간) */
  .taxi-box { margin-top: 6px; padding: 6px 10px; border-radius: 8px; font-size: 12px; line-height: 1.55; color: var(--ink);
    background: color-mix(in srgb, var(--car) 10%, var(--panel)); }
  .taxi-box.on { box-shadow: inset 0 0 0 2px var(--car); }
  .taxi-box b { color: var(--car); }
  .taxi-box .muted { color: var(--muted); }
  .taxi-pick { display: inline-flex; align-items: center; gap: 5px; margin-top: 4px; font-weight: 700; cursor: pointer; }
  .taxi-pick input { width: 16px; height: 16px; accent-color: var(--car); }
  /* 주유패스 표시 */
  .pass-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; line-height: 18px;
    padding: 0 8px; border-radius: 9px; color: #fff; background: #13945f; white-space: nowrap; vertical-align: 1px; }
  .pass-chip.some { color: #9a5b00; background: #fff1cc; }
  .pass-chip s { opacity: .75; font-weight: 500; }
  /* 단계별: 이 노선은 패스(QR)로 / IC카드로 */
  .step-pass, .step-card { display: inline-block; font-size: 11px; font-weight: 700; line-height: 17px; padding: 0 7px;
    border-radius: 9px; white-space: nowrap; vertical-align: 1px; }
  .step-pass { color: #fff; background: #13945f; }
  .step-card { color: var(--car); background: color-mix(in srgb, var(--car) 14%, var(--panel)); }
  /* 장소 사진 갤러리 (도감 페이지·상세 패널): 자르지 않고 원래 비율로.
     높이를 맞추고 가로는 비율대로, 화면보다 넓은 사진은 여백(contain). 여러 장이면 옆으로 넘김 */
  .gallery { align-items: center; }
  .gallery img, .pp-media .gallery img, .detail .gallery img {
    flex: 0 0 auto; width: auto; max-width: 100%; height: clamp(200px, 42vh, 400px); max-height: none;
    object-fit: contain; background: var(--panel-2); border-radius: 10px; margin: 0; cursor: zoom-in;
  }
  .gallery img:only-child { margin: 0 auto; }
  /* 사진 크게 보기 */
  .photo-view { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; cursor: zoom-out;
    background: rgba(0, 0, 0, .88); animation: pvIn .15s ease; }
  .photo-view img { max-width: 96vw; max-height: 88vh; object-fit: contain; border-radius: 8px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .photo-view .pv-count { position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    color: #fff; font-size: 13px; background: rgba(0, 0, 0, .55); border-radius: 10px; padding: 2px 10px; }
  @keyframes pvIn { from { opacity: 0; } to { opacity: 1; } }
  /* 일본어 병기 */
  .ja { color: var(--muted); font-size: .92em; font-weight: 500; }
</style>
<script>
  const MODE_CLASS = { '대중교통': 'transit', '도보': 'walk', '차': 'car', '수동': 'manual' };
  const MODE_COLOR = { transit: '#2b62d9', walk: '#13945f', car: '#e2731b', manual: '#8b93a1' };
  // 전체 탭에서 날짜마다 쓰는 색 (10일까지 안 겹치게)
  const DAY_COLORS = ['#e5484d', '#f76b15', '#c99a06', '#30a46c', '#0d9488', '#0090ff', '#3e63dd', '#8e4ec6', '#d6409f', '#6b7280'];
  const dayColor = date => DAY_COLORS[Math.max(0, DATA.dates.indexOf(date)) % DAY_COLORS.length];
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const WON = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW', maximumFractionDigits: 0 });
  const YEN = n => '¥' + Math.round(n).toLocaleString('en-US');

  let DATA = null;
  let selected = null;
  let guideFilter = '전체';
  let guideDay = '전체';
  let guideArea = '전체';
  let guideSel = null;
  let guideQuery = '';
  let spoiler = false;
  let scrolledToNow = false;
  let tlScrolled = false;
  let tlSwiper = null, tlLastDate = null, passSwiper = null, passIdx = 0;
  let tlScale = (() => { try { return localStorage.getItem('trip-tl-scale') !== '0'; } catch (e) { return true; } })();
  const TL_PX_PER_MIN = 2;
  // 시간 비례 높이: 60분까지는 분당 2px, 그 뒤로는 완만하게 (긴 체류·긴 이동이 화면을 다 먹지 않게) + 상한
  function tlPx(min, cap) {
    const m = Math.max(0, Number(min) || 0);
    const px = m <= 60 ? m * TL_PX_PER_MIN : 60 * TL_PX_PER_MIN + (m - 60) * 0.6;
    return Math.round(Math.min(cap, px));
  }

  // 주유패스 표시: 전부 패스 노선이면 초록 "주유패스 사용 · 원래 요금", 일부만이면 노랑
  function passChip(s) {
    if (!s || !s.pass) return '';
    if (s.pass === '주유패스') {
      return '<span class="pass-chip">🎫 주유패스 사용' + (s.passFare > 0 ? ' <s>¥' + Math.round(s.passFare).toLocaleString('en-US') + '</s>' : '') + '</span>';
    }
    return '<span class="pass-chip some">🎫 일부만 주유패스 · 요금 확인</span>';
  }
  // 오사카 메트로 등 노선 색
  const LINE_COLORS = [
    // 도쿄: JR
    [/야마노테|山手|Yamanote/i, '#80c241'], [/게이힌.?도호쿠|京浜東北|Keihin/i, '#00b2e5'],
    [/주오.?소부|中央・総武|中央総武|Chuo-Sobu/i, '#ffd400'], [/소부|総武|Sobu/i, '#ffd400'],
    [/주오.*쾌속|中央線快速|中央本線|Chuo Rapid|JR.*주오|JR.*中央/i, '#f15a22'],
    [/사이쿄|埼京|Saikyo/i, '#00ac9a'], [/쇼난.?신주쿠|湘南新宿|Shonan/i, '#e21f26'],
    [/도카이도|東海道|Tokaido/i, '#f68b1e'], [/요코스카|横須賀|Yokosuka/i, '#1069b4'],
    [/게이요|京葉|Keiyo/i, '#c9252f'], [/신칸센|新幹線|Shinkansen/i, '#1d6fb8'],
    // 도쿄 메트로
    [/긴자|銀座|Ginza/i, '#ff9500'], [/마루노우치|丸ノ内|Marunouchi/i, '#f62e36'], [/히비야|日比谷|Hibiya/i, '#a3a39c'],
    [/도자이|東西|Tozai/i, '#009bbf'], [/지요다|치요다|千代田|Chiyoda/i, '#00bb85'], [/유라쿠초|有楽町|Yurakucho/i, '#c1a470'],
    [/한조몬|半蔵門|Hanzomon/i, '#8f76d6'], [/난보쿠|南北|Namboku/i, '#00ac9b'], [/후쿠토신|副都心|Fukutoshin/i, '#9c5e31'],
    // 도에이·사철·기타
    [/아사쿠사|浅草|Asakusa/i, '#e85298'], [/미타|三田|Mita/i, '#0079c2'], [/오에도|大江戸|Oedo/i, '#b6007a'],
    [/도에이.*신주쿠|都営新宿|Shinjuku Line/i, '#6cbb5a'], [/유리카모메|ゆりかもめ|Yurikamome/i, '#1eb5b0'],
    [/린카이|りんかい|Rinkai/i, '#00418e'], [/미나토미라이|みなとみらい|Minatomirai/i, '#09357f'],
    [/도큐|東急|Tokyu/i, '#da0442'], [/게이큐|京急|Keikyu/i, '#e5171f'], [/오다큐|小田急|Odakyu/i, '#2288cc'],
    [/게이오|京王|Keio/i, '#dd0077'], [/세이부|西武|Seibu/i, '#0079c2'], [/도부|東武|Tobu/i, '#0f6cc3'], [/게이세이|京成|Keisei/i, '#0a2c7a'],
    // 오사카·간사이
    [/미도스지|御堂筋|Midosuji/i, '#e5171f'], [/다니마치|谷町|Tanimachi/i, '#522886'],
    [/요쓰바시|요츠바시|四つ橋|Yotsubashi/i, '#0078ba'], [/주오선|中央線|Chuo/i, '#019a66'],
    [/센니치마에|千日前|Sennichimae/i, '#e44d93'], [/사카이스지|堺筋|Sakaisuji/i, '#814721'],
    [/나가호리|長堀|Nagahori/i, '#a9cc51'], [/이마자토스지|今里筋|Imazatosuji/i, '#ee7b1a'],
    [/한큐|阪急|Hankyu/i, '#6b1b23'], [/게이한|京阪|Keihan/i, '#0d5b9a'],
    [/긴테쓰|긴테츠|近鉄|Kintetsu/i, '#d7003a'], [/난카이|南海|Nankai/i, '#ff6a13'],
    [/한신|阪神|Hanshin/i, '#00559f'], [/JR|사가노|나라선|순환선|교토선/i, '#1d2633'],
  ];
  const PLACE_TYPES = ['숙소', '식당', '카페', '관광지', '쇼핑', '교통', '기타'];
  const markers = {};   // key: date#order
  const overLines = {};   // 날짜 넘는 구간 선. key: date#from#+to
  const lines = {};     // key: date#from#to
  const casings = {};   // 같은 키, 흰 테두리 선
  const groups = {};    // 흐리게 처리용: 'S:날짜#순서'(장소) / 'L:날짜#출발#도착'(구간) → 지도에 그린 것들
  let hlKey = null;     // 지금 강조 중인 구간
  let pickKey = null;   // 지금 강조 중인 장소 (날짜#순서)
  const DIM_NOW = 0.1;  // 지금 모드에서 지금이 아닌 것 (투명도 90%)
  const DIM_PICK = 0.15; // 장소·구간 눌렀을 때 나머지
  let nowMode = (() => { try { return localStorage.getItem('trip-now-mode') === '1'; } catch (e) { return false; } })();
  let nowTimer = null, lastNowSig = '';

  // 택시로 가기 구간이면 "택시", 아니면 원래 수단 이름
  function segModeName(s) { return s.taxi && s.taxi.on ? '택시' : s.mode; }

  // 택시 비교 상자: 택시 시간·대중교통 대비·요금 범위·1인 요금 + "택시로 가기" 체크 (일정 수정 권한자만)
  function taxiBox(s) {
    const t = s.taxi;
    if (!t) return '';
    const yen = n => '¥' + Math.round(n).toLocaleString('en-US');
    const range = (a, b) => a === b ? yen(a) : yen(a) + '~' + yen(b).slice(1);
    // 비교 문구: "대중교통 37분보다 23분 빠름" (택시 시간과 단축 시간이 붙어 보이지 않게 따로)
    let diff = '';
    if (t.transitMin != null && t.saved != null) {
      const base = (t.on ? '대중교통이었으면 ' : '대중교통 ') + t.transitMin + '분';
      diff = t.saved > 0 ? ' · ' + base + (t.on ? ' → ' : '보다 ') + '<b>' + t.saved + '분 ' + (t.on ? '단축' : '빠름') + '</b>'
        : t.saved < 0 ? ' · <span class="muted">' + base + '보다 ' + (-t.saved) + '분 느림</span>'
        : ' · <span class="muted">' + base + '이랑 비슷</span>';
    }
    const vk = s.date + '#' + s.fromOrder;
    const ctl = canEdit()
      ? '<label class="taxi-pick"><input type="checkbox" data-taxi="' + vk + '"' + (t.on ? ' checked' : '') + '> 택시로 가기</label>'
      : (t.on ? '<div><b>택시로 가기로 함</b></div>' : '');
    // 한 줄 요약(접힘) → 누르면 비교·요금·"택시로 가기"
    const short = t.saved != null && t.saved > 0 ? ' · ' + t.saved + '분 ' + (t.on ? '단축' : '빠름') : '';
    return '<details class="taxi-box' + (t.on ? ' on' : '') + '"><summary>' +
      modeIcon('car') + ' ' + (t.on ? '<b>택시로 감</b> · ' : '택시 ') + '<b>' + t.min + '분</b> · ' + (t.people > 1 ? '1인 ' + range(t.perLow, t.perHigh) : range(t.low, t.high)) + short +
      '</summary><div class="taxi-more">' +
      '택시 <b>' + t.min + '분</b>' + diff +
      '<br>' + range(t.low, t.high) + (t.people > 1 ? ' · 1인 <b>' + range(t.perLow, t.perHigh) + '</b>' : '') +
      ' <span class="muted">[' + esc(t.area) + ' 요금' + (t.night ? '·심야' : '') + ', 어림]</span>' +
      (ctl ? '<br>' + ctl : '') + '</div></details>';
  }

  // "택시로 가기" 체크 → 시트 일정 바꾸고 경로 다시 계산 (되돌리기 가능)
  function bindTaxi(root) {
    root.querySelectorAll('[data-taxi]').forEach(cb => {
      cb.addEventListener('click', e => e.stopPropagation());   // 구간 강조 클릭과 안 겹치게
      cb.addEventListener('change', () => {
        const vk = cb.dataset.taxi, on = cb.checked;
        editPlan(vk, 'taxi', on ? 1 : 0, on ? '택시로 바꿈' : '원래 이동수단으로 되돌림',
          () => editPlan(vk, 'taxi', on ? 0 : 1, '되돌림'));
      });
    });
  }

  // 이날 도보 거리·시간 (서버가 경로 시트로 계산)
  function walkLine(date) {
    const w = DATA && DATA.walk && DATA.walk[date];
    if (!w || !w.m) return '';
    const km = w.m / 1000;
    return '<p class="fare-sum">' + modeIcon('walk') + ' 이날 도보 약 <b>' + km.toFixed(1) + 'km</b>' + (w.min ? ' · ' + w.min + '분' : '') +
      (DATA.walkWarnKm && km >= DATA.walkWarnKm ? ' <span style="color:var(--late);font-weight:700">많음</span>' : '') + '</p>';
  }

  // 갤러리 사진 누르면 크게 보기. 여러 장이면 사진 누를 때마다 다음 장, 바깥·Esc로 닫기
  function openPhoto(img) {
    const imgs = Array.from(img.closest('.gallery').querySelectorAll('img')).map(x => x.getAttribute('src'));
    let i = Math.max(0, imgs.indexOf(img.getAttribute('src')));
    const ov = document.createElement('div');
    ov.className = 'photo-view';
    const show = () => {
      ov.innerHTML = '<img src="' + esc(imgs[i]) + '" alt="">' +
        (imgs.length > 1 ? '<span class="pv-count">' + (i + 1) + ' / ' + imgs.length + ' · 사진 누르면 다음</span>' : '');
    };
    const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
    const onKey = e => {
      if (e.key === 'Escape') close();
      if (imgs.length > 1 && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { i = (i + (e.key === 'ArrowRight' ? 1 : imgs.length - 1)) % imgs.length; show(); }
    };
    ov.addEventListener('click', e => {
      if (imgs.length > 1 && e.target.tagName === 'IMG') { i = (i + 1) % imgs.length; show(); }
      else close();
    });
    document.addEventListener('keydown', onKey);
    show();
    document.body.appendChild(ov);
  }
  document.addEventListener('click', e => {
    const img = e.target.closest && e.target.closest('.gallery img');
    if (img) openPhoto(img);
  });

  // 시작점과 다른 종착점이 있는지
  function hasEnd(p) {
    return !!p && p.lat != null && p.endLat != null && p.endLng != null && (p.endLat !== p.lat || p.endLng !== p.lng);
  }

  // 구글 지도 길찾기: 출발지를 비우면 구글 지도가 "내 위치"에서 출발로 잡음
  function navUrl(lat, lng, mode) {
    return 'https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '&travelmode=' + (mode || 'transit');
  }
  function navBtn(lat, lng, small) {
    if (lat == null || lng == null) return '';
    return '<a class="nav-btn' + (small ? ' sm' : '') + '" href="' + navUrl(lat, lng) + '" target="_blank" rel="noopener">' +
      '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg>' +
      '여기로 길찾기</a>';
  }

  const map = L.map('map', { zoomControl: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  map.setView([34.69, 135.5], 11);
  // 흰 테두리 전용 층: 색 선(overlayPane, z 400)보다 항상 아래라서 다른 구간 색을 덮지 않음
  map.createPane('casing');
  map.getPane('casing').style.zIndex = 395;
  map.getPane('casing').style.pointerEvents = 'none';
  const layer = L.layerGroup().addTo(map);
  // 도보 거리 라벨: 확대했을 때만 (멀리서 보면 글자가 겹쳐서)
  const walkLayer = L.layerGroup();
  const WALK_LABEL_ZOOM = 14;
  function updateWalkLabels() {
    if (map.getZoom() >= WALK_LABEL_ZOOM) { if (!map.hasLayer(walkLayer)) map.addLayer(walkLayer); }
    else if (map.hasLayer(walkLayer)) map.removeLayer(walkLayer);
  }
  map.on('zoomend', updateWalkLabels);

  // 선 길이(m)와 길이 기준 가운데 지점
  function lineInfo(latlngs) {
    let total = 0;
    const cum = [0];
    for (let i = 1; i < latlngs.length; i++) { total += haversine(latlngs[i - 1], latlngs[i]); cum.push(total); }
    const half = total / 2;
    let k = 1;
    while (k < cum.length - 1 && cum[k] < half) k++;
    const seg = (cum[k] - cum[k - 1]) || 1, t = (half - cum[k - 1]) / seg;
    const a = latlngs[k - 1], b = latlngs[k] || a;
    return { total: total, mid: [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t] };
  }

  // 내 위치: 브라우저가 위치 권한을 막으면 안내만
  let meMarker = null, meCircle = null, watchId = null;
  const LocateControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const wrap = L.DomUtil.create('div', 'leaflet-bar');
      const btn = L.DomUtil.create('button', 'locate-btn', wrap);
      btn.type = 'button';
      btn.title = '내 위치';
      btn.setAttribute('aria-label', '내 위치');
      btn.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>';
      L.DomEvent.disableClickPropagation(wrap);
      L.DomEvent.on(btn, 'click', () => locateMe());
      return wrap;
    }
  });
  map.addControl(new LocateControl());

  // 지금 모드 버튼: 켜면 지금 시각의 장소·구간만 진하게, 나머지는 투명도 90%
  let nowBtn = null;
  const NowControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const wrap = L.DomUtil.create('div', 'leaflet-bar');
      nowBtn = L.DomUtil.create('button', 'now-btn', wrap);
      nowBtn.type = 'button';
      nowBtn.title = '지금 모드';
      nowBtn.setAttribute('aria-label', '지금 모드');
      nowBtn.setAttribute('aria-pressed', String(nowMode));

  function locateMe(opts) {
    const noPan = !!(opts && opts.noPan);
    if (!navigator.geolocation) { setStatus('이 브라우저는 위치 기능을 지원하지 않음', true); return; }
    if (watchId != null) {  // 한 번 더 누르면 내 위치로 이동만
      if (meMarker && !noPan) map.setView(meMarker.getLatLng(), Math.max(map.getZoom(), 16));
      return;
    }
    setStatus('위치 확인 중…');
    let first = !noPan, cleared = false;
    watchId = navigator.geolocation.watchPosition(pos => {
      const ll = [pos.coords.latitude, pos.coords.longitude];
      if (!meMarker) {
        meMarker = L.marker(ll, { icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), zIndexOffset: 1000 }).addTo(map);
        meCircle = L.circle(ll, { radius: pos.coords.accuracy, color: '#2b7bff', weight: 1, fillOpacity: .08 }).addTo(map);
      } else {
        meMarker.setLatLng(ll);

      }
      if (first) { map.setView(ll, Math.max(map.getZoom(), 16)); first = false; }
      if (!cleared) { setStatus(''); cleared = true; }
    }, err => {
      watchId = null;
      setStatus(err.code === 1

  const CACHE_KEY = 'trip-timeline-cache-v1';
  const USER_KEY = 'trip-user-v1';
  const USER_COLORS = { OES: '#2b62d9', KanoC: '#d9480f', Keiz: '#13945f', Rinne: '#8a3ffc', Guest: '#5d6b7d' };
  /* ── 서버 호출 ── */
  // Apps Script 웹앱 안에서는 google.script.run 그대로, 외부 정적 페이지에서는 Apps Script API로 fetch
  //  정적 페이지는 index.html에서 window.TRIP_API_URL = 'https://script.google.com/macros/s/.../exec' 지정
  //  쓰는 법은 google.script.run과 같음: RUN().withSuccessHandler(f).withFailureHandler(g).setSpend(...)
  const API_URL = (typeof window !== 'undefined' && window.TRIP_API_URL) || '';
  function RUN() {
    if (!API_URL && typeof google !== 'undefined' && google.script && google.script.run) return google.script.run;
    let ok = () => {}, fail = () => {};
    const runner = new Proxy({}, {
      get(_, name) {
        if (name === 'withSuccessHandler') return f => { ok = f || ok; return runner; };
        if (name === 'withFailureHandler') return f => { fail = f || fail; return runner; };
        if (name === 'withUserObject') return () => runner;
        return (...args) => { apiCall(String(name), args).then(r => ok(r), e => fail(e)); };
      }
    });
    return runner;
  }
  // POST {fn, args} → {ok, result} / {ok:false, error}
  //  API_URL이 /api 처럼 상대 경로면 홈랩 프록시: 데이터는 GET /api/data (프록시 캐시), 나머지는 POST /api/call
  async function apiCall(fn, args) {
    if (!API_URL) throw new Error('API 주소가 없음 (TRIP_API_URL)');
    const proxy = API_URL.charAt(0) === '/';
    let res;
    try {
      if (proxy && fn === 'getMapData') {
        res = await fetch(API_URL + '/data', { cache: 'no-cache' });
      } else {
        res = await fetch(proxy ? API_URL + '/call' : API_URL, {
          method: 'POST',
          headers: { 'Content-Type': proxy ? 'application/json' : 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn: fn, args: args }),
          redirect: 'follow',
        });
      }
    } catch (e) {
      throw Object.assign(new Error('연결 안 됨'), { status: 0 });
    }
    // status: 0 연결 안 됨 / 5xx 서버 쪽 / 4xx 요청 문제 (오프라인 대기열이 다시 보낼지 판단)
    let j = null;
    try { j = await res.json(); } catch (e) { j = null; }
    if (!j) throw Object.assign(new Error(res.ok ? '서버 응답을 못 읽음' : '서버 오류 ' + res.status), { status: res.ok ? 502 : res.status });
    if (!j.ok) throw Object.assign(new Error(j.error || '서버 오류 ' + res.status), { status: res.status });
    return j.result;
  }

  // 설정 시트 사용자 (서버가 페이지 열 때 Index.html에 BOOT_USERS로 심어줌). 사용자 추가·수정은 설정 시트에서만
  const DEFAULT_USERS = (typeof BOOT_USERS !== 'undefined' && Array.isArray(BOOT_USERS)) ? BOOT_USERS : [];
  let RAW = null, USER = null;

  function users() { return (RAW && RAW.users && RAW.users.length) ? RAW.users : DEFAULT_USERS; }
  function userColor(id) { return USER_COLORS[id] || '#5d6b7d'; }
  function canStamp() { return !!(USER && USER.canStamp); }
  function canEdit() { return !!(USER && USER.canEdit); }

  // 사용자 범위 날짜만 남긴 화면용 데이터
  function viewFor(raw, u) {
    const inR = d => !u || (d >= u.from && d <= u.to);
    const points = raw.points.filter(p => inR(p.date));
    const keys = new Set(points.map(p => p.placeKey).filter(Boolean));
    // 날짜 넘는 구간(밤버스 등) 분리: 서버가 overnight로 주거나, 예전 서버면 segments에 "13→1"처럼 거꾸로 섞여 옴
    const dl = raw.dates.slice().sort();
    const over = (raw.overnight || []).slice();
    const segs = [];
    raw.segments.forEach(s => {
      if (s.toOrder > s.fromOrder) { segs.push(s); return; }
      const toDate = dl[dl.indexOf(s.date) + 1];
      if (toDate && !over.some(o => o.date === s.date && o.fromOrder === s.fromOrder)) over.push(Object.assign({}, s, { toDate: toDate }));
    });
    return Object.assign({}, raw, {
      dates: raw.dates.filter(inR),
      points: points,
      segments: segs.filter(s => inR(s.date)),
      overnight: over.filter(s => inR(s.date) && inR(s.toDate)),
      places: (raw.places || []).filter(p => keys.has(p.key)),   // 도감·여권: 일정에 나오는 장소만
      allPlaces: raw.places || [],                                // 가이드: 일정 밖 추천 장소까지
      visited: u && raw.visitedBy ? (raw.visitedBy[u.id] || {}) : {},
      arrived: u && raw.arrivedBy ? (raw.arrivedBy[u.id] || {}) : {},
    });
  }

  function getPin(id) { try { return localStorage.getItem('trip-pin-' + (id || (USER && USER.id))) || ''; } catch (e) { return ''; } }

  // 서버가 PIN 틀렸다고 하면 저장된 PIN 지우고 다시 고르게

  function finishChoose(id) {

  function setStatus(msg, err) {
    const el = document.getElementById('status');

  // 서버가 뺀 구간 전체 선을 단계 선 이어 붙여 복원 (지도·리플레이·결산이 그대로 s.polyline을 씀)
  function restorePolylines(data) {
    (data.segments || []).forEach(s => {
      if (s.polyline || !s.fromSteps || !Array.isArray(s.steps)) return;
      const pts = [];
      s.steps.forEach(st => { if (st.poly) decodePolyline(st.poly).forEach(p => pts.push(p)); });
      if (pts.length > 1) { s.polyline = encodePolyline(pts); s._rebuilt = true; }
    });
  }

  // [[lat, lng], ...] → 구글 인코딩 polyline
  function encodePolyline(pts) {
    const enc = v => {
      v = v < 0 ? ~(v << 1) : (v << 1);
      let s = '';
      while (v >= 0x20) { s += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
      return s + String.fromCharCode(v + 63);
    };
    let out = '', pLat = 0, pLng = 0;
    pts.forEach(p => {
      const a = Math.round(p[0] * 1e5), b = Math.round(p[1] * 1e5);
      out += enc(a - pLat) + enc(b - pLng);
      pLat = a; pLng = b;
    });
    return out;
  }

  function applyData(data, keepView) {
    restorePolylines(data);
    RAW = data;
    const boot = document.getElementById('boot');
    if (boot && !boot.classList.contains('hide')) { boot.classList.add('hide'); setTimeout(() => boot.remove(), 400); }
    if (!USER) {
      let id = null;
      try { id = localStorage.getItem(USER_KEY); } catch (e) { id = null; }
      USER = users().find(u => u.id === id) || null;
    } else {
      USER = users().find(u => u.id === USER.id) || null;   // 설정 바뀐 경우 반영
    }
    DATA = viewFor(data, USER);
    // 아직 서버에 안 보낸 도장은 화면에 그대로 유지
    if (USER && Object.keys(visitQueue).length) {
      DATA.visited = Object.assign({}, DATA.visited);
      Object.keys(visitQueue).forEach(k => { if (visitQueue[k]) DATA.visited[k] = 1; else delete DATA.visited[k]; });
    }
    document.body.classList.toggle('guest', !canStamp());
    document.body.classList.toggle('noedit', !canEdit());
    updateWhoChip();
    if (!selected || (selected !== 'all' && !DATA.dates.includes(selected))) {
      selected = DATA.dates.includes(data.today) ? data.today : (DATA.dates[0] || 'all');
    }
    renderTabs();
    if (currentView === 'plan') render();
    if (!USER && !keepView) { setView('who'); return; }
    renderCurrent();
  }

  function saveCache(data) {
    try {
      const savedAt = new Intl.DateTimeFormat('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date());
      // 단계 선으로 복원한 전체 선은 빼고 저장 (다시 열 때 또 복원). 폰 저장 공간 절약
      const json = JSON.stringify({ savedAt: savedAt, data: data }, function (k, v) {
        return k === 'polyline' && this && this._rebuilt ? '' : v;
      });
      cacheSavedAt = savedAt;
      // 홈랩 정적 페이지는 IndexedDB(TRIP_STORE, 용량 넉넉), Apps Script 웹앱은 localStorage
      if (window.TRIP_STORE) { window.TRIP_STORE.set(CACHE_KEY, json); return; }
      localStorage.setItem(CACHE_KEY, json);
    } catch (e) { /* 저장 공간 없으면 무시 */ }
  }

  let cacheSavedAt = null;
  function load() {
    // 처음 열 때 IndexedDB에서 꺼내는 건 비동기라 꺼낸 뒤 이어서
    if (window.TRIP_STORE && !DATA && !load.fromStore) {
      load.fromStore = true;
      window.TRIP_STORE.get(CACHE_KEY).then(raw => load_(raw), () => load_(null));
      return;
    }
    let raw = null;
    if (!window.TRIP_STORE) { try { raw = localStorage.getItem(CACHE_KEY); } catch (e) { raw = null; } }
    load_(raw);
  }

  function load_(raw) {
    // 1. 폰에 저장된 마지막 데이터부터 바로 표시
    let cached = null;
    try { cached = JSON.parse(raw || 'null'); } catch (e) { cached = null; }
    if (cached && cached.savedAt) cacheSavedAt = cached.savedAt;
    if (cached && cached.data && !DATA) {
      applyData(cached.data);
      setStatus('저장된 데이터 표시 중 (' + cached.savedAt + '). 최신 데이터 받는 중…');
    } else if (!DATA) {
      document.getElementById('list').innerHTML = '<div class="skeleton"><div></div><div></div><div></div><div></div></div>';
      mountLotties(document.getElementById('boot'));
    }
    document.getElementById('reload').classList.add('spin');

    // 2. 서버에서 최신 데이터
    RUN()
      .withSuccessHandler(data => {
        document.getElementById('reload').classList.remove('spin');
        applyData(data);
        setStatus('');
        saveCache(data);
      })
      .withFailureHandler(err => {
        document.getElementById('reload').classList.remove('spin');
        if (DATA) {
          setStatus('연결 안 됨. 저장된 데이터로 보는 중' + (cacheSavedAt ? ' (' + cacheSavedAt + ')' : ''), true);
        } else {
          document.getElementById('list').innerHTML =
            '<p class="empty"><strong>데이터를 못 불러옴.</strong><br>' + esc(err.message || String(err)) + '</p>';
        }
      })
      .getMapData();
  }

  function renderTabs() {
    const nav = document.getElementById('days');
    const sub = document.getElementById('subtitle');
    if (DATA.dates.length) {
      const a = DATA.dates[0], b = DATA.dates[DATA.dates.length - 1];
      sub.textContent = dayLabel(a) + (a !== b ? ' – ' + dayLabel(b) : '') + ', ' + DATA.dates.length + '일';
    }
    const items = DATA.dates.map(d => ({ id: d, label: dayLabel(d) + wxShort(d) }));
    if (items.length > 1) items.push({ id: 'all', label: '전체' });
    nav.innerHTML = items.map(it =>
      '<button class="day" role="tab" type="button" data-id="' + it.id + '" aria-selected="' + (it.id === selected) + '">' + it.label + '</button>'
    ).join('');
    nav.querySelectorAll('.day').forEach(btn => btn.addEventListener('click', () => {
      selected = btn.dataset.id;
      nav.querySelectorAll('.day').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
      tlScrolled = false;
      stopReplay();
      refresh();
    }));
  }

  let lastFitKey = '';
  // 지도·리스트 그리다 오류 나면 조용히 멈추지 않고 화면에 표시
  function render() {
    try {
      renderMap_();
    } catch (e) {
      console.error(e);
      document.getElementById('list').innerHTML = errorBox('지도 리스트를 그리다 오류', e);
    }
  }

  function errorBox(title, e) {
    const stack = String(e && e.stack || '').split('\n').slice(0, 3).join('\n');
    return '<div class="empty"><strong>' + esc(title) + '</strong><br>' + esc(e && e.message || e) +
      '<pre style="white-space:pre-wrap;font-size:11px;color:var(--muted);margin-top:8px">' + esc(stack) + '</pre>' +
      '<span style="font-size:12px">이 화면 캡처해서 보내주면 바로 고칠 수 있음</span></div>';
  }

  // 어떤 화면이든 처리 안 된 오류는 위쪽 상태 줄에 표시
  window.addEventListener('error', ev => {
    setStatus('화면 오류: ' + (ev.message || '') + (ev.lineno ? ' (' + ev.lineno + '줄)' : ''), true);
  });

  function renderMap_() {
    layer.clearLayers();
    walkLayer.clearLayers();
    Object.keys(markers).forEach(k => delete markers[k]);
    Object.keys(overLines).forEach(k => delete overLines[k]);
    Object.keys(lines).forEach(k => delete lines[k]);
    Object.keys(casings).forEach(k => delete casings[k]);
    Object.keys(groups).forEach(k => delete groups[k]);
    Object.keys(stepLayers).forEach(k => delete stepLayers[k]);
    stepKey = null;
    hlKey = null;
    pickKey = null;

    const list = document.getElementById('list');
    if (!DATA.points.length) {
      list.innerHTML = '<p class="empty"><strong>표시할 일정이 없음.</strong><br>시트의 "일정"에 장소를 넣고 여행 도구 → 경로 계산을 실행한 뒤 새로고침.</p>';
      return;
    }

    const dates = selected === 'all' ? DATA.dates : [selected];
    const bounds = [];
    let html = '';
    if (selected === 'all') html += spendBlock(DATA.points, '여행 전체') + fareBlock(DATA.points, '여행 전체');

    dates.forEach(date => {
      const dayIdx = DATA.dates.indexOf(date);
      const pinColor = selected === 'all' ? dayColor(date) : '#1d2633';
      const pts = DATA.points.filter(p => p.date === date).sort((a, b) => a.order - b.order);
      const segs = DATA.segments.filter(s => s.date === date);

      // 지도: 구간 선
      segs.forEach(s => {
        const cls = MODE_CLASS[s.mode] || 'manual';
        const from = pts.find(p => p.order === s.fromOrder);
        const to = pts.find(p => p.order === s.toOrder);
        let latlngs = s.polyline ? decodePolyline(s.polyline) : [];
        let far = false;
        if (!latlngs.length && from && to && from.lat != null && to.lat != null) {
          // 경로 모양이 없으면 직선 대신 곡선 (비행기 구간은 크게 휘고 ✈ 표시)
          latlngs = arcPoints([from.lat, from.lng], [to.lat, to.lng]);
          far = haversine([from.lat, from.lng], [to.lat, to.lng]) > 300000;
        }
        if (!latlngs.length) return;
        const lkey = date + '#' + s.fromOrder + '#' + s.toOrder;
        const gk = 'L:' + lkey;
        if (far) {
          const mid = latlngs[Math.floor(latlngs.length / 2)];
          reg(gk, L.marker(mid, { icon: L.divIcon({ className: '', html: '<div class="plane"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>', iconSize: [24, 24], iconAnchor: [12, 12] }), interactive: false }).addTo(layer));
        }
        const w = cls === 'transit' ? 6 : 5;
        // 흰 테두리: 같은 선을 조금 굵은 흰색으로 먼저 깔아서 지도 위에서 잘 보이게
        casings[lkey] = reg(gk, L.polyline(latlngs, { pane: 'casing', color: '#ffffff', weight: w + 4, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(layer));
        // 도보 구간: 가운데에 거리·시간 라벨
        if (cls === 'walk' && latlngs.length > 1) {
          const info = lineInfo(latlngs);
          reg(gk, L.marker(info.mid, {
            icon: L.divIcon({ className: '', html: '<span class="walk-label">' + fmtDist(info.total) + ' · ' + s.minutes + '분</span>', iconSize: null }),
            interactive: false, keyboard: false,
          }).addTo(walkLayer));
        }
        const line = L.polyline(latlngs, {
          color: selected === 'all' ? dayColor(date) : MODE_COLOR[cls],   // 전체 탭은 날짜 색, 하루 탭은 수단 색
          weight: w,
          lineJoin: 'round',
          opacity: 0.9,
          dashArray: (cls === 'walk' || cls === 'manual') ? '6 9' : null,
          lineCap: 'round'
        }).bindPopup(
          '<b>' + esc(s.mode) + ' ' + s.minutes + '분</b><br>' + esc(s.dep) + ' → ' + esc(s.arr) +
          (s.summary ? '<br>' + esc(s.summary) : '') +
          (s.warn ? '<br><b style="color:var(--late)">⚠ ' + esc(s.warn) + '</b>' : '')
        ).addTo(layer);
        line._baseW = w;
        lines[lkey] = reg(gk, line);
        // 하루 탭 + 단계 정보 있으면: 도보는 초록 점선, 탑승은 노선 색으로 끊어서 그림. 아래 전체 선은 투명하게 (클릭만 받음)
        if (selected !== 'all' && Array.isArray(s.steps) && s.steps.some(x => x.poly)) {
          line._baseOp = 0.01;
          line.setStyle({ opacity: line._baseOp });
          drawSteps(s.steps, gk);
        }
        // 지도에서 선을 눌러도 그 구간만 강조 + 리스트에서 그 구간 표시
        line.on('click', ev => {
          L.DomEvent.stopPropagation(ev);
          highlightLeg(lkey);
          const el = document.querySelector('.leg[data-key="' + lkey + '"]');
          if (el) { clearActive(); el.classList.add('active'); el.scrollIntoView({ block: 'nearest' }); }
        });
        latlngs.forEach(ll => bounds.push(ll));
      });

      // 지도: 날짜를 넘는 구간 (밤버스 등)
      //  전체 탭: 이날 색 점선, 화면 맞춤에 포함
      //  하루 탭: 회색 점선으로 떠나는 날·도착하는 날 둘 다 그리되 화면 맞춤엔 안 넣음 (지도는 그날 장소 위주, 선은 화면 밖으로 이어짐)
      (DATA.overnight || []).filter(s => s.date === date || (selected !== 'all' && s.toDate === date)).forEach(s => {
        const from = DATA.points.find(p => p.date === s.date && p.order === s.fromOrder);
        const to = DATA.points.find(p => p.date === s.toDate && p.order === s.toOrder);
        if (!from || !to || from.lat == null || to.lat == null) return;
        const all = selected === 'all';
        const out = s.date === date;   // 이날 떠나는 구간인지 (아니면 전날에서 들어오는 구간)
        const fromLL = hasEnd(from) ? [from.endLat, from.endLng] : [from.lat, from.lng];
        const latlngs = s.polyline ? decodePolyline(s.polyline) : arcPoints(fromLL, [to.lat, to.lng]);
        if (latlngs.length < 2) return;
        const okey = s.date + '#' + s.fromOrder + '#+' + s.toOrder;
        const gk = 'O:' + okey;
        const color = all ? dayColor(s.date) : MODE_COLOR.manual;
        reg(gk, L.polyline(latlngs, { pane: 'casing', color: '#ffffff', weight: 9, opacity: 0.95, lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(layer));
        const ol = reg(gk, L.polyline(latlngs, { color: color, weight: 5, opacity: 0.9, dashArray: '2 10', lineCap: 'round', lineJoin: 'round' })
          .bindPopup('<b>' + esc(pname(from)) + ' → ' + esc(pname(to)) + '</b><br>' +
            esc(s.dep) + ' → ' + esc(s.arr) + (s.minutes ? ' (' + s.minutes + '분)' : '') + ', 다음 날 도착' +
            (s.summary ? '<br>' + esc(s.summary) : ''))
          .addTo(layer));
        overLines[okey] = ol;
        if (all) { latlngs.forEach(ll => bounds.push(ll)); return; }
        // 하루 탭: 그날 장소 쪽 끝에서 2km쯤 떨어진 곳에 라벨 (어디로 가는지·어디서 오는지)
        const seq = out ? latlngs : latlngs.slice().reverse();
        let acc = 0, at = seq[seq.length - 1];
        for (let i = 1; i < seq.length; i++) {
          acc += haversine(seq[i - 1], seq[i]);
          if (acc >= 2000) { at = seq[i]; break; }
        }
        const text = out ? '→ ' + pname(to) + ' (다음 날 ' + String(s.arr || '').replace(/\s*\(\+\d+\)/, '') + ')'
                         : '← ' + pname(from) + ' (전날 ' + String(s.dep || '') + ')';
        reg(gk, L.marker(at, {
          icon: L.divIcon({ className: '', html: '<span class="walk-label" style="color:var(--muted);border-color:var(--muted)">' + esc(text) + '</span>', iconSize: null }),
          interactive: false, keyboard: false,
        }).addTo(layer));
      });

      // 지도: 핀
      //  하루 안에 같은 장소를 여러 번 들르면 핀 하나로 묶고 번호를 "3·15"처럼 모두 표시
      //  같은 장소 = 장소 키가 같거나 30m 이내
      const samePin = (a, b) => (a.placeKey && a.placeKey === b.placeKey) || haversine([a.lat, a.lng], [b.lat, b.lng]) <= 30;
      const pinGroups = [];
      pts.forEach(p => {
        if (p.lat == null) return;
        const g = pinGroups.find(x => samePin(x[0], p));
        if (g) g.push(p); else pinGroups.push([p]);
      });
      pinGroups.forEach(g => {
        const p = g[0];
        const multi = g.length > 1;
        const label = g.map(x => x.order).join('·');
        const pl = placeOf(p);
        const photo = pl && pl.photos && pl.photos.length ? pl.photos[0] : '';
        const pinW = Math.max(28, 14 + label.length * 7);   // 묶음 핀 가로 폭
        // 도감에 사진 있는 장소는 동그란 사진 핀 + 순서 번호 뱃지
        const icon = photo
          ? L.divIcon({
              className: '',
              html: '<div class="pin-photo" style="--pin:' + pinColor + '"><img src="' + esc(photo) + '" alt="" loading="lazy"><span>' + label + '</span></div>',
              iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -22]
            })
          : L.divIcon({
              className: '',
              html: '<div class="pin' + (multi ? ' multi' : '') + '" style="--pin:' + pinColor + '">' + label + '</div>',
              iconSize: multi ? [pinW, 28] : [26, 26], iconAnchor: multi ? [pinW / 2, 14] : [13, 13], popupAnchor: [0, -14]
            });
        // 팝업: 들르는 횟수만큼 번호·시간·활동 줄
        const visits = multi
          ? g.map(x => '<br><b>' + x.order + '</b> ' + esc(timeRange(x)) + (x.activity ? ' · ' + esc(x.activity) : '')).join('')
          : '<br>' + esc(timeRange(p)) + (p.activity ? '<br>' + esc(p.activity) : '');
        const m = L.marker([p.lat, p.lng], { icon: icon, title: pname(p), zIndexOffset: photo ? 100 : 0 }).bindPopup(
          (photo ? '<img class="pop-photo" src="' + esc(photo) + '" alt="">' : '') +
          (pl ? '<span class="badge t-' + esc(pl.type) + '">' + esc(pl.type) + '</span> ' : '') +
          '<b>' + esc(pname(p)) + '</b>' + visits +
          (pl && costText(pl) ? '<br>' + esc(costText(pl)) : '') +
          '<br>' + navBtn(p.lat, p.lng, true)
        ).addTo(layer);
        const vks = g.map(x => date + '#' + x.order);
        // 묶인 핀은 각 일정 번호 그룹에 모두 등록 (리스트에서 어느 쪽을 눌러도 이 핀이 진하게)
        vks.forEach(vk => { markers[vk] = reg('S:' + vk, m); });
        // 지도에서 핀을 눌러도 그 장소만 강조 + 리스트에서 그 장소 표시 (묶인 핀은 들르는 일정 전부)
        m.on('click', () => {
          highlightStop(vks[0], vks.slice(1));
          const el = document.querySelector('.stop[data-key="' + vks[0] + '"]');
          if (el) { clearActive(); vks.forEach(k => { const e = document.querySelector('.stop[data-key="' + k + '"]'); if (e) e.classList.add('active'); }); el.scrollIntoView({ block: 'nearest' }); }
        });
        bounds.push([p.lat, p.lng]);
        // 종착점이 따로 있으면: 시작점→종착점 점선 + 작은 네모 핀 (여기서 다음 장소로 출발)
        g.forEach(x => {
          if (!hasEnd(x)) return;
          const sk = 'S:' + date + '#' + x.order;
          reg(sk, L.polyline([[x.lat, x.lng], [x.endLat, x.endLng]], {
            color: pinColor, weight: 3, opacity: 0.7, dashArray: '2 7', lineCap: 'round', interactive: false
          }).addTo(layer));
          reg(sk, L.marker([x.endLat, x.endLng], {
            icon: L.divIcon({
              className: '',
              html: '<div style="width:14px;height:14px;border-radius:3px;background:#fff;border:3px solid ' + pinColor + ';box-shadow:0 1px 3px rgba(29,38,51,.4)"></div>',
              iconSize: [14, 14], iconAnchor: [7, 7]
            }),
            title: pname(x) + ' 종착점', interactive: false, keyboard: false
          }).addTo(layer));
          bounds.push([x.endLat, x.endLng]);
        });
      });

      // 타임라인
      if (selected === 'all') html += '<div class="day-head"><i class="sw" style="background:' + dayColor(date) + '"></i>' + dayLabel(date) + wxShort(date) + '</div>';
      else html += wxLine(date) + spendBlock(pts, '이날') + fareBlock(pts, '이날') + walkLine(date) + actualBlock(pts) +
        '<button class="btn replay-btn" type="button" id="replayBtn" data-date="' + date + '">▶ 하루 리플레이</button>';
      const doneCount = pts.filter(p => isVisited(p)).length;
      if (doneCount) html += '<p class="progress">방문 <b>' + doneCount + '</b> / ' + pts.length + '</p>';
      if (selected !== 'all') html += paceLine(date);
      const nowInfo = nowStop(date, pts);
      html += '<ol class="line">';
      // 일몰 선: 장소마다 그 좌표의 일몰을 구해서, 처음으로 해가 지는 곳 한 군데에만 (타임라인 탭과 같은 규칙)
      let sunDone = false, prevDep = null, lastLL = null;
      pts.forEach((p, i) => {
        const pos = (i === 0 ? ' first' : '') + (i === pts.length - 1 ? ' last' : '');
        const vk = date + '#' + p.order;
        const isNow = nowInfo && nowInfo.order === p.order;
        if (p.lat != null) lastLL = [p.lat, p.lng];
        const sun = !sunDone && lastLL ? sunsetMin(date, lastLL[0], lastLL[1]) : null;
        const pa = toMin(p.arrive), pd = toMin(p.depart);
        if (sun != null && pa != null && pa >= sun) {
          html += mapSunLine(sun, prevDep != null && prevDep < sun ? '이동 중' : '');   // 이동하는 사이 해 짐
          sunDone = true;
        }
        html += '<li class="stop' + pos + (isVisited(p) ? ' done' : '') + (isNow ? ' is-now' : '') +
          '" tabindex="0" data-key="' + vk + '">' +
          '<div class="time"><span class="arr">' + esc(p.arrive || '') + '</span>' +
          (p.depart && p.depart !== p.arrive ? '<span class="dep">' + esc(p.depart) + ' 출발</span>' : '') + timeExtra(p) + '</div>' +
          '<div class="rail"><span class="dot" style="border-color:' + pinColor + '">' + p.order + '</span></div>' +
          '<div class="body"><div class="place">' + esc(pname(p)) +
          (isNow ? '<span class="now-tag' + (nowInfo.next ? ' next' : '') + '">' + (nowInfo.next ? '다음' : '지금') + '</span>' : '') + '</div>' +
          (pname(p) !== p.place ? '<div class="meta" style="margin-top:0">' + esc(p.place) + '</div>' : '') +
          (p.activity ? '<div class="activity">' + esc(p.activity) + '</div>' : '') +
          (p.memo ? '<div class="memo">' + esc(p.memo) + '</div>' : '') +
          (p.stay ? '<div class="meta">' + p.stay + '분 머무름' + (p.fixed ? ', ' + esc(p.fixed) + ' 고정' : '') + '</div>'
                  : (p.fixed ? '<div class="meta">' + esc(p.fixed) + ' 고정</div>' : '')) +
          costLine(p) +
          slackBadge(p.slack) +
          warnHtml(p) +
          (p.lat == null ? '<div class="meta">좌표 없음, 지도에 표시 안 됨</div>' : '') +
          (hasEnd(p) ? '<div class="meta">▢ 종착점에서 다음 장소로 출발 (' + fmtDist(haversine([p.lat, p.lng], [p.endLat, p.endLng])) + ' 떨어짐)</div>' : '') +
          placeCard(placeOf(p)) +
          navBtn(p.lat, p.lng, true) +
          '<button class="visit" type="button" data-vk="' + vk + '" aria-pressed="' + isVisited(p) + '">' +
          (isVisited(p) ? '✓ 방문함' : '방문 체크') + '</button>' +
          '</div></li>';

        // 머무는 동안 해 짐: 장소 바로 아래
        if (sun != null && !sunDone && pa != null && pd != null && pd > sun) {
          html += mapSunLine(sun, pname(p) + '에 있을 때');
          sunDone = true;
        }
        if (pd != null) prevDep = pd;

        const ov = selected !== 'all' && (DATA.overnight || []).find(x => x.date === date && x.fromOrder === p.order);
        if (ov) {
          const toP = DATA.points.find(x => x.date === ov.toDate && x.order === ov.toOrder);
          html += '<li class="leg mode-manual" tabindex="0" data-over="' + esc(ov.date + '#' + ov.fromOrder + '#+' + ov.toOrder) + '">' +
            '<div class="time"></div><div class="rail"></div>' +
            '<div class="body"><div class="leg-head">' + modeIcon('manual') + esc(ov.mode) + (ov.minutes ? ' ' + ov.minutes + '분' : '') +
            ' → 다음 날 ' + esc(toP ? pname(toP) : '') + '</div>' +
            '<div class="leg-sum">' + esc(ov.dep) + ' → ' + esc(ov.arr) + '</div></div></li>';
        }
        const s = segs.find(x => x.fromOrder === p.order);
        if (s) {
          const cls = MODE_CLASS[s.mode] || 'manual';
          const lkey = date + '#' + s.fromOrder + '#' + s.toOrder;
          // 탑승 단계가 있는 대중교통 구간은 요약 줄 + 단계별 줄(도보·노선·역)로 쪼개서 보여줌
          const split = cls === 'transit' && Array.isArray(s.steps) && s.steps.some(x => x.t === 'transit');
          const toPt = pts.find(x => x.order === s.toOrder);
          html += '<li class="leg mode-' + cls + (split ? ' leg-split' : '') + '" tabindex="0" data-key="' + lkey + '">' +
            '<div class="time"></div><div class="rail"></div>' +
            '<div class="body"><div class="leg-head">' + modeIcon(cls) + esc(segModeName(s)) + ' ' + s.minutes + '분' +
            (s.transfers !== '' && Number(s.transfers) > 0 ? ', 환승 ' + s.transfers + '회' : '') +
            (s.fare != null && !isNaN(s.fare) && s.fare > 0 ? ', ' + YEN(s.fare) : '') +
            ' ' + passChip(s) + '</div>' +
            (s.warn ? '<div class="warn"><span>' + esc(s.warn) + '</span></div>' : '') +
            (s.walkHint ? '<div class="callout good">' + modeIcon('walk') + ' 도보 추천: ' + esc(s.walkHint) + '</div>' : '') +
            taxiBox(s) +
            (split
              ? (String(s.summary || '').indexOf('[같은 요일 시간표 기준]') === 0 ? '<div class="approx">시간표는 같은 요일 기준 근사값</div>' : '')
              : (Array.isArray(s.steps) && s.steps.length
                ? stepsDetail(s.steps, s.summary)
                : (s.summary ? '<div class="leg-sum">' + esc(s.summary) + '</div>' : ''))) +
            (s.link ? '<a href="' + s.link + '" target="_blank" rel="noopener">구글 지도로 보기</a>' : '') +
            '</div></li>';
          if (split) html += splitStepsHtml(s, lkey, pname(p), toPt ? pname(toPt) : '');
        }
      });
      html += '</ol>';
    });

    list.innerHTML = html;
    mountLotties(list);
    bindTaxi(list);
    // 도장·새로고침 때마다 맞추면 보던 위치가 튀어서, 날짜·사람이 바뀌었을 때만. 숨겨진 지도(크기 0)에선 안 맞춤
    const fitKey = selected + '|' + (USER ? USER.id : '') + '|' + bounds.length;
    if (bounds.length && currentView === 'plan' && map.getSize().x > 0 && fitKey !== lastFitKey) {
      map.fitBounds(bounds, { padding: [30, 30], maxZoom: 15 });
      lastFitKey = fitKey;
    }
    resetFocus(true);
    updateWalkLabels();
    renderDayLegend();

    const rb = document.getElementById('replayBtn');
    if (rb) rb.addEventListener('click', () => startReplay(rb.dataset.date));
    list.querySelectorAll('.visit').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation();
      toggleVisit(btn.dataset.vk);
    }));
    const nowEl = list.querySelector('.stop.is-now');
    if (nowEl && !scrolledToNow) { scrolledToNow = true; setTimeout(() => nowEl.scrollIntoView({ block: 'center' }), 50); }
    list.querySelectorAll('.pcard .linkbtn').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation();
      openDetail(btn.dataset.place);
    }));
    list.querySelectorAll('.stop').forEach(el => {
      const go = () => focusStop(el);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
    list.querySelectorAll('.leg').forEach(el => {
      const go = e => { if (e && e.target.tagName === 'A') return; focusLeg(el); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
    list.querySelectorAll('.sleg').forEach(el => {
      const go = () => focusStep(el);
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    });
  }

  // 전체 탭 지도 범례: 날짜 색. 누르면 그날로 이동
  let legendCtl = null;
  function renderDayLegend() {
    if (legendCtl) { map.removeControl(legendCtl); legendCtl = null; }
    if (selected !== 'all' || DATA.dates.length < 2) return;
    const Legend = L.Control.extend({
      options: { position: 'bottomleft' },
      onAdd: function () {
        const box = L.DomUtil.create('div', 'day-legend');
        box.innerHTML = DATA.dates.map(d => '<button type="button" data-d="' + d + '"><i class="sw" style="background:' + dayColor(d) + '"></i>' + dayLabel(d) + '</button>').join('');
        L.DomEvent.disableClickPropagation(box);
        L.DomEvent.disableScrollPropagation(box);
        box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
          selected = b.dataset.d;
          renderTabs();
          refresh();
        }));
        return box;
      }
    });
    legendCtl = new Legend();
    map.addControl(legendCtl);
  }

  // 단계별로 그린 것 (단계 강조용). 키: "L:구간키|단계번호", 역 표시는 "L:구간키|st"
  const stepLayers = {};

  // 대중교통 단계별 선 + 승차·환승·하차 역 표시. 강조 처리용으로 그린 것들 반환
  // 역 이름 라벨은 확대했을 때만 (도보 거리 라벨과 같은 층)
  // 탈것 이모지: 구글 경로의 탈것 이름(지하철·기차·버스 …)과 노선명으로
  function vehicleEmoji(st) {
    const v = String((st && st.vehicle) || '') + ' ' + String((st && (st.line + ' ' + (st.full || ''))) || '');
    if (/신칸센|新幹線|고속\s*열차|High speed/i.test(v)) return '🚄';
    if (/버스|バス|Bus/i.test(v)) return '🚌';
    if (/지하철|地下鉄|Subway|Metro/i.test(v)) return '🚇';
    if (/트램|노면|路面|Tram/i.test(v)) return '🚋';
    if (/모노레일|モノレール|Monorail/i.test(v)) return '🚝';
    if (/페리|배|フェリー|Ferry/i.test(v)) return '⛴️';
    if (/케이블|ケーブル|로프웨이|ロープウェイ|Cable|Gondola/i.test(v)) return '🚡';
    return '🚆';
  }

  function drawSteps(steps, gk) {
    const out = [];
    const stations = stepLayers[gk + '|st'] = [];
    steps.forEach((st, i) => {
      const mine = stepLayers[gk + '|' + i] = [];
      const transit = st.t === 'transit';
      const c = transit ? (st.color || lineColor(st.line + ' ' + (st.full || '')) || MODE_COLOR.transit) : MODE_COLOR.walk;
      const ll = st.poly ? decodePolyline(st.poly) : [];
      if (ll.length > 1) {
        const pl = reg(gk, L.polyline(ll, {
          color: c, weight: transit ? 6 : 4, opacity: 0.95, dashArray: transit ? null : '2 7',
          lineCap: 'round', lineJoin: 'round', interactive: false
        }).addTo(layer));
        out.push(pl);
        mine.push(pl);
        // 탑승 구간 가운데에 탈것 이모지 (지하철 🚇, 버스 🚌 …)
        if (transit) {
          const vm = reg(gk, L.marker(lineInfo(ll).mid, {
            icon: L.divIcon({ className: '', html: '<span class="veh-pin" style="--c:' + esc(c) + '">' + vehicleEmoji(st) + '</span>', iconSize: [26, 26], iconAnchor: [13, 13] }),
            interactive: false, keyboard: false,
          }).addTo(layer));
          out.push(vm);
          mine.push(vm);
        }
      }
      if (!transit) return;
      const before = steps.slice(0, i).some(x => x.t === 'transit');
      const nextT = steps.slice(i + 1).find(x => x.t === 'transit');
      const ends = [
        { p: st.fromLL, name: st.from + (st.jfrom && st.jfrom !== st.from ? ' ' + st.jfrom : ''), kind: before ? '환승' : '승차', label: true },
        // 갈아타는 역이 다음 승차역과 이름이 같으면 라벨 한 번만
        { p: st.toLL, name: st.to + (st.jto && st.jto !== st.to ? ' ' + st.jto : ''), kind: nextT ? '환승' : '하차', label: !nextT || nextT.from !== st.to },
      ];
      ends.forEach(e => {
        if (!e.p) return;
        const dot = reg(gk, L.circleMarker(e.p, { radius: 5, color: c, weight: 3, fillColor: '#ffffff', fillOpacity: 1, interactive: false }).addTo(layer));
        out.push(dot);
        stations.push(dot);
        if (!e.label) return;
        stations.push(reg(gk, L.marker(e.p, {
          icon: L.divIcon({
            className: '',
            html: '<span class="walk-label" style="color:' + esc(c) + ';border-color:' + esc(c) + ';margin-top:-18px">' + e.kind + ' ' + esc(e.name) + '</span>',
            iconSize: null
          }),
          interactive: false, keyboard: false,
        }).addTo(walkLayer)));
      });
    });
    return out;
  }

  // 구간 안 단계만 강조. idxs: 단계 번호 배열. 역 표시는 계속 진하게
  //  단계 선이 없으면(전체 탭 등) 구간 전체 강조로 대신함
  function highlightSteps(lkey, idxs) {
    if (!lines[lkey]) return;
    highlightLeg(lkey);
    hlKey = 'step:' + lkey;   // 요약 줄을 다시 누르면 구간 전체 강조가 되게 (해제 토글 안 걸리게)
    const fitOk = currentView === 'plan' && map.getSize().x > 0;
    const gk = 'L:' + lkey;
    const on = new Set((idxs || []).map(Number));
    const b = L.latLngBounds([]);
    Object.keys(stepLayers).forEach(k => {
      const cut = k.lastIndexOf('|');
      if (k.slice(0, cut) !== gk) return;
      const tail = k.slice(cut + 1);
      const sel = tail === 'st' || on.has(Number(tail));
      stepLayers[k].forEach(l => {
        setDim(l, sel, DIM_PICK);
        if (!sel || tail === 'st') return;
        if (l.getBounds) b.extend(l.getBounds());
        else if (l.getLatLng) b.extend(l.getLatLng());
        if (l.bringToFront) l.bringToFront();
      });
    });
    if (!fitOk) return;
    if (b.isValid()) map.fitBounds(b, { padding: [50, 50], maxZoom: 17 });
    else map.fitBounds(lines[lkey].getBounds(), { padding: [40, 40], maxZoom: 16 });
  }

  // 대중교통 구간을 단계 줄 데이터로 쪼갬: 도보·노선 줄 + 사이사이 역 줄(승차·하차·환승 시각)
  //  지도 탭 목록(splitStepsHtml)과 타임라인 탭(tlSplitHtml)이 같이 씀
  //  fromName·toName: 구간 출발·도착 장소 이름 (첫·마지막 도보 설명용)
  //  반환: [{ type: 'step', k: 'walk'|'ride', i, c, min, head, sub } | { type: 'station', name, ja, time, time2, kind, c1, c2 }]
  function splitStepRows(s, fromName, toName) {
    const steps = s.steps;
    const hmMin = v => { const m = String(v || '').match(/^(\d{1,2}):(\d{2})/); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
    const gap = (a, b) => { const x = hmMin(a), y = hmMin(b); return x == null || y == null ? null : (y - x + 1440) % 1440; };
    const prevRide = i => { for (let k = i - 1; k >= 0; k--) if (steps[k].t === 'transit') return steps[k]; return null; };
    const nextRide = i => { for (let k = i + 1; k < steps.length; k++) if (steps[k].t === 'transit') return steps[k]; return null; };
    const colorOf = st => st.t === 'transit' ? (st.color || lineColor(st.line + ' ' + (st.full || '')) || MODE_COLOR.transit) : MODE_COLOR.walk;
    const rows = [];
    let railColor = MODE_COLOR.transit;
    const pushStep = row => {
      const tail = rows[rows.length - 1];
      if (tail && tail.type === 'station') tail.c2 = row.c;
      rows.push(row);
      railColor = row.c;
    };
    const pushStation = (name, ja, time, kind) => {
      const tail = rows[rows.length - 1];
      // 같은 역에서 바로 갈아타면(사이 도보 없음) 역 줄 하나로: 하차 시각 + 출발 시각
      if (tail && tail.type === 'station' && tail.name === name && kind === '환승') {
        tail.time2 = time;
        tail.kind = '환승';
        return;
      }
      rows.push({ type: 'station', name: name, ja: ja, time: time, kind: kind, c1: railColor, c2: railColor });
    };
    steps.forEach((st, i) => {
      const c = colorOf(st);
      if (st.t !== 'transit') {
        if (!st.min) return;
        const pr = prevRide(i), nx = nextRide(i);
        let sub;
        if (pr && nx) {
          sub = esc(pr.to) + ' → ' + esc(nx.from) + (pr.to === nx.from ? ' (같은 역 안 환승)' : ' (환승)');
          const g = gap(pr.arr, nx.dep);
          if (g != null && g - st.min > 0) sub += ' · 대기 약 ' + (g - st.min) + '분';
        } else if (!pr) {
          sub = esc(fromName || '출발지') + ' → ' + (nx ? esc(nx.from) + ' 승차' : esc(toName || '도착지'));
        } else {
          sub = esc(pr.to) + ' 하차 → ' + esc(toName || '도착지');
        }
        pushStep({
          type: 'step', k: 'walk', i: i, c: c, min: st.min,
          head: modeIcon('walk') + (st.t === 'walk' ? '도보' : '이동') + ' ' + st.min + '분' + (st.m ? ' · ' + fmtDist(st.m) : ''),
          sub: sub,
        });
        return;
      }
      const pr = prevRide(i), nx = nextRide(i);
      pushStation(st.from, st.jfrom, st.dep, pr ? '환승' : '승차');
      const ride = gap(st.dep, st.arr);
      const min = ride != null ? ride : st.min;
      const sub = [];
      if (st.head) sub.push(esc(st.head) + jaName(st.head, st.jhead) + ' 방면');
      if (st.full && st.full !== st.line) sub.push(esc(st.full));
      if (st.jline && st.jline !== st.line) sub.push('<span class="ja">' + esc(st.jline) + '</span>');
      if (st.ag) sub.push(esc(st.ag));
      pushStep({
        type: 'step', k: 'ride', i: i, c: c, min: min,
        head: '<span class="veh" aria-hidden="true">' + vehicleEmoji(st) + '</span><span class="ln">' + esc(st.line) + '</span>' + min + '분' + (st.stops ? ' · ' + st.stops + '정거장' : '') +
          (st.pass === true ? ' <span class="step-pass">🎫 주유패스</span>' : st.pass === false ? ' <span class="step-card">💳 IC카드·현금</span>' : ''),
        sub: sub.join(' · '),
      });
      pushStation(st.to, st.jto, st.arr, nx ? '하차 → 환승' : '하차');
    });
    return rows;
  }

  // 지도 탭 목록용: 단계 줄은 누르면 지도에서 그 단계만 강조
  function splitStepsHtml(s, lkey, fromName, toName) {
    return splitStepRows(s, fromName, toName).map(r => {
      if (r.type === 'station') {
        return '<li class="sst" style="--c1:' + esc(r.c1) + ';--c2:' + esc(r.c2) + '">' +
          '<div class="time">' + esc(r.time || '') + (r.time2 ? '<small>' + esc(r.time2) + ' 출발</small>' : '') + '</div>' +
          '<div class="rail"><span class="sdot"></span></div>' +
          '<div class="body"><b>' + esc(r.name) + '</b>' + jaName(r.name, r.ja) + '<span class="k">' + esc(r.kind) + '</span></div></li>';
      }
      return '<li class="sleg k-' + r.k + '" tabindex="0" data-key="' + lkey + '" data-si="' + r.i + '" style="--c:' + esc(r.c) + '">' +
        '<div class="time"></div><div class="rail"></div>' +
        '<div class="body"><div class="s-head">' + r.head + '</div>' +
        (r.sub ? '<div class="s-sub">' + r.sub + '</div>' : '') + '</div></li>';
    }).join('');
  }

  // 지도 탭 목록에 끼우는 일몰 선. where: '이동 중' / 'OO에 있을 때' / ''
  function mapSunLine(min, where) {
    return '<li class="lsun" role="separator" aria-label="일몰 ' + hhmm(min) + '">' +
      '<div class="time">' + hhmm(min) + '</div><div class="rail"></div>' +
      '<div class="body"><span>🌇 일몰' + (where ? ', ' + esc(where) : '') + '</span></div></li>';
  }

  // 두 점 사이 2차 베지어 곡선 (거리 멀수록 많이 휨)
  function arcPoints(a, b, n) {
    n = n || 48;
    const far = haversine(a, b) > 300000;
    const bend = far ? 0.22 : 0.12;
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const c = [(a[0] + b[0]) / 2 - dy * bend, (a[1] + b[1]) / 2 + dx * bend];
    const out = [];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], u * u * a[1] + 2 * u * t * c[1] + t * t * b[1]]);
    }
    return out;
  }

  // 지도에 그린 것을 흐리기 그룹에 등록 (원래 투명도 기억)
  function reg(key, lyr) {
    (groups[key] = groups[key] || []).push(lyr);
    if (lyr.options) { lyr._fop = lyr.options.opacity; lyr._ffop = lyr.options.fillOpacity; }
    return lyr;
  }

  // 하나 진하게/흐리게: 핀·라벨은 setOpacity, 선·원은 원래 투명도 기준
  function setDim(lyr, on, dim) {
    if (lyr.setOpacity) { lyr.setOpacity(on ? 1 : dim); return; }
    if (!lyr.setStyle) return;
    const op = lyr._baseOp != null ? lyr._baseOp : (lyr._fop != null ? lyr._fop : 1);
    const st = { opacity: on ? op : Math.min(dim, op) };
    if (lyr._ffop != null) st.fillOpacity = on ? lyr._ffop : Math.min(dim, lyr._ffop);
    lyr.setStyle(st);
  }

  // set에 든 그룹만 진하게, 나머지는 dim. set 없으면 전부 원래대로
  function applyFocus(set, dim) {
    // 한 레이어가 여러 그룹에 있으면(같은 장소 묶음 핀) 그중 하나라도 켜지면 진하게
    const onL = new Set();
    Object.keys(groups).forEach(k => { if (!set || set.has(k)) groups[k].forEach(l => onL.add(l)); });
    Object.keys(groups).forEach(k => {
      groups[k].forEach(l => setDim(l, onL.has(l), dim));
    });
    // 진한 구간은 맨 위로 (흐린 선에 가려지지 않게)
    if (set) set.forEach(k => {
      if (k.indexOf('L:') !== 0 || !groups[k]) return;
      groups[k].forEach(l => { if (l.bringToFront && !(l.setOpacity)) l.bringToFront(); });
    });
  }

  // 구간 굵기: 강조한 구간만 굵게
  function applyWeight() {
    Object.keys(lines).forEach(k => {
      const base = lines[k]._baseW || 5;
      lines[k].setStyle({ weight: k === hlKey ? base + 3 : base });
      if (casings[k]) casings[k].setStyle({ weight: k === hlKey ? base + 7 : base + 4 });
    });
  }

  // 구간 하나 + 양 끝 장소
  function legSet(lkey) {
    const [d, f, t] = lkey.split('#');
    return new Set(['L:' + lkey, 'S:' + d + '#' + f, 'S:' + d + '#' + t]);
  }

  // 장소 하나 + 들어오는·나가는 구간
  function stopSet(vk) {
    const [d, o] = vk.split('#');
    const set = new Set(['S:' + vk]);
    Object.keys(lines).forEach(k => {
      const [ld, f, t] = k.split('#');
      if (ld === d && (f === o || t === o)) set.add('L:' + k);
    });
    return set;
  }

  // 지금 시각(도쿄)에 해당하는 장소·구간. 머무는 중이면 그 장소 + 다음 구간 + 다음 장소, 이동 중이면 그 구간 + 양 끝
  function nowFocus() {
    if (!DATA) return null;
    const now = tokyoNow();
    if (!DATA.dates.includes(now.date)) return null;
    const pts = DATA.points.filter(p => p.date === now.date).sort((a, b) => a.order - b.order);
    if (!pts.length) return null;
    const segOut = p => DATA.segments.find(x => x.date === now.date && x.fromOrder === p.order);
    const legKey = s => now.date + '#' + s.fromOrder + '#' + s.toOrder;
    const atStop = (i, label) => {
      const s = segOut(pts[i]);
      const set = s ? legSet(legKey(s)) : new Set(['S:' + now.date + '#' + pts[i].order]);
      return { set: set, label: label };
    };
    const tA = p => { const a = toMin(p.arrive); return a != null ? a : toMin(p.depart); };
    const tD = p => { const d = toMin(p.depart); return d != null ? d : toMin(p.arrive); };
    const first = tA(pts[0]);
    if (first != null && now.min < first) return atStop(0, '출발 전 · ' + pname(pts[0]));
    for (let i = 0; i < pts.length; i++) {
      const a = tA(pts[i]), d = tD(pts[i]);
      if (a != null && d != null && a <= now.min && now.min <= d) return atStop(i, '머무는 중 · ' + pname(pts[i]));
      const nx = pts[i + 1];
      const na = nx ? tA(nx) : null;
      if (nx && d != null && na != null && d < now.min && now.min < na) {
        const s = segOut(pts[i]);
        const set = s ? legSet(legKey(s)) : new Set(['S:' + now.date + '#' + pts[i].order, 'S:' + now.date + '#' + nx.order]);
        return { set: set, label: '이동 중 · ' + pname(pts[i]) + ' → ' + pname(nx) };
      }
    }
    const last = pts[pts.length - 1];
    return { set: new Set(['S:' + now.date + '#' + last.order]), label: '일정 끝 · ' + pname(last) };
  }

  // 지금 모드면 지금 것만 진하게, 아니면 전부 원래대로. fit이면 지금 것이 바뀌었을 때 그쪽으로 지도 맞춤
  function resetFocus(fit) {
    hlKey = null;
    pickKey = null;
    applyWeight();
    const nf = nowMode ? nowFocus() : null;
    // 지금 장소·구간이 지도에 하나도 없으면(다른 날 탭 등) 흐리지 않음
    const usable = nf && Array.from(nf.set).some(k => groups[k]);
    if (nowMode && nf) startNowTimer();
    applyFocus(usable ? nf.set : null, DIM_NOW);
    if (nowBtn) nowBtn.title = nowMode ? '지금 모드 켜짐' + (nf ? ' · ' + nf.label : '') : '지금 모드';
    if (!usable || !fit) return;
    const sig = Array.from(nf.set).sort().join('|');
    if (sig === lastNowSig) return;
    lastNowSig = sig;
    fitGroups(nf.set);
  }

  function fitGroups(set) {
    if (currentView !== 'plan' || map.getSize().x <= 0) return;
    const b = L.latLngBounds([]);
    set.forEach(k => (groups[k] || []).forEach(l => {
      if (l.getBounds) b.extend(l.getBounds());
      else if (l.getLatLng) b.extend(l.getLatLng());
    }));
    if (meMarker) b.extend(meMarker.getLatLng());
    if (b.isValid()) map.fitBounds(b, { padding: [40, 40], maxZoom: 16 });
  }

  // 지금 모드 켜기/끄기: 켜면 오늘 탭으로, 내 위치도 같이 켬, 1분마다 다시 판정
  function setNowMode(on) {
    if (on) {
      const t = tokyoNow();
      if (!DATA || !DATA.dates.includes(t.date)) {
        showToast('오늘(' + t.date + ')은 일정에 없는 날이라 지금 모드를 못 씀');
        on = false;
      }
    }
    nowMode = on;
    try { localStorage.setItem('trip-now-mode', on ? '1' : '0'); } catch (e) { /* 무시 */ }
    if (nowBtn) nowBtn.setAttribute('aria-pressed', String(on));
    clearInterval(nowTimer);
    nowTimer = null;
    lastNowSig = '';
    if (!on) { resetFocus(false); return; }
    const today = tokyoNow().date;
    if (selected !== today) { selected = today; stopReplay(); renderTabs(); refresh(); }
    else resetFocus(true);
    startNowTimer();
  }

  // 1분마다 지금 것 다시 판정 + 내 위치 켜기 (페이지 다시 열었을 때 지금 모드가 켜져 있던 경우도)
  function startNowTimer() {
    if (nowTimer) return;
    locateMe({ noPan: true });
    nowTimer = setInterval(() => {
      if (!nowMode || currentView !== 'plan' || hlKey || pickKey) return;
      resetFocus(true);
    }, 60000);
  }

  // 구간 하나만 강조: 나머지는 흐리게, 고른 선은 굵게 맨 위로. key 없으면 원래대로(지금 모드면 지금 것만)
  function highlightLeg(key) {
    if (!key) { resetFocus(false); return; }
    hlKey = key;
    pickKey = null;
    applyWeight();
    applyFocus(legSet(key), DIM_PICK);
  }

  // 장소 하나만 강조: 그 장소 + 들어오는·나가는 구간
  //  extra: 같은 핀으로 묶인 다른 일정 번호들 (같이 강조)
  function highlightStop(vk, extra) {
    hlKey = null;
    pickKey = vk;
    applyWeight();
    const set = stopSet(vk);
    (extra || []).forEach(k => stopSet(k).forEach(x => set.add(x)));
    applyFocus(set, DIM_PICK);
  }

  // 지도 빈 곳 누르면 강조 해제
  map.on('click', () => { if (hlKey || pickKey) { highlightLeg(null); clearActive(); } });

  function focusStop(el) {
    clearActive();
    el.classList.add('active');
    const m = markers[el.dataset.key];
    if (!m) { highlightLeg(null); return; }
    // 같은 장소 다시 누르면 강조 해제
    if (pickKey === el.dataset.key) { highlightLeg(null); el.classList.remove('active'); map.closePopup(); return; }
    highlightStop(el.dataset.key);
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 15));
    m.openPopup();
  }

  function focusLeg(el) {
    clearActive();
    el.classList.add('active');
    if (el.dataset.over) {
      const ol = overLines[el.dataset.over];
      if (ol) { map.fitBounds(ol.getBounds(), { padding: [40, 40], maxZoom: 12 }); ol.openPopup(ol.getCenter()); }
      return;
    }
    const line = lines[el.dataset.key];
    if (!line) return;
    // 같은 구간 다시 누르면 강조 해제
    if (hlKey === el.dataset.key) { highlightLeg(null); el.classList.remove('active'); map.closePopup(); return; }
    highlightLeg(el.dataset.key);
    map.fitBounds(line.getBounds(), { padding: [40, 40], maxZoom: 16 });
    line.openPopup(line.getCenter());
  }

  function clearActive() {
    document.querySelectorAll('.stop.active, .leg.active, .sleg.active').forEach(x => x.classList.remove('active'));
    stepKey = null;
  }

  // 단계 줄 누르기: 그 단계만 강조 (같은 줄 다시 누르면 해제)
  let stepKey = null;
  function focusStep(el) {
    const k = el.dataset.key + '|' + el.dataset.si;
    const was = stepKey === k;
    clearActive();
    if (was) { highlightLeg(null); return; }
    el.classList.add('active');
    highlightSteps(el.dataset.key, [el.dataset.si]);
    stepKey = k;
  }

  /* ── 이동수단 아이콘 ── */
  const ICONS = {
    transit: '<path d="M7 3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3z"/><path d="M4 10h16"/><path d="M8 21l2-4M16 21l-2-4"/><circle cx="8.5" cy="13.5" r=".5"/><circle cx="15.5" cy="13.5" r=".5"/>',
    walk: '<circle cx="13" cy="4" r="2"/><path d="M10 22l2-7 3 3v6"/><path d="M8 12l2-4 4 1 2 4"/><path d="M12 15l-2-3"/>',
    car: '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/>',
    manual: '<path d="M2 16l20-6-20-6 4 6-4 6z"/><path d="M6 10h8"/>',
  };
  function modeIcon(cls) {
    return '<svg class="mi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONS[cls] || ICONS.manual) + '</svg>';
  }
</script>
