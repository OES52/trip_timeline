# 정적 여행 타임라인 (nginx-unprivileged, 8080)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;

  # 화면 본체·서비스 워커는 항상 새로 확인 (배포하면 바로 반영)
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  # 아이콘·이미지 등은 길게
  location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=604800"; }

  location / { try_files $uri /index.html; }

  # 쿠버네티스 프로브용
  location = /healthz { access_log off; return 200 "ok\n"; }
}
