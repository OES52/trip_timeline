# 정적 여행 타임라인 (nginx-unprivileged, 8080)
#  /api/   → trip-api  (Apps Script 프록시: 캐시·PIN·사진·출발 알림)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # 넘김 주소를 /v2/ 처럼 경로만 (앞단 인그레스가 https라 nginx가 http://…:8080 을 붙이면 안 됨)
  absolute_redirect off;

  # 서비스 이름은 요청 때 찾음 (trip-api가 아직 없어도 nginx는 뜸)
  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
  set $trip_api http://trip-api.trip.svc.cluster.local:80;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;

  # 사이트 첫 주소는 새 화면(v2)으로. 주소 뒤 #탭/날짜 는 브라우저가 그대로 붙여 감
  location = / { return 302 /v2/$is_args$args; }
  location = /index.html { return 302 /v2/; }
  # 루트 서비스 워커 = 예전 화면 시절 서비스 워커를 걷어내는 것. 매니페스트는 예전에 홈 화면에 추가한 앱이 새 화면으로 열리게
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  # 아이콘·이미지 등은 길게
  location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=604800"; }

  # 예전 화면(v1)은 걷어냄: /v1/ 아래는 새 화면으로. 단 /v1/sw.js 는 폰에 남은 v1 서비스 워커를 걷어내는 것 (web/root/v1/sw.js)
  #  v1 코드(저장소 루트 App_*.html)는 Apps Script 비상 주소로만 씀 (Extras.js, 집 서버가 죽었을 때)
  location = /v1/sw.js { add_header Cache-Control "no-cache"; }
  location = /v1 { return 302 /v2/; }
  location ^~ /v1/ { return 302 /v2/; }

  # 새 화면(v2): /v2/ 아래. 본체는 항상 새로 확인, 이름에 해시가 붙은 파일(assets)은 1년
  location = /v2 { return 302 /v2/; }
  location = /v2/index.html { add_header Cache-Control "no-cache"; }
  location = /v2/sw.js { add_header Cache-Control "no-cache"; }
  location = /v2/manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  location ^~ /v2/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /v2/ { try_files $uri /v2/index.html; }

  # 실시간 알림 (SSE): 버퍼링 끄고 오래 열어둠
  location = /api/events {
    proxy_pass $trip_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  # ^~ : 아래 경로는 위의 확장자 규칙(.png 등)보다 먼저. 없으면 /api/map/…/*.png 가 정적 파일로 처리돼 404
  location ^~ /api/ {
    proxy_pass $trip_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;      # 일정 수정은 경로 다시 계산이라 오래 걸림
    client_max_body_size 64k;
    gzip off;                     # trip-api가 직접 압축
  }

  # 그 밖의 없는 주소는 새 화면으로
  location / { try_files $uri @v2; }
  location @v2 { return 302 /v2/; }

  # 쿠버네티스 프로브용
  location = /healthz { access_log off; return 200 "ok\n"; }
}
