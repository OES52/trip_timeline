# 정적 여행 타임라인 (nginx-unprivileged, 8080)
#  /api/   → trip-api  (Apps Script 프록시: 캐시·PIN·사진·출발 알림)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # 서비스 이름은 요청 때 찾음 (trip-api가 아직 없어도 nginx는 뜸)
  resolver kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off;
  set $trip_api http://trip-api.trip.svc.cluster.local:80;

  gzip on;
  gzip_min_length 1024;
  gzip_types text/html text/css application/javascript application/json image/svg+xml application/manifest+json;

  # 화면 본체·서비스 워커·매니페스트는 항상 새로 확인 (배포하면 바로 반영)
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /sw.js      { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache"; }
  # 아이콘·이미지 등은 길게
  location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?)$ { add_header Cache-Control "public, max-age=604800"; }

  # 새 화면(v2): /v2/ 아래. 본체는 항상 새로 확인, 이름에 해시가 붙은 파일(assets)은 1년
  location = /v2 { return 302 /v2/; }
  location = /v2/index.html { add_header Cache-Control "no-cache"; }
  location ^~ /v2/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location /v2/ { try_files $uri /v2/index.html; }

  # 실시간 알림 (SSE): 버퍼링 끄고 오래 열어둠
  location = /api/events {
    proxy_pass $trip_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  location /api/ {
    proxy_pass $trip_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;      # 일정 수정은 경로 다시 계산이라 오래 걸림
    client_max_body_size 64k;
    gzip off;                     # trip-api가 직접 압축
  }

  location / { try_files $uri /index.html; }

  # 쿠버네티스 프로브용
  location = /healthz { access_log off; return 200 "ok\n"; }
}
